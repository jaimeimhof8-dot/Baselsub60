  // Session abgelaufen/widerrufen oder in einem anderen Tab abgemeldet → zurück zum Login.
  // Kein await auf Supabase-Aufrufe in diesem Callback (sonst Deadlock in supabase-js).
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT" && USER) resetAuth("Du wurdest abgemeldet. Bitte erneut anmelden."); });
  const {data:{session}}=await sb.auth.getSession();
  if(session){ await onLogin(session.user); if(stCb && USER){ await stravaCallback(); render(); } return afterBoot(); }
  if(stCb){ cleanUrl(); loginMsg="Bitte zuerst anmelden, dann Strava verbinden."; }
  if(view!=="shared") view="login"; render();
}
/* Strava im Hintergrund aktualisieren, wenn die letzte Synchronisierung über eine Stunde her ist. */
function afterBoot(){
  if(stTok() && Date.now()-(S.strava.at||0)>36e5) stravaSync(true);
  // Erster Start / erstes Login ohne Strava: einmalig das Onboarding zeigen
  if(authed() && view==="today" && needsOnb()){ view="onb"; render(); }
}
window.addEventListener("online",()=>{ if(dirty) push(); });
/* Geteilter Link, während die App schon offen ist (nur der Hash ändert sich) */
window.addEventListener("hashchange",()=>{ const c=linkCode(location.hash); if(!c) return; const s=decodeSnapshot(c);
  if(!s) return toast("Der geteilte Link ist ungültig"); SHARED=s; menu(false); view="shared"; render(); window.scrollTo(0,0); });
document.addEventListener("visibilitychange",async()=>{
  if(!sb||!USER) return;
  if(document.visibilityState==="hidden"){ if(dirty){ clearTimeout(pushT); push(); } return; }
  if(dirty) return;
  const busy=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(await pull() && !busy) render();
});
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  if(f.dataset.form==="coach"){ if(!ccBusy) sendCoach($("#cc-in").value); return; }
  const btn=f.querySelector("button[type=submit]"); btn.disabled=true; loginMsg="";
  if(f.dataset.form==="login"){
    loginEmail=$("#le").value.trim().toLowerCase();
    const password=$("#lp").value;
    if(!/^\S+@\S+\.\S+$/.test(loginEmail)){ loginMsg="Bitte eine gültige E-Mail eingeben."; return render(); }
    if(!password){ loginMsg="Bitte das Passwort eingeben."; render(); return $("#lp").focus(); }
    if(!CLOUD){
      lsSet("hx:mock",JSON.stringify({name:loginWho,email:loginEmail})); setNames(loginWho);
      view="today"; render(); afterBoot(); return toast(`Angemeldet als ${loginWho} (Vorschau)`);
    }
    const {data,error}=await sb.auth.signInWithPassword({email:loginEmail,password});
    if(error){ loginMsg=loginError(error); render(); return $("#lp").focus(); }
    await onLogin(data.user); if(USER) afterBoot();
  }
});
/* Supabase-Fehler beim Login in verständliche Meldungen übersetzen */
function loginError(e){
  if(e.code==="invalid_credentials"||/invalid login credentials/i.test(e.message)) return "E-Mail oder Passwort falsch.";
  if(e.code==="email_not_confirmed") return "Diese E-Mail ist noch nicht bestätigt (Supabase → Authentication → Users).";
  if(e.status===429||/rate|seconds/i.test(e.message)) return "Zu viele Versuche. Bitte kurz warten.";
  if(e.name==="AuthRetryableFetchError"||e.status===0) return "Keine Verbindung. Bitte Internet prüfen.";
  return e.message;
}

/* ---------- Render + Events ---------- */
const VIEWS={today:vToday,week:vWeek,plan:vPlan,profile:vProfile,edit:vEdit,login:vLogin,import:vImport,strava:vStrava,shared:vShared,
  backup:vBackup,coach:vCoach,onb:vOnb};
function render(){
  RC=null;
  if(!authed() && view!=="shared") view="login";
  const left=Math.ceil((RACE-midnight(NOW))/dayMs);
  $("#cd").textContent=left>0?left:"🏁";
  const sd=$("#simdate"); sd.hidden=!SIM; if(SIM) sd.textContent=`Testmodus: Datum simuliert auf ${fmt(NOW)} ${NOW.getFullYear()}`;
  SUGS = view==="today" ? suggestions() : [];
  $("#main").innerHTML=VIEWS[view]();
  document.querySelectorAll("#nav button").forEach(b=>{ const on=b.dataset.v===view; b.classList.toggle("on",on); if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const bare=view==="login"||view==="shared"||view==="onb";
  $("#nav").hidden=bare; document.body.classList.toggle("bare",bare);
  document.querySelector(".top .menu-btn").style.visibility=bare?"hidden":"";
  document.querySelectorAll("[data-partner]").forEach(x=>x.textContent=PARTNER);
  $("#acct").innerHTML=acctHtml(true);
  const al=$("#acct .acct-link"); if(al){ al.classList.toggle("on",view==="profile"); if(view==="profile") al.setAttribute("aria-current","page"); }
  // Aktive Seite im Burger-Menü markieren (Trainingsplan = Heute/Woche/Plan)
  const mv=["week","plan"].includes(view)?"today":view;
  document.querySelectorAll("#sheet .mi[data-v]").forEach(b=>{ const on=b.dataset.v===mv; b.classList.toggle("on",on); if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
}
function go(v){
  if(["today","week","plan"].includes(view)) prevView=view;
  if(v==="inj" && view!=="move") injStart=null;
  // Verletzt/krank ist ein Tab im Coach, Tests & Benchmarks stehen im Profil
  if(v==="inj"){ coachTab="inj"; v="coach"; }
  if(v==="move"){ coachTab="move"; v="coach"; }
  if(v==="tests"){ profWho="me"; view="profile"; menu(false); render(); loadPartner(); return $("#tests").scrollIntoView(); }
  if(v==="profile"){ profWho="me"; loadPartner(); }
  if(v==="import" && imp.step!=="preview") imp={step:"pick"};
  view=v; if(v==="today") sel=null; menu(false); render(); window.scrollTo(0,0);
}
function menu(open){
  $("#sheet").classList.toggle("open",open); $("#scrim").classList.toggle("open",open);
  $("#sheet").setAttribute("aria-hidden",String(!open));
  if(open) $("#sheet").querySelector(".mi").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") menu(false);
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("mu")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }
const layout=()=>WIDE()?2:MID()?1:0;
let wasWide=layout();
addEventListener("resize",()=>{ const w=layout(); if(w!==wasWide){ wasWide=w; if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); } });

const CLICK="[data-mu],[data-v],[data-wk],[data-open],[data-sel],[data-r],[data-act],[data-back],[data-move],[data-swap],[data-injs],[data-injd],[data-injm],[data-edit],[data-ci],[data-sug],[data-sug-no],[data-who],[data-imp-all],[data-pb],[data-pd],[data-pgo]";
document.addEventListener("click",e=>{
  const t=e.target.closest(CLICK); if(!t) return;
  const d=t.dataset;
  if(d.mu){ soreSel=d.mu; const z=sore.ZONE[d.mu]; if(z) soreView=z.view;
    const t0=soreToday(); const o=S.sore[t0]=S.sore[t0]||{}; if(!o[d.mu]) o[d.mu]=soreAt(t0)[d.mu]||5; soreSave(); return render(); }
  if(d.act==="sore-view"){ soreView=d.view; return render(); }
  if(d.act==="sore-mirror"){ const m=sore.mirrorZone(soreSel), t0=soreToday(), o=S.sore[t0]=S.sore[t0]||{}; if(m){ o[m]=o[soreSel]||5; soreSave(); toast(`Auch ${sore.LABEL[m]} eingetragen`); } return render(); }
  if(d.v){ if(d.v==="coach" && t.closest("#sheet")) coachTab="chat"; return go(d.v); }
  if(d.back!==undefined) return go(view==="edit"&&editBack?editBack:prevView);
  if(d.move!==undefined){ moveFrom=+d.move; return go("move"); }
  if(d.edit!==undefined){ editFrom=+d.edit; editBack=view==="coach"?"coach":null; return go("edit"); }
  if(d.act==="mv-day"){ moveFrom=Math.max(0,Math.min(LAST,moveFrom+ +d.d)); return render(); }
  if(d.act==="mv-today"){ moveFrom=Math.max(0,Math.min(LAST,TODAY)); return render(); }
  if(d.act==="sore-done"){ soreSel=null; return render(); }
  if(d.act==="sore-del"){ const o=S.sore[soreToday()]; if(o) delete o[soreSel]; soreSel=null; soreSave(); return render(); }
  if(d.act==="sore-clear"){ delete S.sore[soreToday()]; soreSel=null; soreSave(); toast("Muskelkater zurückgesetzt"); return render(); }
  if(d.ci){ const [k,f,v]=d.ci.split("|"); const c=S.checkin[k]=S.checkin[k]||{}; if(c[f]===v) delete c[f]; else c[f]=v;
    ciOpen=true; save(); return render(); }
  if(d.act==="ci-edit"){ ciOpen=true; return render(); }
  if(d.act==="ci-done"){ ciOpen=false; return render(); }
  if(d.sug){ const s=SUGS.find(x=>x.id===d.sug); if(!s) return; applySug(s); save(); toast(s.type==="swap"?`${dayPlan(s.to).t} → ${shortDay(s.to)}`:"Plan angepasst"); return render(); }
  if(d.sugNo){ S.dismiss[d.sugNo]=1; save(); return render(); }
  if(d.act==="edit-save"){ const lines=$("#ed-i").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!lines.length) return toast("Mindestens eine Übung eintragen");
    const src=srcOf(editFrom), k=S.edit[src]&&S.edit[src].k; // vom Coach gesetzte Disziplin behalten
    S.edit[src]={t:$("#ed-t").value.trim(),i:lines,n:$("#ed-n").value.trim(),...(k?{k}:{})}; save(); toast("Einheit angepasst"); return go(editBack||prevView); }
  if(d.act==="edit-reset"){ delete S.edit[srcOf(editFrom)]; save(); toast("Original wiederhergestellt"); return go(editBack||prevView); }
  if(d.who){ const el=$("#le"); if(el) loginEmail=el.value.trim(); loginWho=d.who; return render(); }
  if(d.act==="logout"){ menu(false);
    if(!sb){ lsDel("hx:mock"); setNames("Jaime"); toast("Abgemeldet"); return render(); }
    if(!confirm("Abmelden? Deine Daten bleiben in der Cloud gespeichert und werden von diesem Gerät entfernt.")) return;
    (async()=>{
      if(dirty){ clearTimeout(pushT); await push(); }
      // Lokale Kopie nur löschen, wenn alles in der Cloud ist – sonst gingen Offline-Änderungen verloren
      const uid=USER.id, keep=dirty;
      if(!keep){ lsDel("hx:"+uid); lsDel("hx:"+uid+":strava"); lsDel("hx:names:"+uid); }
      lsDel("hx:last");
      resetAuth(keep?"Nicht alles war gespeichert. Die Einträge bleiben auf diesem Gerät und werden beim nächsten Login hochgeladen.":"");
      await sb.auth.signOut();
    })(); return; }
  if(d.swap!==undefined){
    const i=moveFrom, j=+d.swap, pulled=dayPlan(i).k==="rest", to=pulled?i:j;
    swapDays(i,j); save(); moveFrom=to; render();
    return toast(`${dayPlan(to).t} → ${shortDay(to)}`); }
  if(d.injs){ injStart=Math.max(0,Math.min(LAST,injStart+ +d.injs)); return render(); }
  if(d.injd){ injDays=+d.injd; return render(); }
  if(d.injm){ injMode=d.injm; return render(); }
  if(d.act==="skip"){ const k=keyI(moveFrom); if(S.skip[k]) delete S.skip[k]; else S.skip[k]=1; save();
    // Ausfall direkt dem Coach melden: er schlägt die Umplanung im Chat vor, übernommen wird erst nach Bestätigung
    if(S.skip[k] && coachReady() && !ccBusy){ toast("Ausgefallen – der Coach plant um"); coachTab="chat"; return sendCoach(coach.skipMessage(moveFrom,dayPlan(moveFrom).t)); }
    toast(S.skip[k]?"Ausgefallen – wähle unten einen neuen Tag":"Markierung entfernt"); return render(); }
  if(d.act==="restore"){ restoreDay(moveFrom); save(); toast("Original wiederhergestellt"); return render(); }
  if(d.act==="inj-from"){ injStart=Math.max(0,moveFrom); return go("inj"); }
  if(d.act==="inj-apply"){ applyInjury(injStart,injDays,injMode); save(); toast("Plan angepasst. Gute Besserung!"); return go(prevView); }
  if(d.act==="inj-end"){ endInjury(); save(); toast("Willkommen zurück – 3 Comeback-Einheiten geplant"); return go(prevView); }
  if(d.impAll!==undefined){ imp.all=d.impAll==="1"; return render(); }
  if(d.act==="imp-apply"){ const {plan,changed}=mergeImport(PLAN(),imp.parsed,{from:imp.all?0:Math.max(0,TODAY),name:imp.name});
    S.plan=plan; imp={step:"pick"}; wk=CURW; openDay=null; save(); toast(`Plan übernommen – ${changed.length} Tage aktualisiert`); return go("week"); }
  if(d.act==="imp-cancel"){ imp={step:"pick"}; return render(); }
  if(d.act==="imp-undo"){ if(!confirm(S.plan.prev?"Vorherigen Plan wiederherstellen?":"Importierten Plan verwerfen und den eingebauten Plan verwenden?")) return;
    S.plan=undoImport(S.plan); save(); toast("Plan wiederhergestellt"); return render(); }
  if(d.act==="strava-take"){ const i=+d.i, p=dayPlan(i), dk=keyI(i), a=actsOf(i).find(x=>strava.fits(p.k,x.group));
    p.i.forEach((_,j)=>S.done[dk+"|"+j]=1);
    const j=p.i.findIndex(t=>!isFiller(t)); if(a && j>=0 && !S.val[dk+"|"+j]) S.val[dk+"|"+j]=strava.summary(a);
    save(); toast("Von Strava übernommen"); return render(); }
  if(d.act==="st-connect"){ const id=$("#st-id").value.trim(), sec=$("#st-sec").value.trim();
    if(!/^\d+$/.test(id)||!sec) return toast("Client-ID und Secret eintragen");
    lsSet("hx:strava-id",id); lsSet("hx:strava-secret",sec); location.href=strava.authUrl(id,redirectUri()); return; }
  if(d.act==="st-sync") return stravaSync(false);
  if(d.act==="st-off"){ if(!confirm("Strava trennen? Bereits geladene Aktivitäten bleiben.")) return; lsDel(stKey()); stMsg=""; return render(); }
  if(d.act==="st-clear"){ if(!confirm("Alle Strava-Aktivitäten aus der App löschen?")) return; S.strava={acts:{},at:0}; save(); return render(); }
  if(d.act==="shared-close"){ SHARED=null; history.replaceState(null,"",location.pathname+location.search); return go("today"); }
  if(d.wk){ wk=Math.max(0,Math.min(NWEEKS-1,wk+ +d.wk)); openDay=null; return render(); }
  if(d.pb){ planBlk=planBlk===d.pb?null:d.pb; planDay=null; render(); const el=document.querySelector(`[data-pb="${CSS.escape(d.pb)}"]`); return el&&el.scrollIntoView({block:"nearest"}); }
  if(d.pd!==undefined){ const i=+d.pd; planDay=planDay===i?null:i; return render(); }
  if(d.pgo!==undefined){ const i=+d.pgo; wk=Math.floor(i/7); openDay=i; return go("week"); }
  if(d.open!==undefined){ const i=+d.open; openDay=openDay===i&&!WIDE()?null:i; return render(); }
  if(d.sel!==undefined){ sel=+d.sel===TODAY?null:+d.sel; render(); return window.scrollTo(0,0); }
  if(d.r){ const [k,r]=d.r.split("|"); if(S.rpe[k]==r) delete S.rpe[k]; else S.rpe[k]=+r; save(); return render(); }
  if(d.act==="menu") return menu(true);
  if(d.act==="close") return menu(false);
  if(d.act==="bk-export") return exportBackup();
  if(d.act==="bk-share"){ const txt=JSON.stringify(makeBackup(S,{user:ME}));
    if(navigator.share) navigator.share({title:"Basel Sub-60 Backup",text:txt}).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("Backup kopiert"));
    else prompt("Backup:",txt); return; }
  if(d.act==="bk-cancel"){ bkp=null; return render(); }
  if(d.act==="bk-apply"){ if(!bkp||!confirm("Wirklich alle aktuellen Einträge durch das Backup ersetzen?")) return;
    S=fill(Object.assign(def(),bkp.data)); bkp=null; save(); toast("Backup eingespielt"); return render(); }
  if(d.act==="onb-skip"){ S.onb.strava=Date.now(); save(); return go("today"); }
  if(d.act==="cc-apply"){ const m=S.chat[+d.k]; if(!m||m.state!=="open") return;
    const {valid}=coachCheck(m.actions); if(!valid.length) return toast("Keine Vorschläge mehr anwendbar");
    applyCoach(valid); m.state="applied"; save(); toast(`Plan angepasst (${valid.length} ${valid.length===1?"Änderung":"Änderungen"})`); return render(); }
  if(d.act==="cc-dismiss"){ const m=S.chat[+d.k]; if(m){ m.state="dismissed"; save(); } return render(); }
  if(d.act==="prof-who"){ profWho=d.whoP; if(profWho==="partner") loadPartner(); return render(); }
  if(d.act==="cc-tab"){ coachTab=d.tab; return render(); }
  if(d.act==="cc-clear"){ if(!confirm("Chatverlauf löschen? Der Plan bleibt unverändert.")) return; S.chat=[]; ccErr=""; save(); return render(); }
  if(d.act==="cc-copy"){ try{ copyCoach(coach.buildCoachRequest({context:coachCtx(),chat:S.chat,message:$("#cc-in").value})); }catch(e){ toast(e.message); } return; }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="sore-r"){ soreSave(); return render(); }
  if(t.dataset.file){ const f=t.files&&t.files[0]; t.value=""; if(!f) return;
    if(t.dataset.file==="plan") return importFile(f);
    if(t.dataset.file==="backup"){ try{ bkp={name:f.name,...readBackup(await f.text())}; }catch(err){ toast(err.message); } return render(); }
    try{ const n=mergeActs(strava.parseActivities(await f.text())); save(); toast(n?`${n} neue Aktivitäten importiert`:"Keine neuen Aktivitäten seit Planstart"); }
    catch(err){ toast(err.code==="csv_format"?"Das ist keine Strava-activities.csv":"Datei konnte nicht gelesen werden"); }
    return render(); }
  if(t.dataset.c){ if(t.checked) S.done[t.dataset.c]=1; else delete S.done[t.dataset.c];
    // Vorbelegtes Standardgewicht beim Abhaken als Wert übernehmen
    const pv=document.querySelector(`[data-v2="${t.dataset.c}"].pre`); if(t.checked && pv && !S.val[t.dataset.c]){ S.val[t.dataset.c]=pv.value; pv.classList.remove("pre"); }
    save();
    const ex=t.closest(".ex"); if(ex) ex.classList.toggle("is-done",t.checked);
    // Fortschritt ohne Neuaufbau aktualisieren (Fokus in Eingabefeldern bleibt)
    const card=t.closest(".card"); if(card){ const all=card.querySelectorAll("[data-c]"), n=all.length, dn=[...all].filter(x=>x.checked).length;
      const bar=card.querySelector(".prog i"); if(bar) bar.style.width=(dn/n*100)+"%";
      const s=card.querySelector(".prog+.sub"); if(s) s.textContent=dn+" von "+n+" erledigt"; } }
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset; let redo=false;
  if(t.id==="sore-r"&&soreSel){ const v=+t.value, t0=soreToday(); (S.sore[t0]=S.sore[t0]||{})[soreSel]=v;
    const l=$("#sore-v"); if(l) l.textContent=`${v}/10 · ${sore.strength(v)}`;
    document.querySelectorAll(`.mu[data-mu="${soreSel}"]`).forEach(el=>{ el.setAttribute("fill",soreFill(v)); el.setAttribute("fill-opacity",".9"); }); return; }
  if(t.id==="cc-in"){ ccDraft=t.value; return; }
  if(d.n!==undefined){ S.notes[d.n]=t.value; }
  else if(d.v2){ S.val[d.v2]=t.value; t.classList.remove("pre"); }
  else if(t.readOnly || ((d.w||d.l||d.s||d.t) && (view!=="profile"||profWho!=="me"))) return;
  else if(d.w){ const v=cleanWeight(t.value); if(v) S.weights[d.w]=v; else delete S.weights[d.w]; }
  else if(d.l){ const [w,r]=d.l.split("|"); if(w!==myCol()) return; S.tests.lauf[w][+r]=t.value; redo=true; }
  else if(d.s){ const [r,w]=d.s.split("|"); if(w!==myCol()) return; S.tests.station[r]=S.tests.station[r]||{}; S.tests.station[r][w]=t.value; redo=true; }
  else if(d.t){ S.tests.trans[+d.t]=t.value; redo=true; }
  else return;
  save();
  if(redo){ const id=d.l||d.s||d.t, attr=d.l?"data-l":d.s?"data-s":"data-t", p=t.selectionStart;
    const y=window.scrollY; render(); window.scrollTo(0,y);
    const el=document.querySelector(`[${attr}="${id}"]`); if(el){ el.focus(); try{el.setSelectionRange(p,p);}catch(_){} } }
});

boot();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
