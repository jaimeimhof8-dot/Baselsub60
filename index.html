<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- Sicherheit: Daten dürfen nur an die eigenen Dienste gehen (Supabase, Garmin-Login-Server, Strava). Neue Dienste hier ergänzen. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://hyrox-garmin-login.vercel.app https://www.strava.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Basel Sub-60" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Basel Sub-60</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- defer: Splash-Screen erscheint sofort, Skripte laufen danach in dieser Reihenfolge -->
    <script src="config.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
      integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
      crossorigin="anonymous"
      defer
    ></script>
    <!-- Animationen im Dashboard: GSAP, feste Version mit Prüfsumme (SRI) -->
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"
      integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly"
      crossorigin="anonymous"
      defer
    ></script>
    <style>
      :root {
        color-scheme: dark;
        /* Glas-Design: dunkler, ruhiger Hintergrund; Karten sind durchscheinende Glasflächen mit heller Oberkante.
     --card/--surface2 sind halbtransparent (der Hintergrund scheint durch), --well = eingelassene Felder (Eingaben, Segmente) */
        --bg: #06070a;
        --card: #0e1016;
        --surface2: #1b1e29;
        --well: #161922;
        --text: #f5f5f7;
        --muted: #9a9ba3;
        --line: rgba(255, 255, 255, 0.06);
        --edge: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        --tint: #3b5375;
        --accent: #ffd21f;
        --on-accent: #16181a;
        --ok: #30d158;
        --warn: #ff9f0a;
        --danger: #ff6961;
        --strava: #fc6a2c;
        --garmin: #11a9ed;
        --kraft: #ff8a4c;
        --lauf: #64a8ff;
        --bike: #4cd964;
        --station: #bf8cff;
        --sim: #ff6b5e;
        --rest: #6d7176;
        --race: #ffd21f;
        /* Zahlen und kleine Labels: schmale Sportschrift. Titel und Text: Systemschrift (SF Pro auf dem iPhone) */
        --f-head: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
        --f-title:
          -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        --f-body:
          -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI Variable Text", "Segoe UI", "IBM Plex Sans", system-ui,
          sans-serif;
        /* Abstände: ein 4-px-Raster für alles */
        --s1: 4px;
        --s2: 8px;
        --s3: 12px;
        --s4: 16px;
        --s5: 20px;
        --s6: 24px;
        --s8: 32px;
        --r-s: 11px;
        --r-m: 14px;
        --r-l: 22px;
        --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
        --glass: rgba(46, 50, 60, 0.5);
        --blur: saturate(180%) blur(22px);
        --tabs-h: 62px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
      }
      /* Hintergrund hinter dem Glas: ruhiger dunkler Verlauf, oben leicht in der Farbe der heutigen Disziplin (--tint).
   Fest stehend und ohne Weichzeichner – die Karten brauchen deshalb kein teures backdrop-filter. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            120% 55% at 20% -5%,
            color-mix(in srgb, var(--tint) 26%, transparent),
            transparent 70%
          ),
          radial-gradient(
            90% 50% at 100% 105%,
            rgba(60, 78, 110, 0.22),
            transparent 70%
          ),
          linear-gradient(180deg, #12151c 0%, #0a0b10 55%, var(--bg) 100%);
      }
      body {
        color: var(--text);
        font-family: var(--f-body);
        font-size: 16px;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        padding-bottom: calc(
          var(--tabs-h) + var(--s6) + env(safe-area-inset-bottom)
        );
      }
      body.bare {
        padding-bottom: env(safe-area-inset-bottom);
      }
      button,
      textarea,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--f-title);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.12;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 28px;
        letter-spacing: -0.025em;
      }
      h3 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
      }
      .cap {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        margin: var(--s6) 0 var(--s3);
      }
      .cap:first-child {
        margin-top: 0;
      }
      .mt-1 {
        margin-top: var(--s1);
      }
      .mt-2 {
        margin-top: var(--s2);
      }
      .mt-3 {
        margin-top: var(--s3);
      }
      .mt-4 {
        margin-top: var(--s4);
      }
      .mt-5 {
        margin-top: var(--s5);
      }
      .center {
        text-align: center;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--s3);
      }
      [hidden] {
        display: none !important;
      }

      /* Kopf wie in iOS-Apps: keine Leiste, kein Logo (das steht nur im Startbildschirm).
   Der Countdown steht frei über dem Inhalt und scrollt mit, das Menü schwebt als Glas-Kreis oben rechts. */
      .top {
        position: relative;
        z-index: 5;
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        padding: calc(var(--s3) + env(safe-area-inset-top))
          calc(var(--s4) + 56px) 0 max(var(--s4), env(safe-area-inset-left));
      }
      .top .menu-btn {
        position: fixed;
        z-index: 7;
        top: calc(var(--s3) + 2px + env(safe-area-inset-top));
        right: max(var(--s4), env(safe-area-inset-right));
        background: var(--glass);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow:
          var(--edge),
          0 6px 18px rgba(0, 0, 0, 0.3);
      }
      /* iPhone-Statusleiste: hauchdünner Glasstreifen, damit beim Scrollen nichts unter Uhrzeit und Akku liegt */
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: env(safe-area-inset-top);
        z-index: 8;
        pointer-events: none;
        background: rgba(10, 12, 16, 0.5);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }
      .brand {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        justify-self: start;
        white-space: nowrap;
      }
      .brand b {
        background: var(--accent);
        color: var(--on-accent);
        padding: 0 6px;
        margin-left: var(--s1);
        border-radius: 5px;
      }
      /* Countdown: grosse Zahl, daneben klein „Tage bis Basel“ */
      /* Countdown ist der Motivationsanker der App: gross wie ein iOS-„Large Title“, wächst mit der Displaybreite (40–48 px) */
      .cd {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
      }
      .cd span {
        font-family: var(--f-head);
        font-size: clamp(40px, 11.5vw, 48px);
        font-weight: 700;
        line-height: 1;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .cd small {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.15;
        color: var(--muted);
      }
      .menu-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: var(--edge);
        display: grid;
        place-items: center;
        padding: 0;
        transition: transform 0.2s var(--ease);
      }
      .menu-btn:active {
        transform: scale(0.9);
      }
      .menu-btn svg {
        width: 20px;
        height: 20px;
        fill: var(--text);
      }
      main {
        padding: var(--s4);
        max-width: 640px;
        margin: 0 auto;
      }
      .sim-date {
        background: rgba(255, 192, 77, 0.12);
        color: var(--warn);
        font-size: 13px;
        text-align: center;
        padding: var(--s2) var(--s4);
      }

      /* Ansichts-Kopf */
      .vh {
        margin-bottom: var(--s5);
      }
      .vh .sub {
        margin-top: var(--s2);
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: none;
        border: 0;
        color: var(--muted);
        font-weight: 600;
        padding: 0;
        min-height: 44px;
        margin-bottom: var(--s2);
      }

      /* Karten */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: var(--s5);
        margin-bottom: var(--s4);
        box-shadow: var(--edge);
      }
      .card.tight {
        padding: var(--s4);
      }
      /* Einheit des Tages: Glas, leicht in der Farbe der Disziplin getönt */
      .card.hero {
        background: linear-gradient(
          180deg,
          color-mix(
            in srgb,
            var(--kc, var(--accent)) 13%,
            rgba(255, 255, 255, 0.06)
          ),
          var(--card) 70%
        );
        border-color: color-mix(
          in srgb,
          var(--kc, var(--accent)) 22%,
          rgba(255, 255, 255, 0.1)
        );
      }
      /* Erledigte Einheit: schmaler Balken statt ganzer Karte (antippen = Details) */
      .done-bar {
        display: flex;
        align-items: center;
        gap: var(--s3);
        width: 100%;
        text-align: left;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        padding: var(--s3) var(--s4);
        border: 1px solid var(--line);
        border-left: 5px solid var(--kc, var(--ok));
        background: var(--card);
        border-radius: var(--r-m);
        min-height: 60px;
      }
      .done-bar .ck {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--kc, var(--ok));
        color: #101214;
        font-weight: 700;
      }
      .done-bar .t {
        flex: 1;
        min-width: 0;
      }
      .done-bar .t b {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .done-bar .more {
        flex: none;
        font-size: 12px;
        color: var(--muted);
      }
      .done-bar .miss {
        color: var(--warn);
      }
      .card.closing {
        overflow: hidden;
      }
      .card.closing > * {
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.3s ease;
      }
      .card.closing.fade > * {
        opacity: 0;
        transform: translateY(-8px);
      }
      .prog.full i {
        background: var(--ok);
      }
      .card > :last-child {
        margin-bottom: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--s2);
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .k-kraft {
        --kc: var(--kraft);
      }
      .k-lauf {
        --kc: var(--lauf);
      }
      .k-bike {
        --kc: var(--bike);
      }
      .k-station {
        --kc: var(--station);
      }
      .k-sim {
        --kc: var(--sim);
      }
      .k-rest {
        --kc: var(--rest);
      }
      .k-race {
        --kc: var(--race);
      }
      .kind {
        font-size: 13px;
        font-weight: 600;
        color: var(--kc, var(--muted));
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: var(--kc, var(--rest));
      }
      .status {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .status.done {
        color: var(--ok);
      }
      .prog {
        height: 6px;
        background: var(--surface2);
        border-radius: 4px;
        overflow: hidden;
        margin: var(--s4) 0 var(--s2);
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--kc, var(--accent));
        transition: width 0.25s;
      }
      .session-h h1 {
        margin-top: var(--s3);
      }
      .session-h .badges {
        margin-top: var(--s3);
      }

      /* Übungen */
      .exs {
        margin-top: var(--s4);
      }
      .ex {
        border-top: 1px solid var(--line);
        padding: var(--s3) 0;
      }
      .ex:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .ex-h {
        display: flex;
        gap: var(--s3);
        align-items: flex-start;
        cursor: pointer;
      }
      .ex-h input {
        width: 24px;
        height: 24px;
        margin: 0;
        flex: none;
        accent-color: var(--ok);
      }
      .ex-h span {
        flex: 1;
        font-size: 15.5px;
      }
      .ex.is-done .ex-h span {
        color: var(--muted);
        text-decoration: line-through;
      }
      .ex-v {
        display: flex;
        gap: var(--s2);
        align-items: center;
        margin: var(--s2) 0 0 38px;
      }
      .ex-v input {
        flex: 1;
        min-width: 0;
      }
      .last {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      button.last {
        background: none;
        border: 1px dashed var(--line);
        border-radius: var(--r-s);
        min-height: 44px;
        padding: 6px 10px;
        flex: 0 1 auto;
        max-width: 100%;
        white-space: normal;
        text-align: left;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      button.last.up {
        border-color: rgba(255, 210, 31, 0.45);
        color: var(--accent);
      }
      button.last small {
        color: var(--muted);
        font-size: 11px;
      }
      .quick {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
        margin: var(--s2) 0 0 38px;
      }
      @media (max-width: 370px) {
        .quick {
          margin-left: 0;
        }
      }
      .tgt-l {
        color: var(--accent);
      }
      .sban {
        border-color: rgba(252, 106, 44, 0.45);
        background:
          linear-gradient(rgba(252, 106, 44, 0.07), rgba(252, 106, 44, 0.07)),
          var(--card);
      }
      .ytag {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        color: var(--warn);
        background: rgba(255, 192, 77, 0.12);
        border-radius: 6px;
        padding: 1px 6px;
        margin-left: 4px;
        vertical-align: 1px;
      }
      button.last:active {
        border-color: var(--accent);
        color: var(--text);
      }
      .hint {
        background: var(--surface2);
        border-radius: var(--r-s);
        padding: var(--s3);
        font-size: 14px;
        margin-top: var(--s4);
        color: var(--muted);
      }
      .hint:first-child {
        margin-top: 0;
      }
      .target {
        background: rgba(255, 210, 31, 0.12);
        border: 1px solid rgba(255, 210, 31, 0.35);
        border-radius: var(--r-s);
        padding: var(--s3);
        font-size: 14px;
        margin-top: var(--s4);
      }
      .target b {
        color: var(--accent);
      }
      .target.bad {
        border-color: rgba(255, 138, 128, 0.4);
        background: rgba(255, 138, 128, 0.1);
      }
      .target.bad b {
        color: var(--danger);
      }

      /* Eingaben */
      input[type="text"],
      input[type="number"],
      input[type="password"],
      input[type="email"],
      textarea {
        width: 100%;
        font-size: 16px;
        padding: 9px 12px;
        border-radius: var(--r-s);
        border: 1px solid var(--line);
        background: var(--well);
        min-height: 44px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #80848a;
        opacity: 1;
      } /* 5,0:1 auf --bg, klar heller als getippter Text */
      textarea {
        min-height: 76px;
        resize: vertical;
        display: block;
      }
      input:focus,
      textarea:focus,
      button:focus-visible,
      .file:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .lbl {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin: var(--s5) 0 var(--s2);
      }
      .lbl:first-child {
        margin-top: 0;
      }
      .pw {
        position: relative;
      }
      .pw input {
        padding-right: 48px;
      }
      .pw button {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--muted);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pw svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pw .off {
        display: none;
      }
      .pw.show .on {
        display: none;
      }
      .pw.show .off {
        display: block;
      }

      /* Buttons */
      .btn {
        min-height: 48px;
        padding: 0 var(--s4);
        border-radius: var(--r-m);
        border: 1px solid var(--line);
        background: var(--card);
        font-weight: 600;
        font-size: 15px;
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--s2);
        text-decoration: none;
        color: var(--text);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.strava {
        background: var(--strava);
        border-color: var(--strava);
        color: #fff;
      }
      .btn.garmin {
        background: var(--garmin);
        border-color: var(--garmin);
        color: #fff;
      }
      .btn.sm {
        min-height: 44px;
        font-size: 14px;
        width: auto;
        padding: 0 var(--s3);
      }
      .btn {
        box-shadow: var(--edge);
        transition:
          transform 0.2s var(--ease),
          filter 0.2s,
          background-color 0.2s,
          border-color 0.2s;
      }
      .btn.ghost {
        box-shadow: none;
      }
      .btn:active:not(:disabled) {
        transform: scale(0.97);
      }
      /* Eindrücken beim Antippen (wie iOS): nur transform, läuft auf der Grafikkarte */
      .strip button,
      .day,
      .done-bar,
      .chips button,
      .seg button,
      .lchips button,
      .opt,
      .mi,
      .blk,
      .wk button {
        transition:
          transform 0.2s var(--ease),
          background-color 0.2s,
          border-color 0.2s,
          color 0.2s;
      }
      .strip button:active,
      .done-bar:active,
      .chips button:active,
      .seg button:active,
      .lchips button:active,
      .opt:active,
      .wk button:active:not(:disabled) {
        transform: scale(0.94);
      }
      .day:active,
      .mi:active,
      .blk:active {
        transform: scale(0.985);
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .btns {
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        margin-top: var(--s4);
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s2);
      }
      .file {
        position: relative;
        overflow: hidden;
      }
      .file input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      /* Wochenleiste + Tagesliste */
      .strip {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--s1);
      }
      .strip button {
        background: var(--card);
        box-shadow: var(--edge);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: var(--s2) 0 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .strip .dn {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      .strip .dd {
        font-weight: 600;
        font-size: 19px;
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .strip button.today {
        border-color: var(--accent);
        box-shadow: inset 0 -3px 0 var(--accent);
      }
      .strip button.sel {
        border-color: var(--text);
      }
      .strip .dot.done {
        background: var(--ok);
      }
      .strip .dot.off {
        opacity: 0.35;
      }
      .list {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: 0 var(--s4);
        margin-bottom: var(--s4);
      }
      .day {
        display: flex;
        gap: var(--s3);
        align-items: center;
        padding: var(--s3) 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
        min-height: 64px;
        width: 100%;
        background: none;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        text-align: left;
        position: relative;
      }
      .list > .day:first-child {
        border-top: 0;
      }
      .day::before {
        content: "";
        position: absolute;
        left: calc(-1 * var(--s4));
        top: var(--s3);
        bottom: var(--s3);
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--kc);
        opacity: 0.9;
      }
      .day.k-rest::before {
        opacity: 0.25;
      }
      .day .d {
        width: 38px;
        flex: none;
        font-weight: 600;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.1;
      }
      .day .d b {
        display: block;
        font-size: 21px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .day .t {
        flex: 1;
        min-width: 0;
      }
      .day .t b {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .day.today .d b {
        color: var(--accent);
      }
      .day.open {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03),
          transparent
        );
      }
      .day .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--s1);
        flex: none;
        max-width: 45%;
      }
      .day-body {
        padding: 0 0 var(--s4);
      }
      .day-body .card {
        margin: 0;
        background: var(--well);
      }
      .wk {
        display: flex;
        gap: var(--s3);
        align-items: center;
      }
      .wk button {
        width: 46px;
        height: 46px;
        border-radius: var(--r-m);
        border: 1px solid var(--line);
        background: var(--card);
        font-size: 22px;
        flex: none;
        padding: 0;
      }
      .wk button:disabled {
        opacity: 0.3;
      }
      .wk div {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .wk .sub {
        margin-top: var(--s1);
      }
      .wsum {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--s2);
        margin: var(--s4) 0;
      }
      .xsum {
        margin: calc(-1 * var(--s2)) 0 var(--s4);
      }
      .extras .lbl {
        margin-top: var(--s5);
      }
      .xrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s2);
        padding: var(--s2) 0;
        border-top: 1px solid var(--line);
      }
      .xrow span {
        flex: 1;
        font-size: 15px;
      }
      .xrow .btn {
        flex: none;
        width: 44px;
        padding: 0;
      }
      .xform {
        border-top: 1px solid var(--line);
        padding-top: var(--s3);
      }
      .solo-t[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .xcause {
        margin-top: var(--s2);
        font-size: 13px;
        color: var(--text);
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: var(--s3);
        text-align: center;
      }
      .stat b {
        display: block;
        font-family: var(--f-head);
        font-size: 24px;
        line-height: 1.05;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .chiprow {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
        justify-content: center;
        margin-top: var(--s3);
      }

      /* Plan */
      /* Plan: Blöcke als Akkordeon → Wochen → Tage (Tag aufklappbar für die Übungen) */
      .blk {
        display: flex;
        gap: var(--s4);
        align-items: center;
        width: 100%;
        padding: var(--s4) 0;
        background: none;
        border: 0;
        border-top: 1px solid var(--line);
        text-align: left;
        cursor: pointer;
        min-height: 64px;
      }
      .list > .blk:first-child {
        border-top: 0;
      }
      .blk .tag {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 26px;
        width: 34px;
        flex: none;
        line-height: 1;
        color: var(--accent);
        text-align: center;
      }
      .blk.cur .tag {
        background: var(--accent);
        color: var(--on-accent);
        border-radius: 10px;
        padding: var(--s1) 0;
      }
      .blk .t {
        flex: 1;
        min-width: 0;
      }
      .blk .t b {
        display: block;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .blk .t .sub {
        display: block;
        margin-top: 2px;
      }
      .blk .chev {
        font-size: 24px;
        color: var(--muted);
        flex: none;
        transition: transform 0.2s;
      }
      .blk[aria-expanded="true"] .chev {
        transform: rotate(90deg);
      }
      @media (prefers-reduced-motion: reduce) {
        .blk .chev {
          transition: none;
        }
      }
      .blk-body {
        padding: 0 0 var(--s3);
      }
      .pw-h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--s3);
        padding: var(--s4) 0 var(--s2);
        border-top: 1px solid var(--line);
      }
      .pw-h h3 {
        font-size: 17px;
      }
      .pw-h.cur h3 {
        color: var(--accent);
      }
      .pw-h .sub {
        text-align: right;
        font-size: 13px;
      }
      .day.sm {
        min-height: 48px;
        padding: var(--s2) 0;
        border-top-color: rgba(255, 255, 255, 0.04);
      }
      .day.sm .d b {
        font-size: 18px;
      }
      .pday-body {
        padding: 0 0 var(--s3) 50px;
        font-size: 14px;
      }
      .pday-body ul {
        margin: 0;
        padding-left: var(--s4);
      }
      .pday-body li {
        padding: 2px 0;
      }
      .pday-body .hint {
        margin-top: var(--s2);
      }

      /* Tabs */
      /* Tab-Leiste: schwebende Glas-Pille. Die helle Markierung (.tab-ind) gleitet per transform zum aktiven Tab –
   ein einziges Element auf der Grafikkarte, deshalb flüssig, auch während die Seite neu aufgebaut wird. */
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
        background: var(--glass);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-width: 1px 0 0;
        border-radius: 22px 22px 0 0;
        box-shadow:
          var(--edge),
          0 -6px 24px rgba(0, 0, 0, 0.3);
      }
      .tab-ind {
        position: absolute;
        top: 4px;
        bottom: calc(4px + env(safe-area-inset-bottom));
        left: 4px;
        width: calc((100% - 8px) / 4);
        border-radius: 26px;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transform: translateX(calc(var(--ti, 0) * 100%));
        transition: transform 0.5s var(--ios);
        will-change: transform;
      }
      .tabs.no-ind .tab-ind {
        opacity: 0;
      }
      .tabs button {
        position: relative;
        background: none;
        border: 0;
        border-radius: 26px;
        min-height: calc(var(--tabs-h) - 8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        transition:
          color 0.25s,
          transform 0.2s var(--ease);
      }
      .tabs button:active {
        transform: scale(0.94);
      }
      .tabs svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tabs button.on {
        color: var(--text);
      }
      .tabs button.on svg {
        stroke: var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        .tab-ind {
          transition: none;
        }
      }

      .ci-mini h3 {
        font-size: 17px;
      }


      /* Hold-to-Complete (800 ms): grüner Fill von links nach rechts, leichtes Einsinken */
      .hold {
        position: relative;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        cursor: pointer;
        transition: transform 0.25s var(--ios);
      }
      .hold-fill {
        position: absolute;
        inset: 0;
        background: rgba(16, 185, 129, 0.2);
        border-left: 2px solid #10b981;
        clip-path: inset(0 100% 0 0);
        transition: clip-path 0.18s var(--ios);
        pointer-events: none;
      }
      .hold.holding {
        transform: scale(0.98);
      }
      .hold.holding .hold-fill {
        clip-path: inset(0 0 0 0);
        transition: clip-path 0.8s linear;
      }
      .hold.held .hold-fill {
        clip-path: inset(0 0 0 0);
        background: rgba(16, 185, 129, 0.45);
      }
      .hold > :not(.hold-fill) {
        position: relative;
      }
      .ex-h.hold {
        align-items: center;
        padding: var(--s3) var(--s4);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        background: var(--well);
        min-height: 56px;
      }
      .hold-hint {
        font-style: normal;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        flex: none;
      }

      /* RPE-Scrubber: Zahl + Farbe live, Füllung bis zum Daumen */
      .rpe-s {
        --rc: hsl(200 85% 58%);
        --p: 44%;
        margin-top: var(--s2);
      }
      .rpe-head {
        display: flex;
        align-items: baseline;
        gap: var(--s3);
        min-height: 44px;
      }
      .rpe-n {
        font-family: var(--f-head);
        font-size: 40px;
        line-height: 1;
        color: var(--rc);
        min-width: 1.2ch;
        transition: color 0.15s;
      }
      .rpe-t {
        flex: 1;
        color: var(--muted);
        font-size: 14px;
      }
      .rpe-x {
        border: 0;
        background: none;
        color: var(--muted);
        width: 44px;
        height: 44px;
        font-size: 16px;
        margin: -8px -10px 0 0;
      }
      .rpe-s.unset .rpe-n {
        color: var(--muted);
      }
      .rpe-track {
        position: relative;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: var(--s2);
      }
      /* Verlauf liegt fest auf der Skala (1 Eisblau … 10 Puls-Rot) und wird bis zum Wert aufgedeckt */
      .rpe-fill {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          #7dd3fc 0%,
          #10b981 38%,
          #facc15 72%,
          #ef4444 100%
        );
        clip-path: inset(0 calc((1 - var(--pf, 0.44)) * (100% - 6px) + 3px) 0 0);
        pointer-events: none;
      }
      .rpe-s.unset .rpe-fill {
        opacity: 0;
      }
      .rpe-range {
        -webkit-appearance: none;
        appearance: none;
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        touch-action: pan-y;
        cursor: pointer;
      }
      .rpe-range::-webkit-slider-runnable-track {
        height: 34px;
        background: transparent;
      }
      .rpe-range::-moz-range-track {
        height: 34px;
        background: transparent;
      }
      .rpe-range::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 6px;
        height: 24px;
        margin-top: 5px;
        border-radius: 3px;
        background: #fff;
        border: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .rpe-range::-moz-range-thumb {
        width: 6px;
        height: 24px;
        border-radius: 3px;
        background: #fff;
        border: 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .rpe-s.unset .rpe-range::-webkit-slider-thumb {
        opacity: 0.55;
      }
      .rpe-s.unset .rpe-range::-moz-range-thumb {
        opacity: 0.55;
      }
      .rpe-scale {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        text-align: center;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .rpe-scale .tgt {
        color: var(--accent);
        font-weight: 700;
      }
      /* Menü-Schublade (von rechts) */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s,
          visibility 0s 0.25s;
      }
      .scrim.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.25s;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        width: min(340px, 88vw);
        overflow-y: auto;
        background: rgba(22, 25, 32, 0.72);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        border-left: 1px solid var(--line);
        padding: calc(var(--s3) + env(safe-area-inset-top)) var(--s4)
          calc(var(--s5) + env(safe-area-inset-bottom));
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.25s ease,
          visibility 0s 0.25s;
      }
      .drawer.open {
        transform: none;
        visibility: visible;
        transition: transform 0.25s ease;
      }
      .drawer-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--s2);
      }
      .drawer .cap {
        margin: var(--s5) 0 var(--s1);
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .scrim,
        .prog i {
          transition: none;
        }
      }
      .mi {
        display: flex;
        gap: var(--s4);
        align-items: center;
        width: 100%;
        padding: var(--s3) var(--s1);
        background: none;
        border: 0;
        border-top: 1px solid var(--line);
        text-align: left;
        min-height: 60px;
      }
      .cap + .mi {
        border-top: 0;
      }
      .mi svg {
        width: 22px;
        height: 22px;
        stroke: var(--accent);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .mi b {
        display: block;
        font-weight: 600;
      }
      .mi .sub {
        display: block;
      }
      .mi.on b {
        color: var(--accent);
      }

      /* Coach-Chat */
      .chat {
        display: flex;
        flex-direction: column;
        gap: var(--s3);
        margin-bottom: var(--s4);
      }
      .note + .chat {
        margin-top: var(--s4);
      }
      .msg {
        max-width: 88%;
        padding: var(--s3) var(--s4);
        border-radius: var(--r-m);
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent);
        color: var(--on-accent);
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
      }
      .msg.err {
        align-self: center;
        background: none;
        color: var(--danger);
        font-size: 13px;
        padding: 0;
      }
      .prop {
        margin-top: var(--s3);
        border-top: 1px solid var(--line);
        padding-top: var(--s3);
        white-space: normal;
      }
      .prop li {
        margin: var(--s1) 0;
      }
      .prop li.bad {
        color: var(--muted);
        text-decoration: line-through;
      }
      .prop ul {
        margin: 0;
        padding-left: 18px;
      }
      .chat-in textarea {
        min-height: 88px;
      }

      /* Onboarding */
      .onb {
        max-width: 460px;
        margin: var(--s6) auto 0;
      }
      .onb .av {
        width: 56px;
        height: 56px;
        font-size: 26px;
        background: var(--strava);
        color: #fff;
        margin-bottom: var(--s4);
      }
      .onb ul {
        margin: var(--s3) 0 0;
        padding-left: 18px;
        color: var(--muted);
      }
      .onb li {
        margin: var(--s1) 0;
      }

      /* Konto */
      .acct {
        display: flex;
        gap: var(--s3);
        align-items: center;
      }
      .av {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        display: grid;
        place-items: center;
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 20px;
        flex: none;
      }
      .av.alt {
        background: var(--lauf);
      }
      .av.off {
        background: var(--surface2);
        color: var(--muted);
      }
      .login {
        max-width: 420px;
        margin: var(--s8) auto 0;
      }
      .login .tag {
        color: var(--muted);
        text-align: center;
        margin: 0 0 var(--s5);
      }
      .note {
        border: 1px dashed var(--line);
        border-radius: var(--r-m);
        padding: var(--s3);
        font-size: 13px;
        color: var(--muted);
        margin-top: var(--s4);
      }

      /* Tests */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        padding: var(--s1) 3px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
      }
      td.l {
        font-size: 13px;
        color: var(--muted);
      }
      .res {
        font-weight: 700;
        color: var(--accent);
      }

      /* Tipp-Feedback: jede tippbare Fläche reagiert sichtbar (ausser bereits gewählte) */
      .seg button:active:not(.on),
      .chips button:active:not(.on),
      .strip button:active,
      .wk button:active:not(:disabled),
      .day:active,
      .blk:active,
      .mi:active,
      .opt:active:not(.on),
      .acct-link:active,
      .sore-acc summary:active {
        background: var(--surface2);
      }
      .btn:active:not(:disabled) {
        filter: brightness(1.12);
      }
      @media (hover: hover) {
        .btn:hover:not(:disabled) {
          border-color: rgba(255, 255, 255, 0.2);
        }
        .btn.primary:hover:not(:disabled) {
          filter: brightness(1.06);
        }
        .seg button:hover:not(.on),
        .chips button:hover:not(.on) {
          border-color: rgba(255, 255, 255, 0.2);
        }
      }
      .brk {
        overflow-wrap: anywhere;
      }
      .offline-bar {
        background: rgba(255, 138, 128, 0.12);
        color: var(--danger);
        font-size: 13px;
        text-align: center;
        padding: var(--s2) var(--s4);
      }
      /* Lange Wörter/Namen (Strava-Aktivitäten, Übungen) dürfen umbrechen statt den Rand zu sprengen */
      .card,
      .sbox,
      .msg,
      .target,
      .hint {
        overflow-wrap: anywhere;
      }

      /* Badges, Chips, Optionen */
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1);
        justify-content: flex-end;
        min-width: 0;
      }
      .badges .badge {
        white-space: normal;
        text-align: center;
      }
      .session-h .badges {
        justify-content: flex-start;
      }
      .badge {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--surface2);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.warn {
        background: rgba(255, 138, 128, 0.15);
        color: var(--danger);
      }
      .badge.mv {
        background: rgba(110, 164, 240, 0.15);
        color: var(--lauf);
      }
      .badge.ok {
        background: rgba(111, 207, 134, 0.15);
        color: var(--ok);
      }
      .badge.easy {
        background: rgba(255, 192, 77, 0.15);
        color: var(--warn);
      }
      .badge.strava {
        background: rgba(252, 106, 44, 0.15);
        color: var(--strava);
      }
      .badge.garmin {
        background: rgba(17, 169, 237, 0.15);
        color: var(--garmin);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .chips button {
        min-width: 48px;
        height: 44px;
        padding: 0 14px;
        border-radius: var(--r-s);
        border: 1px solid var(--line);
        background: var(--well);
        font-weight: 600;
      }
      .chips button.on {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .cc-tabs {
        margin-bottom: var(--s4);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      @media (min-width: 600px) {
        .cc-tabs {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .sore-acc {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        margin-bottom: var(--s3);
        overflow: hidden;
      }
      .sore-acc summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: var(--s4) var(--s5);
        min-height: 56px;
        cursor: pointer;
      }
      .sore-acc summary::-webkit-details-marker {
        display: none;
      }
      .sore-acc summary h3 {
        flex: 1;
      }
      .sore-acc summary::after {
        content: "";
        width: 9px;
        height: 9px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        margin: -4px 4px 0;
        transition: transform 0.15s;
      }
      .sore-acc[open] summary::after {
        transform: rotate(-135deg);
        margin-top: 4px;
      }
      .sore-acc[open] summary {
        border-bottom: 1px solid var(--line);
      }
      .sore-acc summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .sore-it {
        padding: var(--s3) var(--s5) var(--s2);
        border-top: 1px solid var(--line);
      }
      .sore-it:first-of-type {
        border-top: 0;
      }
      .sore-it .row {
        align-items: baseline;
      }
      .sore-it label {
        font-weight: 600;
        font-size: 15px;
        flex: 1;
      }
      .sore-it .val {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 20px;
        color: var(--sc, var(--muted));
        white-space: nowrap;
      }
      .sore-it .val small {
        font-family: var(--f-body);
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
        margin-left: 4px;
      }
      .sore-it input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 44px;
        margin: 0;
        display: block;
        background: transparent;
        touch-action: pan-y;
        cursor: pointer;
      }
      .sore-it input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: var(--surface2);
      }
      .sore-it input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 3px;
        background: var(--surface2);
      }
      .sore-it input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 28px;
        height: 28px;
        margin-top: -11px;
        border-radius: 50%;
        background: var(--sc, var(--muted));
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 1px var(--line);
      }
      .sore-it input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--sc, var(--muted));
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 1px var(--line);
      }
      .sore-it input[type="range"]:focus {
        outline: none;
      }
      .sore-it input[type="range"]:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 2px var(--accent);
      }
      .sore-it input[type="range"]:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 2px var(--accent);
      }
      .sore-it .was {
        font-size: 12px;
        color: var(--muted);
      }
      .sore-scale {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
        padding: 0 2px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s3);
        margin: 0 0 var(--s4);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .impact {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .impact li {
        padding: var(--s2) 0;
        border-top: 1px solid var(--line);
      }
      .impact li:first-child {
        border-top: 0;
      }
      .acct-link {
        width: 100%;
        background: none;
        border: 0;
        padding: var(--s2);
        margin: 0 calc(-1 * var(--s2));
        width: calc(100% + 2 * var(--s2));
        border-radius: var(--r-m);
        text-align: left;
        cursor: pointer;
      }
      .acct-link:hover,
      .acct-link.on {
        background: var(--surface2);
      }
      .acct-link .chev {
        margin-left: auto;
        font-size: 24px;
        color: var(--muted);
      }
      input.ro {
        background: transparent;
        border-style: dashed;
        color: var(--muted);
        cursor: not-allowed;
      }
      .cc-tabs button {
        flex: 1;
      }
      .ex-v input.pre {
        color: var(--muted);
        font-style: italic;
      }
      .wt {
        width: 100%;
      }
      .wt td {
        padding: 3px 0;
      }
      .wt td:last-child {
        width: 28px;
        padding-left: var(--s2);
      }
      .wt input {
        width: 100%;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--s4);
        border-radius: var(--r-m);
        border: 1px solid var(--line);
        background: var(--well);
      }
      .opt + .opt {
        margin-top: var(--s2);
      }
      .opt.on {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .opt b {
        display: block;
      }

      /* Check-in (Ampel) */
      .ci-row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: var(--s3);
        align-items: center;
        padding: var(--s2) 0;
      }
      .ci-row > span {
        font-size: 14px;
        font-weight: 500;
      }
      .seg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--s1);
      }
      .seg button {
        height: 44px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--well);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        padding: 0 var(--s1);
      }
      .seg button.on.v-g {
        background: rgba(111, 207, 134, 0.18);
        border-color: var(--ok);
        color: var(--ok);
      }
      .seg button.on.v-y {
        background: rgba(255, 192, 77, 0.18);
        border-color: var(--warn);
        color: var(--warn);
      }
      .seg button.on.v-r {
        background: rgba(255, 138, 128, 0.18);
        border-color: var(--danger);
        color: var(--danger);
      }
      .amp {
        font-weight: 600;
        font-size: 13px;
        padding: 3px 10px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .amp::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .amp-green {
        color: var(--ok);
        background: rgba(111, 207, 134, 0.12);
      }
      .amp-yellow {
        color: var(--warn);
        background: rgba(255, 192, 77, 0.12);
      }
      .amp-red {
        color: var(--danger);
        background: rgba(255, 138, 128, 0.12);
      }

      /* Vorschläge */
      .sug {
        border-top: 1px solid var(--line);
        padding: var(--s4) 0;
      }
      .row + .sug {
        border-top: 0;
        padding-top: var(--s3);
      }
      .sug:last-child {
        padding-bottom: 0;
      }
      .sug b {
        display: block;
      }
      .sug .sub {
        margin-top: var(--s1);
      }
      .sug .grid2 {
        margin-top: var(--s3);
      }

      .wide {
        max-width: 1040px;
        margin: 0 auto;
      }
      /* Dashboard: Diagramme (dataviz-Regeln: dünne Marken, zurückhaltendes Raster, Werte in Textfarbe) */
      :root {
        --viz-1: #3987e5;
        --viz-2: #d95926;
      }
      /* Drei Ringe wie bei Whoop: Erholung, Belastung, Woche */
      .dash-rings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        gap: var(--s2);
        padding: var(--s5) var(--s3);
      }
      .ring {
        position: relative;
        display: grid;
        place-items: center;
        max-width: 100%;
      }
      .ring svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      /* Tacho-Skala: 60 feine Ticks (Umfang 2π·52 ≈ 326,7 → 5,445 je Tick) */
      .ring .ring-bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 9;
        stroke-dasharray: 1.6 3.845;
        stroke-linecap: butt;
      }
      .ring .ring-fg {
        fill: none;
        stroke: var(--ring);
        stroke-width: 9;
        stroke-linecap: round;
      }
      /* Zahlen überall gleich breit: nichts springt beim Hochzählen oder Wechseln */
      body,
      .stat,
      .lstats,
      .cd,
      #cd,
      .ring-t,
      .cnt,
      .rpe-n {
        font-variant-numeric: tabular-nums;
      }
      /* Hochzählende Zahl übernimmt Schrift und Farbe der umgebenden Zahl */
      .lstats b .cnt,
      .ring-t b .cnt {
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
        margin: 0;
        display: inline;
      }
      .ring-t {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.1;
      }
      .ring-t b {
        font-family: var(--f-head);
        font-size: 30px;
        color: var(--text);
      }
      .ring-t b small {
        font-size: 0.6em;
        color: var(--muted);
      }
      .ring-t span {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .ring-t em {
        font-style: normal;
        font-size: 11px;
        color: var(--muted);
      }
      @media (max-width: 380px) {
        .ring-t b {
          font-size: 26px;
        }
      }
      .dash-today .lstats {
        border-top: 1px solid var(--line);
        padding-top: var(--s3);
      }
      /* Kleine Handys: Garmin-Werte 2×2 statt 4 nebeneinander (sonst bricht „Body Battery“ um) */
      @media (max-width: 380px) {
        .dash-today .lstats {
          grid-template-columns: repeat(2, 1fr) !important;
          row-gap: var(--s3);
        }
      }
      .dash-links {
        padding: 0 var(--s4);
      }
      .dash-links .mi {
        border-top: 1px solid var(--line);
        gap: var(--s3);
      }
      .dash-links .mi:first-child {
        border-top: 0;
      }
      .dash-links .mi > span:first-child {
        flex: 1;
      }
      .dash-links .chev {
        font-size: 24px;
        color: var(--muted);
      }
      .dash-title {
        font-family: var(--f-title);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text);
        margin: var(--s8) 0 var(--s3);
      }
      .viz .bar {
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      .lchips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 0 calc(-1 * var(--s1)) var(--s3);
        padding: 0 var(--s1) 2px;
        -webkit-overflow-scrolling: touch;
      }
      .lchips::-webkit-scrollbar {
        display: none;
      }
      .lchips button {
        flex: none;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--well);
        color: var(--muted);
        font: 600 13px var(--f-body);
        white-space: nowrap;
      }
      .lchips button.on {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .lstats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--s2);
      }
      .lstats div {
        min-width: 0;
      }
      .lstats span {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .lstats b {
        display: block;
        font-family: var(--f-head);
        font-size: 22px;
        line-height: 1.15;
        white-space: nowrap;
      }
      .lstats b.up {
        color: var(--ok);
      }
      .lstats b.down {
        color: var(--warn);
      }
      .lstats.l3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .lstats.l2 {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 420px) {
        .lstats {
          gap: var(--s1);
        }
        .lstats b {
          font-size: 19px;
        }
      }
      /* Trends und Kraft: Handy untereinander, Desktop nebeneinander */
      .dgrid {
        display: grid;
        gap: 0 var(--s3);
      }
      .dgrid > * {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .dgrid > section > .card {
        flex: 1;
      }
      @media (min-width: 900px) {
        .dgrid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .viz {
        width: 100%;
        max-width: 620px;
        height: auto;
        display: block;
        margin-top: var(--s2);
        overflow: visible;
      }
      .viz .grid {
        stroke: var(--line);
        stroke-width: 1;
      }
      .viz .base {
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1;
      }
      /* Achsen: Diagramme skalieren mit der Breite – auf schmalen Handys grössere Schrift, damit sie nie unter ~11 px fällt */
      .viz .ax {
        fill: var(--muted);
        font-size: 12px;
        font-family: var(--f-body);
      }
      @media (max-width: 380px) {
        .viz .ax {
          font-size: 14px;
        }
      }
      .viz .cross {
        stroke: var(--muted);
        stroke-width: 1;
        opacity: 0;
      }
      .viz .dot {
        opacity: 0;
      }
      .viz .pt:hover .cross,
      .viz .pt:hover .dot,
      .viz .pt.on .cross,
      .viz .pt.on .dot {
        opacity: 1;
      }
      .viz .hit {
        cursor: default;
      }
      .viz .hit:hover path {
        filter: brightness(1.15);
      }
      .legend {
        display: flex;
        gap: var(--s4);
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: var(--s2);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .laps {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: var(--s3);
      }
      .laps td,
      .laps th {
        padding: 5px 4px;
        text-align: right;
        border-top: 1px solid var(--line);
        white-space: nowrap;
      }
      .laps th {
        color: var(--muted);
        font-weight: 600;
        border-top: 0;
      }
      .laps td:first-child,
      .laps th:first-child {
        text-align: left;
      }
      .laps tr.work td {
        color: var(--text);
        font-weight: 600;
      }
      .laps tr:not(.work) td {
        color: var(--muted);
      }
      #viztip {
        position: fixed;
        z-index: 99;
        pointer-events: none;
        background: rgba(20, 22, 28, 0.92);
        border: 1px solid var(--line);
        color: var(--text);
        font-size: 12px;
        padding: 6px 8px;
        border-radius: 6px;
        max-width: 240px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      }

      /* Strava */
      .act {
        display: flex;
        gap: var(--s3);
        padding: var(--s3) 0;
        border-top: 1px solid var(--line);
        align-items: flex-start;
      }
      .act:first-child {
        border-top: 0;
      }
      .act .d {
        width: 38px;
        flex: none;
        font-weight: 600;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.1;
      }
      .act .d b {
        display: block;
        font-size: 20px;
        color: var(--text);
      }
      .act > div:last-child {
        flex: 1;
        min-width: 0;
      }
      .sbox {
        border: 1px solid rgba(252, 106, 44, 0.35);
        background: rgba(252, 106, 44, 0.08);
        border-radius: var(--r-s);
        padding: var(--s3);
        margin-top: var(--s4);
        font-size: 14px;
      }
      .sbox b {
        color: var(--strava);
      }
      .sbox .btn {
        margin-top: var(--s3);
      }
      .sbox.g {
        border-color: rgba(17, 169, 237, 0.35);
        background: rgba(17, 169, 237, 0.08);
      }
      .sbox.g b {
        color: var(--garmin);
      }
      .well {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: var(--s3);
      }
      .well th,
      .well td {
        padding: 6px 4px;
        text-align: right;
        border-top: 1px solid var(--line);
        white-space: nowrap;
      }
      .well th:first-child,
      .well td:first-child {
        text-align: left;
      }
      .well th {
        font-weight: 600;
        color: var(--muted);
        border-top: 0;
      }
      .rec-gut {
        color: var(--ok);
      }
      .rec-mittel {
        color: var(--warn);
      }
      .rec-schlecht {
        color: var(--danger);
      }
      .steps {
        margin: var(--s3) 0 0;
        padding-left: 20px;
      }
      .steps li {
        margin-top: var(--s2);
      }
      .cmd {
        display: flex;
        gap: var(--s2);
        align-items: center;
        margin-top: var(--s2);
      }
      .cmd code {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        white-space: nowrap;
        background: var(--surface2);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }

      /* Splash: deckt alles ab, bis feststeht, ob Login oder Trainingsplan gezeigt wird */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--s5);
        transition: opacity 0.25s;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .brand {
        font-size: 30px;
      }
      #splash .spin {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spin {
          animation-duration: 2.4s;
        }
        #splash {
          transition: none;
        }
      }
      /* Abgehakt, aber kein Wert eingetragen */
      .ex.is-done .ex-v input:placeholder-shown {
        border-color: var(--warn);
        box-shadow: inset 3px 0 0 var(--warn);
      }
      #toast.warn {
        background: var(--warn);
        color: var(--on-accent);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--tabs-h) + var(--s6) + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: rgba(44, 48, 58, 0.78);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 10px var(--s4);
        border-radius: 22px;
        font-size: 14px;
        font-weight: 600;
        z-index: 30;
        pointer-events: none;
        max-width: calc(100vw - 32px);
        text-align: center;
        box-shadow:
          var(--edge),
          0 10px 30px rgba(0, 0, 0, 0.4);
        animation: toastIn 0.3s var(--ease);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, 8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #toast {
          animation: none;
        }
      }

      /* ---------- Motion im Stil von iOS ----------
   Nur transform und opacity (läuft auf der Grafikkarte). --ios = Kurve der iOS-Navigation und -Sheets:
   schneller Start, sehr weiches Auslaufen. Öffnen etwas länger als Schliessen. „Bewegung reduzieren“ = alles aus. */
      :root {
        --ios: cubic-bezier(0.32, 0.72, 0, 1);
        --out: cubic-bezier(0.22, 1, 0.36, 1);
        --in: cubic-bezier(0.4, 0, 1, 1);
      }

      /* Seitenwechsel (View Transitions): Kopf, Tab-Leiste, Menü und Meldung bleiben stehen, nur der Inhalt bewegt sich */
      #main {
        view-transition-name: main;
      }
      .top {
        view-transition-name: top;
      }
      .top .menu-btn {
        view-transition-name: menubtn;
      }
      #nav {
        view-transition-name: nav;
      }
      #sheet {
        view-transition-name: sheet;
      }
      #scrim {
        view-transition-name: scrim;
      }
      #toast {
        view-transition-name: toast;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
      }
      ::view-transition-old(top),
      ::view-transition-old(menubtn),
      ::view-transition-old(nav),
      ::view-transition-old(sheet),
      ::view-transition-old(scrim),
      ::view-transition-old(toast) {
        display: none;
      }
      ::view-transition-new(top),
      ::view-transition-new(menubtn),
      ::view-transition-new(nav),
      ::view-transition-new(sheet),
      ::view-transition-new(scrim),
      ::view-transition-new(toast) {
        animation: none;
      }
      ::view-transition-group(top),
      ::view-transition-group(menubtn),
      ::view-transition-group(nav),
      ::view-transition-group(toast) {
        z-index: 3;
        animation: none;
      }
      ::view-transition-group(scrim) {
        z-index: 4;
        animation: none;
      }
      ::view-transition-group(sheet) {
        z-index: 5;
        animation: none;
      }
      /* Der Inhalt springt nicht mit der Scrollposition: alter Stand bleibt dort, wo er zu sehen war (--vt-s = Scroll-Differenz) */
      ::view-transition-group(main) {
        animation: none;
      }
      ::view-transition-old(main) {
        translate: 0 var(--vt-s, 0px);
      }
      ::view-transition-old(main),
      ::view-transition-new(main) {
        animation-fill-mode: both;
      }

      /* push / back: alte und neue Seite gleiten exakt gekoppelt nebeneinander (gleiche Kurve, gleiche Strecke).
   Bei Glas-Karten wichtig: die Seiten überlappen nie, nichts scheint durcheinander durch. */
      html[data-vt="push"]::view-transition-new(main) {
        animation: vt-in-r 0.5s var(--ios) both;
      }
      html[data-vt="push"]::view-transition-old(main) {
        animation: vt-out-l 0.5s var(--ios) both;
      }
      html[data-vt="back"]::view-transition-old(main) {
        animation: vt-out-r 0.46s var(--ios) both;
      }
      html[data-vt="back"]::view-transition-new(main) {
        animation: vt-in-l 0.46s var(--ios) both;
      }
      @keyframes vt-in-r {
        from {
          transform: translateX(100vw);
        }
      }
      @keyframes vt-out-l {
        to {
          transform: translateX(-100vw);
          opacity: 0.4;
        }
      }
      @keyframes vt-out-r {
        to {
          transform: translateX(100vw);
          opacity: 0.4;
        }
      }
      @keyframes vt-in-l {
        from {
          transform: translateX(-100vw);
        }
      }
      /* tab: weiches Überblenden, neuer Inhalt hebt sich minimal */
      html[data-vt="tab"]::view-transition-old(main) {
        animation: vt-fade-out 0.16s ease-out both;
      }
      html[data-vt="tab"]::view-transition-new(main) {
        animation: vt-rise 0.34s var(--out) both;
      }
      @keyframes vt-fade-out {
        to {
          opacity: 0;
        }
      }
      @keyframes vt-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      /* next/prev: anderer Tag oder andere Woche – seitlich gleiten */
      html[data-vt="next"]::view-transition-old(main) {
        animation: vt-side-out-l 0.28s var(--out) both;
      }
      html[data-vt="next"]::view-transition-new(main) {
        animation: vt-side-in-r 0.4s var(--ios) both;
      }
      html[data-vt="prev"]::view-transition-old(main) {
        animation: vt-side-out-r 0.28s var(--out) both;
      }
      html[data-vt="prev"]::view-transition-new(main) {
        animation: vt-side-in-l 0.4s var(--ios) both;
      }
      @keyframes vt-side-out-l {
        to {
          opacity: 0;
          transform: translateX(-40px);
        }
      }
      @keyframes vt-side-in-r {
        from {
          opacity: 0;
          transform: translateX(40px);
        }
      }
      @keyframes vt-side-out-r {
        to {
          opacity: 0;
          transform: translateX(40px);
        }
      }
      @keyframes vt-side-in-l {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
      }
      /* fade: Inhalt einer Seite wechselt (Coach-Tabs, Profil, Vorschläge) */
      html[data-vt="fade"]::view-transition-old(main) {
        animation: vt-fade-out 0.18s ease-out both;
      }
      html[data-vt="fade"]::view-transition-new(main) {
        animation: vt-rise 0.3s var(--out) both;
      }
      /* Desktop: Seiten schieben wirkt auf breiten Bildschirmen unruhig – dort kurz und dezent */
      @media (min-width: 900px) {
        html[data-vt="push"]::view-transition-new(main),
        html[data-vt="back"]::view-transition-new(main) {
          animation: vt-rise 0.34s var(--out) both;
        }
        html[data-vt="push"]::view-transition-old(main),
        html[data-vt="back"]::view-transition-old(main) {
          animation: vt-fade-out 0.16s ease-out both;
        }
      }

      /* Menü: Schublade gleitet mit iOS-Kurve, Einträge folgen gestaffelt; Schliessen kürzer */
      .scrim {
        transition:
          opacity 0.3s var(--in),
          visibility 0s 0.3s;
      }
      .scrim.open {
        transition: opacity 0.45s var(--out);
      }
      .drawer {
        transition:
          transform 0.3s var(--in),
          visibility 0s 0.3s;
      }
      .drawer.open {
        transition: transform 0.5s var(--ios);
      }
      .drawer.open .drawer-h,
      .drawer.open .cap,
      .drawer.open .mi,
      .drawer.open #acct {
        animation: menu-in 0.55s var(--ios) backwards;
        animation-delay: calc(60ms + var(--i, 0) * 28ms);
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateX(28px);
        }
      }

      /* Meldung: federt herein, gleitet weich wieder hinaus */
      #toast.out {
        animation: toast-out 0.24s var(--in) forwards;
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translate(-50%, 10px) scale(0.97);
        }
      }

      /* Übung abhaken: runder Haken wie in „Erinnerungen“ – füllt sich, Häkchen springt hinein */
      .ex-h input {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.32);
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background-color 0.28s var(--out),
          border-color 0.28s var(--out),
          transform 0.35s var(--ios);
      }
      .ex-h input::after {
        content: "";
        width: 6px;
        height: 11px;
        border: solid #07130b;
        border-width: 0 2.5px 2.5px 0;
        transform: translateY(-1px) rotate(45deg) scale(0);
        transition: transform 0.4s var(--ios);
      }
      .ex-h input:checked {
        background: var(--ok);
        border-color: var(--ok);
      }
      .ex-h input:checked::after {
        transform: translateY(-1px) rotate(45deg) scale(1);
      }
      .ex-h input:active {
        transform: scale(0.86);
      }
      .ex-h span {
        transition: color 0.3s var(--out);
      }
      .ex.is-done .ex-h span {
        text-decoration-color: rgba(255, 255, 255, 0.35);
      }
      .prog i {
        transition:
          width 0.55s var(--ios),
          background-color 0.3s;
      }

      /* Auswahl (Segmente, RPE, Chips): kurzes Federn beim Antippen – per JS nach dem Neuaufbau ausgelöst */
      .pop {
        animation: pop 0.38s var(--ios);
      }
      @keyframes pop {
        0% {
          transform: scale(0.9);
        }
        55% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .drawer.open,
        .scrim,
        .scrim.open,
        .ex-h input,
        .ex-h input::after,
        .prog i {
          transition: none;
        }
        .drawer.open .drawer-h,
        .drawer.open .cap,
        .drawer.open .mi,
        .drawer.open #acct,
        #toast.out,
        .pop {
          animation: none;
        }
      }

      /* ---------- Responsive ----------
   < 480     Handy: eine Spalte, RPE in zwei Reihen
   600–899   Tablet hoch: lesbare Spalte, Tab-Leiste als Pille
   ≥ 900     Tablet quer / Desktop: zwei Spalten, Navigation oben in der Kopfzeile
   Höhe<500  Handy quer: kompakte Kopf- und Tab-Leiste */
      @media (max-width: 479px) {

        }
        /* Heute: Wochenleiste hochkant links, Einheit rechts daneben */

      @media (min-width: 900px) {

        .top {

        }

          right: max(var(--s8), calc((100vw - 1080px) / 2 + var(--s8)));
        }
        .tabs {
          position: fixed;

        }

        }

        }
        body {
          padding-bottom: var(--s8);
        }
        #toast {

        .rail {

        /* Seitenspalte bleibt stehen, scrollt aber selbst, wenn sie höher als der Bildschirm ist */
        .cols:not(.week) > .side {

      body::before {

          .rv-notes { list-style: none; padding: 0; margin-left: 0; }

      .rv-notes li::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .rv-notes .rv-green::before { background: var(--ok); }

      /* Ampel zusätzlich über die Form: gelb = Raute, rot = Quadrat (nicht nur Farbe) */

      .rv-notes .rv-red::before { border-radius: 1px; }

      .rv-wbtn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .rv-wbtn.rv-green::before { background: var(--ok); }
      .rv-wbtn.rv-yellow::before { background: var(--warn); border-radius: 1px; transform: rotate(45deg); }
      .rv-wbtn.rv-red::before { background: var(--danger); border-radius: 1px; }
      :root { --sl-deep: #2f5fb3; --sl-rem: #6c9be6; --sl-light: #b4ccf0; --sl-awake: #e0a24a; }
      .sl-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
      .sl-bar span { display: block; min-width: 2px; }

    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="App wird geladen">
