        animation: vt-in-r 0.5s var(--ios) both;
      }
      html[data-vt="push"]::view-transition-old(main) {
        animation: vt-out-l 0.5s var(--ios) both;
      }
      html[data-vt="back"]::view-transition-old(main) {
        animation: vt-out-r 0.46s var(--ios) both;
      }
      html[data-vt="back"]::view-transition-new(main) {
        animation: vt-in-l 0.46s var(--ios) both;
      }
      @keyframes vt-in-r {
        from {
          transform: translateX(100vw);
        }
      }
      @keyframes vt-out-l {
        to {
          transform: translateX(-100vw);
          opacity: 0.4;
        }
      }
      @keyframes vt-out-r {
        to {
          transform: translateX(100vw);
          opacity: 0.4;
        }
      }
      @keyframes vt-in-l {
        from {
          transform: translateX(-100vw);
        }
      }
      /* tab: weiches Überblenden, neuer Inhalt hebt sich minimal */
      html[data-vt="tab"]::view-transition-old(main) {
        animation: vt-fade-out 0.16s ease-out both;
      }
      html[data-vt="tab"]::view-transition-new(main) {
        animation: vt-rise 0.34s var(--out) both;
      }
      @keyframes vt-fade-out {
        to {
          opacity: 0;
        }
      }
      @keyframes vt-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      /* next/prev: anderer Tag oder andere Woche – seitlich gleiten */
      html[data-vt="next"]::view-transition-old(main) {
        animation: vt-side-out-l 0.28s var(--out) both;
      }
      html[data-vt="next"]::view-transition-new(main) {
        animation: vt-side-in-r 0.4s var(--ios) both;
      }
      html[data-vt="prev"]::view-transition-old(main) {
        animation: vt-side-out-r 0.28s var(--out) both;
      }
      html[data-vt="prev"]::view-transition-new(main) {
        animation: vt-side-in-l 0.4s var(--ios) both;
      }
      @keyframes vt-side-out-l {
        to {
          opacity: 0;
          transform: translateX(-40px);
        }
      }
      @keyframes vt-side-in-r {
        from {
          opacity: 0;
          transform: translateX(40px);
        }
      }
      @keyframes vt-side-out-r {
        to {
          opacity: 0;
          transform: translateX(40px);
        }
      }
      @keyframes vt-side-in-l {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
      }
      /* fade: Inhalt einer Seite wechselt (Coach-Tabs, Profil, Vorschläge) */
      html[data-vt="fade"]::view-transition-old(main) {
        animation: vt-fade-out 0.18s ease-out both;
      }
      html[data-vt="fade"]::view-transition-new(main) {
        animation: vt-rise 0.3s var(--out) both;
      }
      /* Desktop: Seiten schieben wirkt auf breiten Bildschirmen unruhig – dort kurz und dezent */
      @media (min-width: 900px) {
        html[data-vt="push"]::view-transition-new(main),
        html[data-vt="back"]::view-transition-new(main) {
          animation: vt-rise 0.34s var(--out) both;
        }
        html[data-vt="push"]::view-transition-old(main),
        html[data-vt="back"]::view-transition-old(main) {
          animation: vt-fade-out 0.16s ease-out both;
        }
      }

      /* Menü: Schublade gleitet mit iOS-Kurve, Einträge folgen gestaffelt; Schliessen kürzer */
      .scrim {
        transition:
          opacity 0.3s var(--in),
          visibility 0s 0.3s;
      }
      .scrim.open {
        transition: opacity 0.45s var(--out);
      }
      .drawer {
        transition:
          transform 0.3s var(--in),
          visibility 0s 0.3s;
      }
      .drawer.open {
        transition: transform 0.5s var(--ios);
      }
      .drawer.open .drawer-h,
      .drawer.open .cap,
      .drawer.open .mi,
      .drawer.open #acct {
        animation: menu-in 0.55s var(--ios) backwards;
        animation-delay: calc(60ms + var(--i, 0) * 28ms);
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateX(28px);
        }
      }

      /* Meldung: federt herein, gleitet weich wieder hinaus */
      #toast.out {
        animation: toast-out 0.24s var(--in) forwards;
      }
      @keyframes toast-out {
        to {
          opacity: 0;
          transform: translate(-50%, 10px) scale(0.97);
        }
      }

      /* Übung abhaken: runder Haken wie in „Erinnerungen“ – füllt sich, Häkchen springt hinein */
      .ex-h input {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.32);
        background: transparent;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          background-color 0.28s var(--out),
          border-color 0.28s var(--out),
          transform 0.35s var(--ios);
      }
      .ex-h input::after {
        content: "";
        width: 6px;
        height: 11px;
        border: solid #07130b;
        border-width: 0 2.5px 2.5px 0;
        transform: translateY(-1px) rotate(45deg) scale(0);
        transition: transform 0.4s var(--ios);
      }
      .ex-h input:checked {
        background: var(--ok);
        border-color: var(--ok);
      }
      .ex-h input:checked::after {
        transform: translateY(-1px) rotate(45deg) scale(1);
      }
      .ex-h input:active {
        transform: scale(0.86);
      }
      .ex-h span {
        transition: color 0.3s var(--out);
      }
      .ex.is-done .ex-h span {
        text-decoration-color: rgba(255, 255, 255, 0.35);
      }
      .prog i {
        transition:
          width 0.55s var(--ios),
          background-color 0.3s;
      }

      /* Auswahl (Segmente, RPE, Chips): kurzes Federn beim Antippen – per JS nach dem Neuaufbau ausgelöst */
      .pop {
        animation: pop 0.38s var(--ios);
      }
      @keyframes pop {
        0% {
          transform: scale(0.9);
        }
        55% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .drawer.open,
        .scrim,
        .scrim.open,
        .ex-h input,
        .ex-h input::after,
        .prog i {
          transition: none;
        }
        .drawer.open .drawer-h,
        .drawer.open .cap,
        .drawer.open .mi,
        .drawer.open #acct,
        #toast.out,
        .pop {
          animation: none;
        }
      }

      /* ---------- Responsive ----------
   < 480     Handy: eine Spalte, RPE in zwei Reihen
   600–899   Tablet hoch: lesbare Spalte, Tab-Leiste als Pille
   ≥ 900     Tablet quer / Desktop: zwei Spalten, Navigation oben in der Kopfzeile
   Höhe<500  Handy quer: kompakte Kopf- und Tab-Leiste */
      @media (max-width: 479px) {
        /* Aufgeklappter Tag in der Woche: weniger verschachtelter Innenabstand, damit Bedienelemente ≥ 44 px bleiben */
        .day-body .card {
          padding: var(--s3);
        }
      }
      @media (max-width: 370px) {
        h1 {
          font-size: 28px;
        }
        main {
          padding: var(--s3);
        }
        .card {
          padding: var(--s4);
        }
        .ci-row {
          grid-template-columns: 82px 1fr;
          gap: var(--s2);
        }
        .seg button {
          font-size: 12px;
        }
        .strip {
          gap: var(--s1);
        }
        .strip .dd {
          font-size: 18px;
        }
        .ex-v {
          margin-left: 0;
        }
        .wsum .stat b {
          font-size: 20px;
        }
        .brand {
          font-size: 18px;
        }
      }
      @media (min-width: 600px) {
        main {
          max-width: 720px;
          padding: var(--s6);
        }
        .tabs {
          left: 50%;
          right: auto;
          bottom: calc(var(--s4) + env(safe-area-inset-bottom));
          transform: translateX(-50%);
          width: 520px;
          padding: 4px;
          border-width: 1px;
          border-radius: 30px;
          box-shadow:
            var(--edge),
            0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .tab-ind {
          bottom: 4px;
        }
        body {
          padding-bottom: calc(
            var(--tabs-h) + var(--s8) + env(safe-area-inset-bottom)
          );
        }
        #toast {
          bottom: calc(var(--tabs-h) + var(--s8) + env(safe-area-inset-bottom));
        }
        /* Heute: Wochenleiste hochkant links, Einheit rechts daneben */
        .cols.today {
          display: grid;
          grid-template-columns: 64px minmax(0, 1fr);
          gap: var(--s4);
          align-items: start;
        }
        .top {
          max-width: 720px;
          padding-left: var(--s6);
        }
        .top .menu-btn {
          right: max(var(--s6), calc((100vw - 720px) / 2 + var(--s6)));
        }
        .rail {
          position: sticky;
          top: calc(var(--s4) + env(safe-area-inset-top));
        }
        .rail .cap {
          font-size: 12px;
          text-align: center;
          margin: 0 0 var(--s2);
        }
        .strip.v {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .strip.v button {
          padding: var(--s2) 0;
          gap: 3px;
        }
        .strip.v .dd {
          font-size: 18px;
        }
        .strip.v button.today {
          box-shadow: inset 3px 0 0 var(--accent);
        }
      }
      @media (min-width: 900px) {
        /* Kopf bündig mit dem Inhalt: Countdown links, Tabs als Glas-Segment in der Mitte, Menü rechts */
        .top {
          max-width: 1080px;
          padding: calc(14px + env(safe-area-inset-top)) var(--s8) 0;
        }
        .top .menu-btn {
          top: calc(14px + env(safe-area-inset-top));
          right: max(var(--s8), calc((100vw - 1080px) / 2 + var(--s8)));
        }
        .tabs {
          position: fixed;
          top: calc(14px + env(safe-area-inset-top));
          bottom: auto;
          left: 50%;
          transform: translateX(-50%);
          width: auto;
          display: flex;
          gap: var(--s1);
          padding: var(--s1);
          border-radius: 999px;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
          z-index: 6;
        }
        .tabs button {
          min-height: 36px;
          flex-direction: row;
          gap: var(--s2);
          padding: 0 var(--s4);
          border-radius: 999px;
          font-size: 14px;
        }
        .tabs svg {
          width: 18px;
          height: 18px;
        }
        .tabs button.on {
          background: rgba(255, 255, 255, 0.12);
        }
        .tab-ind {
          display: none;
        }
        body {
          padding-bottom: var(--s8);
        }
        #toast {
          bottom: var(--s6);
        }
        main {
          max-width: 1080px;
          padding: var(--s6) var(--s8);
        }
        .cols {
          display: grid;
          grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr);
          gap: var(--s6);
          align-items: start;
        }
        .cols.week {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        }
        .cols.today {
          grid-template-columns: 72px minmax(0, 1.3fr) minmax(300px, 1fr);
        }
        .cols.today.two {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        .rail {
          top: 80px;
        }
        /* Seitenspalte bleibt stehen, scrollt aber selbst, wenn sie höher als der Bildschirm ist */
        .cols:not(.week) > .side {
          position: sticky;
          top: 80px;
          max-height: calc(100vh - 96px);
          overflow-y: auto;
          scrollbar-width: thin;
        }
        .narrow {
          max-width: 680px;
          margin: 0 auto;
        }
      }
      @media (min-width: 1400px) {
        main {
          max-width: 1200px;
        }
        .top {
          max-width: 1200px;
        }
        .top .menu-btn {
          right: max(var(--s8), calc((100vw - 1200px) / 2 + var(--s8)));
        }
      }
      @media (max-height: 500px) and (orientation: landscape) and (max-width: 899px) {
        :root {
          --tabs-h: 52px;
        } /* Tippflächen bleiben ≥ 44 px */
        .top {
          padding-top: calc(var(--s1) + env(safe-area-inset-top));
        }
        .top .menu-btn {
          top: calc(var(--s1) + env(safe-area-inset-top));
        }
        .cd {
          min-height: 44px;
        }
        .cd span {
          font-size: 34px;
        }
        .tabs button {
          flex-direction: row;
          gap: var(--s2);
          font-size: 13px;
        }
        .tabs svg {
          width: 18px;
          height: 18px;
        }
        .sim-date {
          padding: 2px var(--s4);
        }
        main {
          padding-left: max(var(--s6), env(safe-area-inset-left));
          padding-right: max(var(--s6), env(safe-area-inset-right));
        }
      }

      /* ===== Tiefen-System (Design-Audit): keine Rahmen-Boxen, Flächen trennen sich über Helligkeit =====
         Hintergrund #06070A · Karten #0E1016 + Lichtkante oben · Eingaben/Interaktives #161922 */
      body::before {
        background:
          radial-gradient(
            110% 40% at 20% -5%,
            color-mix(in srgb, var(--tint) 12%, transparent),
            transparent 70%
          ),
          var(--bg);
      }
      .card,
      .done-bar,
      .stat,
      .list,
      .sore-acc,
      .msg.assistant,
      #viztip,
      #toast,
      .menu-btn,
      .strip button,
      .wk button {
        border-color: transparent;
        background: var(--card);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .card.hero {
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--kc, var(--accent)) 9%, var(--card)),
          var(--card) 60%
        );
        border-color: transparent;
      }
      .tabs {
        border-color: rgba(255, 255, 255, 0.06);
        box-shadow: none;
      }
      .btn,
      .chips button,
      .seg button,
      .opt,
      .lchips button,
      .ex-h.hold,
      input[type="text"],
      input[type="number"],
      input[type="password"],
      input[type="email"],
      textarea {
        border-color: transparent;
        background: var(--well);
        box-shadow: none;
      }
      input[type="text"],
      input[type="number"],
      input[type="password"],
      input[type="email"],
      textarea,
      .chips button,
      .seg button,
      .lchips button {
        border-radius: 10px;
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
      }
      .chips button,
      .seg button,
      .lchips button,
      .btn,
      .opt,
      .strip button,
      .wk button {
        min-height: 44px;
      }
      .rpe-track {
        height: 44px;
        background: var(--well);
        border: 0;
      }
      .rpe-range::-webkit-slider-runnable-track,
      .rpe-range::-moz-range-track {
        height: 44px;
      }
      .rpe-range::-webkit-slider-thumb {
        margin-top: 10px;
      }
      /* Mikro-Labels */
      .lbl,
      .cap,
      .stat span,
      .ring-t span,
      .lstats span,
      .extras .lbl {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.45);
      }
      .lbl .tgt-l {
        color: var(--accent);
      }
      /* Zahlen */
      .cd span,
      .stat b,
      .lstats b,
      .ring-t b,
      .rpe-n,
      .strip .dd,
      .day .d b,
      .cnt {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }
      .ex-h.hold + .ex-v {
        margin-left: 0;
      }
      .tabs {
        background: rgba(14, 16, 22, 0.88);
      }
      .rv-notes {
        list-style: none;
        padding: 0;
        margin-left: 0;
      }
      .rv-notes li {
        position: relative;
        padding-left: 18px;
        margin: 6px 0;
      }
      .rv-notes li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.5em;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .rv-notes .rv-green::before {
        background: var(--ok);
      }
      .rv-notes .rv-yellow::before {
        background: var(--warn);
      }
      .rv-notes .rv-red::before {
        background: var(--danger);
      }
      .rv-focus {
        padding-left: 18px;
      }
      /* Einklappbare Zeile (Zusatz-Einheiten, Nachholen) */
      .fold-h {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        gap: var(--s3);
        min-height: 44px;
        padding: 0;
        background: none;
        border: 0;
        color: var(--text);
        font: 600 15px var(--f-body);
        text-align: left;
        cursor: pointer;
      }
      .fold-h .fh-t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fold-h > em {
        white-space: nowrap;
      }
      .fold-h em {
        font-style: normal;
        font-weight: 500;
        color: var(--muted);
        margin-left: 6px;
      }
      .fold-h i {
        font-style: normal;
        color: var(--muted);
        font-size: 20px;
        width: 24px;
        text-align: center;
      }
      .card.carry {
        padding: var(--s2) var(--s4);
      }
      .card.carry .exs {
        margin-bottom: var(--s3);
      }
      .extras {
        border-top: 1px solid var(--line);
        margin-top: var(--s4);
        padding-top: var(--s1);
      }
      /* Übung + Feld in einer Zeile (Splits bekommen die ganze Breite) */
      .ex.row-v {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 104px 36px;
        column-gap: var(--s2);
        align-items: center;
      }
      .ex.row-v > .ex-x {
        grid-column: 3;
        grid-row: 1;
        margin: 0;
        min-width: 36px;
      }
      .ex.row-v > .ex-h {
        grid-column: 1;
      }
      .ex.row-v > .ex-v {
        grid-column: 2;
        margin: 0;
      }
      .ex.row-v > .quick {
        grid-column: 1 / -1;
      }
      .ex.row-v.wide > .ex-v {
        grid-column: 1 / -1;
        margin-top: var(--s2);
      }
      .ex.row-v .ex-v input {
        min-height: 40px;
        padding: 0 10px;
        text-align: right;
      }
      .ex.row-v.wide .ex-v input {
        text-align: left;
      }
      /* RPE: zehn Tasten statt Regler */
      .rpe-b {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .rpe-b button {
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--well);
        color: var(--text);
        font: 600 16px var(--f-head);
        position: relative;
      }
      .rpe-b button.tgt::after {
        content: "";
        position: absolute;
        left: 30%;
        right: 30%;
        bottom: 5px;
        height: 2px;
        border-radius: 1px;
        background: var(--muted);
      }
      .rpe-b button.on {
        background: var(--rc);
        border-color: var(--rc);
        color: #111;
      }
      .rpe-txt {
        color: var(--text);
        font-weight: 600;
      }
      .more-row {
        gap: var(--s2);
        flex-wrap: nowrap;
      }
      .more-row .btn {
        flex: 1 1 auto;
        white-space: nowrap;
        padding: 0 var(--s2);
        font-size: 13.5px;
      }
      /* Übernehmen: Auswahl der Übungen */
      .take {
        margin-top: var(--s3);
      }
      .take .tk {
        display: flex;
        gap: var(--s2);
        align-items: center;
        min-height: 40px;
        font-size: 14px;
      }
      .take .tk input {
        width: 20px;
        height: 20px;
        flex: none;
      }
      /* Wochenrückblick als Dashboard */
      .rv-of {
        font-size: 0.55em;
        color: var(--muted);
        font-weight: 500;
      }
      .rv-hero {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--s4);
        align-items: center;
      }
      .rv-verdict {
        margin: var(--s2) 0 0;
        font-weight: 600;
        font-size: 17px;
        line-height: 1.35;
        text-wrap: balance;
      }
      .rv-days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--s1);
        text-align: center;
      }
      .rv-day {
        display: grid;
        justify-items: center;
        gap: 6px;
        padding: var(--s2) 0;
        border-radius: 10px;
        background: var(--well);
        font-size: 12px;
        color: var(--muted);
      }
      .rv-day.today {
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .rv-day b {
        font-family: var(--f-head);
        font-size: 18px;
        color: var(--text);
        line-height: 1;
      }
      .rv-day i,
      .rv-leg i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .rv-done i {
        background: var(--ok);
      }
      .rv-miss i {
        background: var(--danger);
        border-radius: 2px;
      }
      .rv-rest i {
        border: 1.5px solid var(--rest);
      }
      .rv-open i {
        border: 1.5px dashed var(--muted);
      }
      .rv-rest b,
      .rv-open b {
        color: var(--muted);
      }
      .rv-leg {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s1) var(--s3);
        font-size: 12px;
      }
      .rv-leg span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .rv-kpis {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--s2);
        margin-bottom: var(--s3);
      }
      .kpi {
        background: var(--card);
        box-shadow: var(--edge);
        border-radius: 16px;
        padding: var(--s3) var(--s4);
        display: grid;
        gap: 2px;
        border-left: 3px solid transparent;
      }
      .kpi span {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .kpi b {
        font-family: var(--f-head);
        font-size: 28px;
        line-height: 1.1;
      }
      .kpi b small {
        font-size: 0.6em;
        color: var(--muted);
      }
      .kpi em {
        font-style: normal;
        font-size: 12px;
        color: var(--muted);
      }
      .kpi-green {
        border-left-color: var(--ok);
      }
      .kpi-yellow {
        border-left-color: var(--warn);
      }
      .kpi-red {
        border-left-color: var(--danger);
      }
      .rv-total {
        display: flex;
        align-items: baseline;
        gap: var(--s2);
        margin-top: var(--s3);
      }
      .rv-total b {
        font-family: var(--f-head);
        font-size: 44px;
        line-height: 1;
      }
      .rv-total span {
        color: var(--muted);
        font-size: 14px;
      }
      .rv-bar {
        position: relative;
        display: flex;
        height: 12px;
        border-radius: 6px;
        background: var(--well);
        margin-top: var(--s3);
      }
      .rv-bar i:first-child {
        border-radius: 6px 0 0 6px;
      }
      .rv-bar i:nth-child(3) {
        border-radius: 0 6px 6px 0;
      }
      .rv-bar u {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 2px;
        background: var(--text);
        border-radius: 1px;
      }
      .b-run {
        background: var(--lauf);
      }
      .b-st {
        background: var(--station);
      }
      .b-rox {
        background: var(--rest);
      }
      .rv-leg .b-run,
      .rv-leg .b-st,
      .rv-leg .b-rox {
        background: none;
      }
      .rv-leg .b-run i {
        background: var(--lauf);
      }
      .rv-leg .b-st i {
        background: var(--station);
      }
      .rv-leg .b-rox i {
        background: var(--rest);
      }
      .rv-how summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        list-style: none;
      }
      .rv-how summary::-webkit-details-marker {
        display: none;
      }
      .rv-how summary::after {
        content: "›";
        font-size: 16px;
        transition: transform 0.2s var(--ease);
      }
      .rv-how[open] summary::after {
        transform: rotate(90deg);
      }
      .rv-anss {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s2);
      }
      .rv-ans {
        background: var(--well);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .rv-ans.v-g b {
        color: var(--ok);
      }
      .rv-ans.v-y b {
        color: var(--warn);
      }
      .rv-ans.v-r b {
        color: var(--danger);
      }
      .rv-season {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 6px;
      }
      .rv-wk-c {
        min-height: 44px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font: 600 14px var(--f-head);
        border: 0;
        background: var(--well);
        color: var(--muted);
        border-bottom: 3px solid transparent;
        cursor: pointer;
      }
      .rv-wk-c.rv-green {
        border-bottom-color: var(--ok);
        color: var(--text);
      }
      .rv-wk-c.rv-yellow {
        border-bottom-color: var(--warn);
        color: var(--text);
      }
      .rv-wk-c.rv-red {
        border-bottom-color: var(--danger);
        color: var(--text);
      }
      .rv-wk-c.rv-future {
        opacity: 0.4;
        cursor: default;
      }
      .rv-wk-c.on {
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      /* Wochenrückblick v2: neutral, Farbe nur für Status, Gelb nur für Ziel und Auswahl */
      .rv .wk {
        margin-bottom: var(--s5);
      }
      .rv .cap {
        margin: 0 0 var(--s3);
      }
      .rv .cap.rv-gap {
        margin-top: var(--s5);
      }
      .rv-hero {
        grid-template-columns: auto 1fr;
        gap: var(--s5);
        padding: var(--s5);
      }
      .rv-hero .rv-notes {
        grid-column: 1 / -1;
        margin: 0;
        padding-top: var(--s4);
        border-top: 1px solid var(--line);
      }
      .rv-st {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        background: var(--surface2);
        padding: 4px 10px;
        border-radius: 999px;
      }
      .rv-st i,
      .rv-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .rv-st.rv-green i,
      .rv-dot.rv-green {
        background: var(--ok);
      }

      /* ================= Sub-60-Design (Oktober 2026) =================
         Ruhig und eindeutig: Titel in schmaler Sportschrift, Gold nur für die eine Hauptaktion und den heutigen Tag,
         runde Knöpfe, Haarlinien statt Rahmen, genug Luft zwischen den Blöcken. */
      .vh {
        padding-right: 56px; /* Platz für den Menü-Knopf */
        margin-bottom: var(--s6);
      }

        font-size: 11px;
        line-height: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: var(--s1);

      .vh h2 {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 34px;
        line-height: 1.06;
        letter-spacing: 0.01em;
        text-transform: uppercase;

      .vh .sub {
        margin-top: var(--s1);
      }
      .status.miss {
        color: var(--danger);

      /* Handy: kein grosser Countdown oben, er steht als Zeile im Kopf von „Heute“ */

        .cd {
          display: none;

          min-height: 0;

        background: var(--card);
        border-color: var(--line);

      .card.hero.is-today {
        border-color: transparent;
        box-shadow:
          var(--edge),
          inset 0 0 0 1.5px var(--accent);

        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        grid-template-columns: none;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: var(--well);
        margin-bottom: var(--s5);
      }
      .cc-tabs button {
        height: 44px;
        padding: 0 4px;
        border: 0;
        border-radius: 999px;
        background: none;

        font-weight: 500;
        font-size: 13px;
        white-space: nowrap;

      .cc-tabs button.on {
        background: var(--text);
        color: var(--bg);
        font-weight: 600;
      }
      .chat-in .chips button.on {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);

      /* Hinweis „offline“: leise, ohne Alarmfarbe */
      .offline-bar,
      .net-off {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--s2);
        min-height: 44px;
        padding: var(--s2) var(--s4);
        background: var(--well);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;

      .offline-bar {
        margin: var(--s2) var(--s4) 0;
        border-radius: var(--r-m);

      .net-off {
        border-radius: var(--r-m);
        margin: 0 0 var(--s4);
        justify-content: flex-start;

        display: flex;
        flex-direction: column;
        gap: var(--s4);
        margin-bottom: var(--s6);
      }
      .wkwrap .vh {
        margin-bottom: 0;
      }

        display: flex;
        gap: var(--s2);

        height: 44px;

          font-family: var(--f-head);
          font-size: 26px;
          line-height: 1.1;

        .cc-tabs button {
          font-size: 12px;
          letter-spacing: -0.01em;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
      th {
        overflow-wrap: normal;
        word-break: keep-all;
      }
      /* Dashboard: Garmin-Kacheln */
      .dg-tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--s2);
        margin: var(--s4) 0;
      }
      .dg-tiles.n4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      @media (min-width: 600px) {
        .dg-tiles.n4 {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .dg-tile {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: var(--s3) var(--s3);
        border-radius: var(--r-m);
        background: var(--well);
        min-width: 0;
        color: var(--muted);
      }
      .dg-tile span {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .dg-tile b {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 26px;
        line-height: 1;
        color: var(--text);
      }
      .dg-tile small {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
        margin-left: 3px;
      }
      .dg-spark {
        width: 100%;
        height: 20px;
      }
      /* Verbindungen: Strava ist die Hauptaktion (Gold), Garmin ruhig */
      .btn.strava {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .btn.garmin {
        background: var(--well);
        border-color: transparent;
        color: var(--text);
      }
      .chk {
        list-style: none;
        margin: 0 0 var(--s3);
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s2);
        font-size: 14px;
        line-height: 20px;
      }
      .chk li {
        display: flex;
        gap: 10px;
      }
      .chk li::before {
        content: "✓";
        color: var(--ok);
      }
      /* Backup: Statuskarte */
      .bk-status {
        display: flex;
        align-items: center;
        gap: var(--s3);
        padding: var(--s4) var(--s5);
        margin-bottom: var(--s4);
        border-radius: var(--r-l, 22px);
        background: var(--card);
        box-shadow: var(--edge);
      }
      .bk-status > span:last-child {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .bk-ic {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .bk-status.ok .bk-ic {
        background: rgba(48, 209, 88, 0.14);
        color: var(--ok);
      }
      .bk-status.warn .bk-ic {
        background: rgba(255, 159, 10, 0.14);
        color: var(--warn);
      }
      /* Plan: Kopfkarte mit Ziel und Blockbalken */
      .plan-hero {
        padding: var(--s4) var(--s5);
        margin-bottom: var(--s4);
      }
      .ph-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s3);
        margin-bottom: var(--s3);
      }
      .ph-t {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .ph-goal {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 26px;
        line-height: 1;
      }
      .ph-bar {
        display: flex;
        gap: 3px;
        height: 10px;
      }
      .ph-seg {
        border-radius: 4px;
        background: var(--surface2, #1b1e29);
        overflow: hidden;
      }
      .ph-seg i {
        display: block;
        height: 10px;
        background: var(--accent);
      }
      .ph-cap {
        display: flex;
        justify-content: space-between;
        margin-top: var(--s2);
        font-size: 12px;
        color: var(--muted);
      }
      .blk-now {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        margin-right: var(--s1);
      }
      /* Umplanen am Desktop: Wörter in den schmalen Fächern nie mitten im Wort trennen */
      @media (min-width: 600px) {
        .sl-card {
          padding: 26px 4px var(--s2) 10px;
        }
        .sl-card > b {
          font-size: 12.5px;
        }
      }
      .shelf-nav h3 {
        margin-bottom: var(--s2);
      }
      @media (min-width: 900px) {
        .narrow:has(.board) {
          max-width: 940px;
        }
      }
      /* S6-CSS-START */
      /* ================= Sub-60 exakt =================
         Masse, Farben und Schriften 1:1 aus den Canvas-Artboards (Handy 390, Desktop 1440). */
      :root {
        --f-body:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --f-title:
          "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html,
      body {
        background: #06070a;
      }
      body::before,
      body::after {
        display: none;
      }
      body {
        font-size: 16px;
        line-height: normal;
        padding-bottom: 0;
      }
      body.bare {
        padding-bottom: 0;
      }
      .s6,
      .s6 * {
        box-sizing: border-box;
      }
      .s6 h1,
      .s6 h2,
      .s6 h3 {
        margin: 0;
        letter-spacing: normal;
        line-height: normal;
        font-family: inherit;
      }
      .s6 p {
        margin: 0;
      }
      .s6 button,
      .s6 a {
        font-family: inherit;
      }
      .s6 a {
        text-decoration: none;
      }
      .s6-kick {
        font-size: 11px;
        line-height: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9a9ba3;
      }
      .s6 .s6-h1 {
        font-family: var(--f-head);
        font-weight: 700;
        font-size: 34px;
        line-height: 36px;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .s6-sub {
        font-size: 13px;
        line-height: 18px;
        color: #9a9ba3;
      }
      .s6-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .s6-hd > div:first-child {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .s6-menu {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 50%;
        background: #161922;
        color: #f5f5f7;
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .s6-card {
        display: flex;
        flex-direction: column;
        border-radius: 22px;
        background: #0e1016;
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .s6-btn {
        min-height: 48px;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: #161922;
        color: #f5f5f7;
        font-size: 15px;
        font-weight: 600;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .s6-btn.gold {
        background: #e0bf6a;
        color: #16181a;
        box-shadow: 0 4px 14px rgba(224, 191, 106, 0.14);
      }
      .s6-btn.ghost {
        background: none;
        color: #9a9ba3;
        box-shadow: none;
      }
      .s6-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px 4px 8px;
        border-radius: 999px;
        background: #161922;
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        color: #f5f5f7;
      }
      .s6-chip i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: block;
      }
      .s6-d {
        display: none;
      }
      /* Tab-Leiste: schwebende Pille unten (Handy) */
      @media (max-width: 899px) {
        .top {
          display: none;
        }
        main#main {
          padding: 0 0 112px;
          max-width: none;
          margin: 0;
        }
        .tabs {
          position: fixed;
          left: 12px;
          right: 12px;
          bottom: calc(16px + env(safe-area-inset-bottom));
          top: auto;
          width: auto;
          max-width: none;
          margin: 0;
          height: 64px;
          padding: 0 4px;
          border: 0;
          border-radius: 22px;
          background: rgba(14, 16, 22, 0.82);
          backdrop-filter: saturate(180%) blur(22px);
          -webkit-backdrop-filter: saturate(180%) blur(22px);
          box-shadow:
            inset 0 1px 0 0 rgba(255, 255, 255, 0.08),
            0 2px 8px rgba(0, 0, 0, 0.5);
          transform: none;
        }
        .tab-ind {
          display: none;
        }
        .tabs button {
          height: 64px;
          min-height: 0;
          padding: 0;
          border-radius: 0;
          background: none;
          box-shadow: none;
          flex-direction: column;
          gap: 3px;
          font-size: 11px;
          font-weight: 500;
          color: #9a9ba3;
        }
        .tabs button.on {
          color: #e0bf6a;
          font-weight: 600;
          background: none;
        }
        .tabs button svg {
          width: 22px;
          height: 22px;
          stroke-width: 1.75;
        }
        .tabs button.on svg {
          stroke: currentColor;
        }
      }
      /* Desktop: Kopfleiste mit Countdown, Tabs, Menü */
      @media (min-width: 900px) {
        .s6-m {
          display: none;
        }
        .s6-d {
          display: block;
        }
        .top {
          max-width: none;
          width: 100%;
          height: 76px;
          margin: 0;
          padding: 0 48px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          display: flex;
          align-items: center;
          justify-content: flex-start;
        }
        .top .cd {
          display: flex;
          align-items: baseline;
          gap: 10px;
          width: 240px;
          min-height: 0;
        }
        .top .cd #cd {
          font-family: var(--f-head);
          font-weight: 700;
          font-size: 40px;
          line-height: 1;
          font-variant-numeric: tabular-nums;
        }
        .top .cd small {
          font-size: 13px;
          line-height: 16px;
          color: #9a9ba3;
        }
        .top .cd small br {
          display: none;
        }
        .top .menu-btn {
          position: fixed;
          top: 16px;
          right: 48px;
          width: 44px;
          height: 44px;
          background: #161922;
          border: 0;
          box-shadow: none;
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
        .top .menu-btn svg {
          width: 22px;
          height: 22px;
          fill: none;
        }
        main#main {
          max-width: none;
          margin: 0;
          padding: 32px 48px 48px;
        }
        .tabs {
          position: fixed;
          top: 14px;
          bottom: auto;
          left: 50%;
          right: auto;
          transform: translateX(-50%);
          height: auto;
          width: auto;
          display: flex;
          gap: 4px;
          padding: 4px;
          border: 0;
          border-radius: 999px;
          background: #0e1016;
          box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
        .tab-ind {
          display: none;
        }
        .tabs button {
          flex-direction: row;
          min-height: 40px;
          height: 40px;
          padding: 0 18px;
          border-radius: 999px;
          background: none;
          font-size: 14px;
          font-weight: 500;
          color: #9a9ba3;
          gap: 0;
        }
        .tabs button svg {
          display: none;
        }
        .tabs button.on {
          background: #1b1e29;
          color: #e0bf6a;
          font-weight: 600;
        }
      }
      .tabs button.on svg .dot {
        fill: currentColor;
      }
      @media (max-width: 899px) {
        .s6-back .s6-m {
          display: inline-flex;
          align-items: center;
          gap: 4px;
        }
      }
      .s6-back .s6-d {
        display: none;
      }
      @media (min-width: 900px) {
        .s6-back .s6-d {
          display: inline;
        }
      }
      .s6,
      .s6 *,
      .top,
      .tabs,
      .drawer {
        font-variant-numeric: normal;
      }
      .top .cd #cd {
        font-variant-numeric: tabular-nums;
      }
      .s6.s6-rv .s6-h1,
      .s6.s6-plan .s6-h1,
      .s6.s6-prof .s6-h1,
      .s6.s6-page .s6-h1,
      .s6.s6-week .s6-wk-head .s6-h1 {
        letter-spacing: normal;
      }
      .top .cd #cd {
        letter-spacing: normal;
      }
      @media (min-width: 900px) {
        main#main {
          padding: 32px 48px;
        }
        .s6-plan,
        .s6-page {
          margin-top: -8px;
        }
        .s6-rv {
          margin-top: -12px;
        }
      }
      /* Ansichten ohne neues Design (Anmeldung, Einführung, Import, Bearbeiten, geteilte Woche) behalten ihren Rand */
      main#main:not(.s6m) {
        padding: 16px 16px 112px;
      }
      @media (min-width: 900px) {
        main#main:not(.s6m) {
          max-width: 1080px;
          margin: 0 auto;
          padding: 32px 48px;
        }
      }
      @media (max-width: 380px) {
        .s6-acts .s6-btn {
          font-size: 14px;
          padding: 0 10px;
        }
      }
      /* ---- Heute ---- */
      .s6-today {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 16px 0;
        color: #f5f5f7;
      }
      .s6-hero {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px;
        border-radius: 22px;

        align-items: center;
        justify-content: space-between;

      .s6-min {

        line-height: 18px;
        color: #9a9ba3;
      }
      .s6-min b {

        font-weight: 700;
        font-size: 20px;
        color: #f5f5f7;
      }
      .s6-hero h2.s6-title {

      .s6-more {

    <script type="module">
      import {

      /* Lauf- und Stationszeilen als Bausteine; erkennt die Zeile nichts sicher, bleibt der Originaltext */
      const lineHtml = (t) => fmtLine(t) || esc(t);
      /* Übung auslassen (✗): bleibt sichtbar, durchgestrichen, zählt nicht als „nicht gemacht“. Nochmal tippen = wieder offen. */
      const skipBtn = (id, t, on) =>
        `<button type="button" class="ex-x${on ? " on" : ""}" data-act="x-ex" data-k="${id}" aria-pressed="${on}" aria-label="${on ? "Auslassen rückgängig: " : "Auslassen: "}${esc(t)}">✗</button>`;
      /* Lauf-Station-Zeile: je Lauf und je Station ein Zeitfeld; gespeichert wird in S.val[id], getrennt mit " / " */
      const slotsField = (id, slots, val) => {
        const parts = String(val || "").split(" / ");
        return `<div class="ex-v slots">${slots.map((s, k) => `<label class="slot"><span>${esc(s.label)}</span><input type="text" inputmode="numeric" data-vs="${id}" data-k="${k}" value="${esc(parts[k] || "")}" placeholder="${esc(s.goal || "Zeit")}" enterkeyhint="next" aria-label="Zeit ${esc(s.label)}${s.goal ? ", Ziel " + esc(s.goal) : ""}"></label>`).join("")}</div>`;
      };

      /* ---------- Zeit ---------- */
      // ?heute=2026-10-20 simuliert ein anderes Datum (zum Testen von Umplanen/Strava vor Planstart).
      const QS = new URLSearchParams(location.search);
      const SIM = /^\d{4}-\d{2}-\d{2}$/.test(QS.get("heute") || "")
        ? QS.get("heute")
        : null;
      const isoToDate = (s) => {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const NOW = SIM ? isoToDate(SIM) : new Date();
      const dayMs = 864e5;
      const TODAY = idxFromDate(NOW);
      const CURW = Math.max(0, Math.min(NWEEKS - 1, Math.floor(TODAY / 7)));
      const key = (d) =>
        d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      const keyI = (i) => key(dateFromIdx(i));
      const isoI = (i) => {
        const d = dateFromIdx(i);
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      };
      const dow = (i) => ((i % 7) + 7) % 7;
      const shortDay = (i) => DAYS[dow(i)] + " " + fmt(dateFromIdx(i));
      const idxOfIso = (s) => idxFromDate(isoToDate(s));
      const STRAVA_MIN = new Date(+START - 7 * dayMs)
        .toISOString()
        .slice(0, 10);

      /* ---------- Speicher ---------- */
      /* Lokal im Gerät (Schlüssel pro Nutzer), bei Login zusätzlich in Supabase gespiegelt. S._t = Zeit der letzten Änderung. */
      let S,
        LSK = "hx";
      /* onb: einmalige Hinweise (onb.strava = Strava-Onboarding erledigt), chat: Verlauf des Coach-Chats,
   weights: Standard-Arbeitsgewichte aus dem Profil ({übungsname: "kg"}),
   sore: Muskelkater-Meldungen ({tagIndex: {muskel: 1–10}}),
   extra: Zusatz-Einheiten neben dem Plan ({datum: [{id,type,min,rpe,note}]}), solo: Partner-Einheit allein ({datum: 1}),
   review: Wochen-Check ({wochenIndex: {feel, prog, pain, note, at, level, fc}}, src/review.js),
   later: „Später fertig machen“ ({datum: {to: zielDatum, j: [Übungsindex], at}}, src/later.js) */
      const def = () => ({
        done: {},
        xs: {},
        val: {},
        rpe: {},
        notes: {},
        sched: {},
        skip: {},
        edit: {},
        checkin: {},
        dismiss: {},
        plan: null,
        strava: { acts: {}, at: 0 },
        garmin: { well: {}, at: 0 },
        onb: {},
        chat: [],
        weights: {},
        sore: {},
        extra: {},
        solo: {},
        review: {},
        later: {},
        off: {},
        simres: {},
        tests: {
          lauf: { j: ["", "", "", ""], m: ["", "", "", ""] },
          station: {},
          trans: ["", "", "", "", "", ""],
        },
      });
      const fill = (o) => {
        for (const [k, v] of Object.entries(def())) if (o[k] == null) o[k] = v;
        if (!o.strava || !o.strava.acts) o.strava = { acts: {}, at: 0 };
        if (!o.garmin || !o.garmin.well) o.garmin = { well: {}, at: 0 };
        return o;
      };
      const lsGet = (k) => {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return null;
        }
      };
      const lsSet = (k, v) => {
        try {
          localStorage.setItem(k, v);
          return true;
        } catch (e) {
          return false;
        }
      };
      const lsDel = (k) => {
        try {
          localStorage.removeItem(k);
        } catch (e) {}
      };
      function loadLocal() {
        try {
          S = JSON.parse(lsGet(LSK) || "null") || def();
        } catch (e) {
          S = def();
        }
        fill(S);
      }
      function saveLocal() {
        if (!lsSet(LSK, JSON.stringify(S)))
          toast("Speicher voll – bitte Backup exportieren");
      }
      /* Prognose beobachten: ändert sich die Gesamtzeit (neue Testwerte, Splits, Simulationen), kommt eine Meldung mit alt → neu.
         Entprellt, damit Tippen nicht jede Ziffer meldet. */
      let fcPrognoseTimer = 0;
      function fcAnnounce() {
        try {
          const fc = rvForecast();
          if (!fc || !fc.total) return;
          const t = Math.round(fc.total),
            old = +lsGet("hx:fc-last");
          if (old && Math.abs(t - old) >= 1) {
            const d = t - old;
            toast(`Prognose verändert: ${mmss(old)} → ${mmss(t)} (${d < 0 ? "−" : "+"}${mmss(Math.abs(d))})`);
          }
          lsSet("hx:fc-last", String(t));
        } catch (_) {}
      }
      function save() {
        weekSnap();
        S._t = Date.now();
        saveLocal();
        queuePush();
        clearTimeout(fcPrognoseTimer);
        fcPrognoseTimer = setTimeout(fcAnnounce, 1500);
      }
      loadLocal();

      /* ---------- Helfer ---------- */
      const $ = (s) => document.querySelector(s);
      const HARD = ["kraft", "lauf", "station", "sim"];
      const isHardP = (p) => !!p && HARD.includes(p.k) && !isEasyRun(p);

      /* ---------- Gemeinsame Planänderungen (Tabelle shared_edits, siehe supabase/shared_edits.sql) ---------- */
      let TEAM_EDITS = {}; // {tagIndex: {data: {t,k,i,n}, by, at}}
      try {
        TEAM_EDITS = JSON.parse(lsGet("hx:team-edits") || "{}") || {};
      } catch (_) {}
      /* Holt die Änderungen des Teams. Gibt true zurück, wenn sich etwas geändert hat. Offline bleibt der letzte Stand. */
      async function loadTeamEdits() {
        if (!sb || !USER) return false;
        const sp = await loadSharedPlan();
        const { data, error } = await sb
          .from("shared_edits")
          .select("day,data,updated_by,updated_at");
        if (error || !Array.isArray(data)) return sp;
        const next = {};
        for (const r of data)
          next[r.day] = { data: r.data, by: r.updated_by, at: r.updated_at };
        if (stable(next) === stable(TEAM_EDITS)) return sp;
        TEAM_EDITS = next;
        lsSet("hx:team-edits", JSON.stringify(next));
        return true;
      }
      /* Gemeinsamer Gesamtplan des Teams (Tabelle shared_plan, siehe supabase/shared_plan.sql). Ein persönlicher Plan (S.plan) hat Vorrang. */
      let SHARED_PLAN = null;
      try {
        SHARED_PLAN = JSON.parse(lsGet("hx:shared-plan") || "null");
      } catch (_) {}
      async function loadSharedPlan() {
        const { data, error } = await sb
          .from("shared_plan")
          .select("data,updated_by,updated_at")
          .maybeSingle();
        if (error) return false;
        const next = data
          ? { ...data.data, by: data.updated_by, at: data.updated_at }
          : null;
        if (stable(next) === stable(SHARED_PLAN)) return false;
        SHARED_PLAN = next;
        lsSet("hx:shared-plan", JSON.stringify(next));
        return true;
      }
      /* Gilt der eigene Plan (S.plan)? Nur wenn es keinen gemeinsamen gibt oder der eigene neuer ist: so ersetzt «Für uns beide» ältere eigene Pläne */
      const ownPlanActive = () =>
        !!S.plan &&
        (!SHARED_PLAN ||
          (S.plan.importedAt || 0) > (SHARED_PLAN.importedAt || 0));
      const PLAN = () => activePlan(ownPlanActive() ? S.plan : SHARED_PLAN);
      const weekInfo = (w) => planWeekInfo(PLAN(), w);
      const blockLabel = (b) => (b === "T" ? "Taper" : "Block " + b);
      /* Originalplan eines Tages (ohne Umplanungen) */
      function basePlan(i) {
        if (i < 0 || i > LAST) return null;
        const b = PLAN().days[i] || null,
          sh = TEAM_EDITS[i];
        if (!sh || !b || b.race) return b;
        // Gemeinsame Änderung (alle Mitglieder): ersetzt die Einheit, persönliche Änderungen (S.edit) liegen darüber
        return Object.assign({}, b, {
          t: sh.data.t,
          k: sh.data.k,
          i: sh.data.i,
          n: sh.data.n || "",
          shared: { by: sh.by, at: sh.at },
        });
      }

      /* ---------- Umplanen ----------
   S.sched[tagIndex] = {src: Tag, dessen Einheit hier stattfindet, inj: "pause"|"alt", back: Comeback, easy: entlastet}
   S.skip[datumKey]  = Einheit ist ausgefallen */
      const srcOf = (x) =>
        S.sched[x] && S.sched[x].src != null ? S.sched[x].src : x;
      function setE(x, patch) {
        const o = Object.assign({}, S.sched[x], patch);
        for (const k of Object.keys(o))
          if (o[k] == null || o[k] === false) delete o[k];
        if (o.src === x) delete o.src;
        if (Object.keys(o).length) S.sched[x] = o;
        else delete S.sched[x];
      }
      /* Der Plan ist aus Jaimes Sicht geschrieben ("mit Jimoh"). Für den Partner wird der Name getauscht. */
      let ME = "Jaime",
        PARTNER = "Jimoh";
      const per = (s) =>
        ME === "Jaime" ? s : String(s).replace(/Jimoh/g, PARTNER);
      /* Plan inkl. eigener Übungsanpassung (S.edit hängt an der Einheit, nicht am Datum – wandert beim Verschieben mit) */
      function ownPlan(src) {
        const b = basePlan(src);
        if (!b) return null;
        const p = Object.assign({}, b, {
          t: per(b.t),
          i: (b.i || []).map(per),
          n: per(b.n || ""),
        });
        const ed = S.edit[src];
        if (ed && p.k !== "rest")
          Object.assign(p, {
            t: ed.t || p.t,
            k: ed.k || p.k,
            i: ed.i,
            n: ed.n || "",
            edited: 1,
          });
        // Titel «Compromised Running» ohne Kraft; Zeilen mit « → » ab Plantag 16 in zwei Zeilen teilen (nicht bei eigener Anpassung)
        return tidyDay(p, src, !!(ed && p.k !== "rest"));
      }
      function dayPlan(i) {
        if (i < 0 || i > LAST) return null;
        const o = S.sched[i] || {},
          src = srcOf(i);
        let p = ownPlan(src);
        if (!p) return null;
        if (src !== i) p.moved = src;
        if (o.inj) {
          const was = p.k === "rest" ? "" : ` Geplant war: ${p.t}.`;
          if (o.inj === "pause" || p.k === "rest")
            p = {
              t: p.k === "rest" ? "Ruhetag" : "Verletzt – Pause",
              k: "rest",
              i: [],
              n: "Heute kein Training. Erholen, schlafen, gut essen." + was,
              inj: o.inj,
            };
          else
            p = {
              t: "Alternativtraining",
              k: "bike",
              i: [
                "Mobility 15′, nur schmerzfreie Bewegungen",
                "Bike 30–40′ Zone 1–2, ganz locker",
                "Core / Oberkörper leicht, verletzte Stelle schonen",
              ],
              n:
                "Nur machen, was ohne Schmerzen geht. Bei Schmerz sofort aufhören." +
                was,
              inj: o.inj,
            };
        } else if (p.k !== "rest" && (o.back || o.easy)) {
          const pre = o.back
            ? "Comeback nach Pause: ca. 70 % von Volumen und Gewicht, RPE max. 6."
            : "Entlastet: ca. 75 % Volumen, RPE max. 6.";
          p.n = pre + (p.n ? " " + p.n : "");
          if (o.back) p.back = 1;
          else p.easy = 1;
        }
        if (!o.inj && S.solo[keyI(i)] && canSolo(p)) p = soloize(p, PARTNER);
        return p;
      }
      /* Einheiten von Tag i und j tauschen. Abgehakte Übungen, Werte, der Solo-Schalter und „Entlastet“ wandern mit der Einheit mit
         (Verletzung und Comeback hängen am Datum und bleiben). */
      function swapDays(i, j) {
        const a = srcOf(i),
          b = srcOf(j),
          ea = S.sched[i] && S.sched[i].easy,
          eb = S.sched[j] && S.sched[j].easy;
        setE(i, { src: b, easy: eb ? 1 : null });
        setE(j, { src: a, easy: ea ? 1 : null });
        swapDayData(S, keyI(i), keyI(j));
      }
      function restoreDay(i) {
        const o = S.sched[i];
        if (!o) return;
        if (o.inj || o.back || o.easy)
          return setE(i, { inj: null, back: null, easy: null });
        for (let x = 0; x <= LAST; x++)
          if (x !== i && srcOf(x) === i) return swapDays(i, x);
        setE(i, { src: null });
      }
      /* Tage, die nach dem Tausch von i und j hart neben einer getauschten harten Einheit liegen (für das Abzeichen in der Liste) */
      function hardClash(i, j) {
        const after = (x) =>
          x === i ? dayPlan(j) : x === j ? dayPlan(i) : dayPlan(x);
        const hard = (p) => isHardP(p) && !p.easy; // entlastete Einheit zählt nicht als hart
        const out = [];
        for (const d of [i, j])
          if (hard(after(d)))
            for (const n of [d - 1, d + 1])
              if (hard(after(n)) && !out.includes(n)) out.push(n);
        return out.sort((a, b) => a - b);
      }
      function applyInjury(start, days, mode) {
        const end = Math.min(LAST, start + days - 1);
        for (let x = start; x <= end; x++)
          setE(x, { inj: mode, back: null, easy: null });
        for (let x = end + 1; x <= LAST; x++)
          if (S.sched[x] && S.sched[x].back) setE(x, { back: null });
        if (days >= 3) markComeback(end + 1);
      }
      function markComeback(from) {
        let n = 0;
        for (let x = Math.max(0, from); x <= LAST && n < 3; x++) {
          const p = dayPlan(x);
          if (p && p.k !== "rest" && !p.inj) {
            setE(x, { back: 1, easy: null });
            n++;
          }
        }
      }
      function endInjury() {
        const t = Math.max(0, TODAY);
        for (let x = t; x <= LAST; x++)
          if (S.sched[x]) setE(x, { inj: null, back: null });
        markComeback(t);
      }
      const injActive = () =>
        Object.keys(S.sched).some((x) => +x >= TODAY && S.sched[x].inj);

      function placeholder(k, t) {
        if (k === "kraft") return /plank/i.test(t) ? "Zeit" : "kg";
        if (k === "lauf")
          return /4\s*[×x]\s*1\s*km/i.test(t)
            ? "4 Splits: 3:52 3:55 …"
            : dash.parseReps(t)
              ? "Splits"
              : "Zeit";
        if (k === "bike") return "Dauer";
        return "Zeit";
      }
      /* Testtag (Pacing-/T-Test, Stationen-Benchmark): Einträge der Einheit in Profil → Tests & Benchmarks übernehmen.
   onlyEmpty = nur leere Felder füllen (Garmin/Strava); Handeinträge ersetzen den alten Wert. Gibt die Anzahl Änderungen zurück. */
      function testsFromDay(i, onlyEmpty) {
        const p = dayPlan(i);
        if (!p) return 0;
        const dk = keyI(i);
        const n = applyTests(
          S.tests,
          myCol(),
          extractTests(
            p,
            p.i.map((_, j) => S.val[dk + "|" + j]),
          ),
          { onlyEmpty },
        );
        if (n) S.tests.at = isoD(NOW);
        return n;
      }
      let testToast = {}; // pro Tag nur einmal melden

      function testsBackfill() {
        let n = 0;

      /* Letzter Eintrag derselben Übung vor Tag i: {v: Wert, rpe: RPE jener Einheit} oder null */
      function lastEntry(i, t) {
        const n = exName(t);
        for (let j = i - 1; j >= 0; j--) {

          if (!p) continue;

          for (let x = 0; x < p.i.length; x++)

      /* Übernehmen-Auswahl: welche Übungen wurden gemacht? (Tag-Index oder null) */
      let takeOpen = null;
      function takePicker(i) {

          had = p.i.map((_, j) => !!S.done[dk + "|" + j]),

      /* Die geplante Einheit eines Tages: unter den passenden Aktivitäten die längste (ein kurzer Zusatzlauf zählt nicht) */
      function planAct(i) {

        let msg = `${js.length === p.i.length ? "Workout erledigt" : `${js.length} von ${p.i.length} Übungen erledigt`}${a ? " – von " + srcName(a) + " übernommen" : ""}`;

          } else if (p.k === "lauf" || p.k === "bike") {
            // Lauf/Rad ohne Intervalle: nur Gesamtwerte (Distanz, Zeit, Pace, Puls) in die Hauptzeile
            const j = js.find((x) => !isFiller(p.i[x]));

          const p = dayPlan(i);
          if (
            !p ||
            p.k === "rest" ||
            S.off[keyI(i)] ||
            S.dismiss["tk:" + i] ||
            S.dismiss["stv:" + i]

      }
      /* Aktivitäten, die zu keiner geplanten Einheit passen, als Zusatz-Einheit eintragen (id "a:<Aktivität>").

          const i = +x;

          const dk = keyI(i),
            pa = planAct(i);
          for (const a of actsOf(i)) {
            if (pa && a.id === pa.id) continue; // die geplante Einheit selbst
            if (

                note: (a.name || srcName(a)).slice(0, 80),

      /* Strava-Treffer der letzten 3 Tage, die noch nicht übernommen sind – Ein-Klick-Vorschlag statt automatisch abhaken */

            !e.match ||

  <div class="mt-2">${a.name ? `<b>${esc(a.name)}</b> · ` : ""}${esc(strava.summary(a))}</div><div class="sub mt-1">Passt zu „${esc(p.t)}“. Als erledigt übernehmen?</div>
  ${takeOpen === x ? takePicker(x) : `<div class="grid2 mt-3"><button class="btn primary sm" data-act="strava-take" data-i="${x}">Übernehmen</button><button class="btn sm" data-act="strava-no" data-i="${x}">Nein</button></div>`}</div>`,

      const RPE_STOPS = [

        [0.72, [250, 204, 21]],
        [1, [239, 68, 68]],

      function rpeColor(t) {

        const [t0, a] = RPE_STOPS[k - 1],
          [t1, b] = RPE_STOPS[k],
          f = Math.max(0, Math.min(1, (t - t0) / (t1 - t0)));

      }
      function doneBar(i, p) {

      }
      /* Muskelkater- und Überlastungs-Hinweis eines Tages (mit Entlasten/Verschieben), von der Einheitskarte und der Heute-Karte genutzt */
      function dayWarn(i, p) {
        let h = "";

                  .slice(0, 3)

            .join(

            )}.${oi.byExtra && oi.runs.length ? `<div class="xcause">Ausgelöst durch Zusatz-Einheit: ${oi.runs.map((r) => `${esc(r.label)} (${esc(shortDay(r.d))})`).join(", ")}</div>` : ""}${p.easy ? " Die Einheit ist bereits entlastet." : `<div class="grid2 mt-3"><button class="btn sm" data-act="ol-easy" data-i="${i}">Entlasten</button><button class="btn sm" data-move="${i}">Verschieben …</button></div>`}</div>`;

      function carryCards(i) {

                : `<div class="ex-v"><input type="text" data-v2="${id}" value="${esc(S.val[id] || "")}" placeholder="${placeholder(isLift(p.k, t) ? "kraft" : p.k, t)}" enterkeyhint="next" aria-label="Wert für ${esc(t)}"></div>`;

      }
      /* Aktionen unter dem Kopf einer Einheit, an jedem Trainingstag gleich aufgebaut:

      const gmSent =

      /* Android: öffnet die Garmin-Connect-App (sie synchronisiert die Uhr beim Öffnen), sonst die Workout-Seite im Browser */
      const GC_OPEN =
