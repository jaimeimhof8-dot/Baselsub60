<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kommentare · Übersicht</title>
<style>
  :root{color-scheme:dark;--bg:#06070a;--card:#0e1016;--well:#161922;--text:#f5f5f7;--muted:#9a9ba3;--accent:#e0bf6a}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/22px system-ui,sans-serif;padding:24px 16px}
  main{max-width:820px;margin:0 auto}
  h1{font:700 28px/32px "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  button,select{font:600 13px/18px system-ui;background:var(--card);color:var(--text);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
  button.on{background:var(--accent);color:#16181a}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
  .c{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
  .m{font-size:12px;color:var(--muted)}
  .t{white-space:pre-wrap}
  .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
  code{background:var(--well);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}
  .done{color:var(--accent);background:none;padding:4px 0}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Kommentare</h1>
  <div class="sub" id="sub"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</main>
<script>
  const KIND = { point: "Punkt", element: "Element", area: "Bereich" };
  let list = [], filter = "alle";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const load = () => fetch("/__feedback").then((r) => r.json()).then((l) => { list = l; draw(); }).catch(() => {});
  function draw() {
    document.getElementById("sub").textContent = `${list.length} offen · aktualisiert sich selbst`;
    document.getElementById("bar").innerHTML = ["alle", "desktop", "handy"].map((f) => `<button class="${filter === f ? "on" : ""}" data-f="${f}">${f === "alle" ? "Alle" : f === "desktop" ? "Desktop" : "Handy"}</button>`).join("");
    const shown = list.map((c, i) => ({ ...c, n: i + 1 })).filter((c) => filter === "alle" || (c.mode || "desktop") === filter);
    if (!shown.length) return (document.getElementById("list").innerHTML = '<div class="empty">Keine Kommentare.</div>');
    const groups = {};
    shown.forEach((c) => (groups[c.screen] ||= []).push(c));
    document.getElementById("list").innerHTML = Object.entries(groups).map(([s, cs]) => `<h2>${esc(s)} (${cs.length})</h2>` + cs.map((c) => `
      <div class="c"><div class="m">#${c.n} · ${c.mode === "handy" ? "Handy" : "Desktop"} · ${KIND[c.kind || "point"]} · ${new Date(c.at).toLocaleString("de-CH")}</div>
      <div class="t">${esc(c.text)}</div>
      <code title="${esc(c.selector)}">${esc(c.elementText || c.selector)}</code>
      <div class="row"><span></span><button class="done" data-d="${esc(c.id)}">Erledigt</button></div></div>`).join("")).join("");
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.f) { filter = b.dataset.f; draw(); }
    if (b.dataset.d) { list = await fetch("/__feedback", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.d }) }).then((r) => r.json()); draw(); }
  });
  load(); setInterval(load, 2000);
</script>
</body>
</html>
