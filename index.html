        }
        const stBad =
          stMsg &&
          /nicht|fehl|erreichbar|antwortet|abgelehnt|ungültig|Fehler/i.test(
            stMsg,
          );
        const errCard = stBad
          ? `<section class="s6-card s6-err" role="alert"><div class="hd"><span class="ex" aria-hidden="true">!</span><span class="nm"><b>Strava antwortet nicht</b><span>${esc(stMsg)} Deine Einträge sind sicher.</span></span></div><div class="acts"><button type="button" class="s6-btn" data-act="${tok ? "st-sync" : "st-connect"}">Erneut versuchen</button><button type="button" class="s6-btn ghost" data-act="st-dismiss">Später</button></div></section>`
          : "";
        return `<div class="s6 s6-page">${s6Page("Verbindungen", ["Läufe und Fahrten werden automatisch mit dem Plan abgeglichen.", "Läufe, Fahrten und Erholung werden automatisch mit dem Plan abgeglichen."])}${errCard}<div class="s6-two"><section class="s6-card s6-cn">${sBody}</section><section class="s6-card s6-cn gmc">${gm}${gmRest}</section></div>${csv}${list}</div>`;
      }
      /* Datei auf das Feld «Wiederherstellen» ziehen (Desktop) */
      document.addEventListener("dragover", (e) => {
        const z = e.target.closest && e.target.closest(".s6-dz");
        if (z) {
          e.preventDefault();
          z.classList.add("over");
        }
      });
      document.addEventListener("dragleave", (e) => {
        const z = e.target.closest && e.target.closest(".s6-dz");
        if (z) z.classList.remove("over");
      });
      document.addEventListener("drop", (e) => {
        const z = e.target.closest && e.target.closest(".s6-dz");
        if (!z) return;
        e.preventDefault();
        z.classList.remove("over");
        const f = e.dataTransfer && e.dataTransfer.files,
          inp = z.querySelector("input[type=file]");
        if (f && f[0] && inp) {
          inp.files = f;
          inp.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });
      /* ---- Menü: Konto-Zeile ---- */
      function s6MenuAcct() {
        let ini, name, sub, btn;
        if (sb && USER) {
          ini = ME[0];
          name = ME;
          sub = `<span class="acct-sync">${syncLabel()}</span>`;
          btn = `<button type="button" data-act="logout">Abmelden</button>`;
        } else if (CLOUD) return "";
        else {
          const m = mockUser();
          if (m) {
            ini = m.name[0];
            name = m.name;
            sub = `<span>Vorschau-Login · nur dieses Gerät</span>`;
            btn = `<button type="button" data-act="logout">Abmelden</button>`;
          } else {
            ini = ME[0];
            name = "Nicht angemeldet";
            sub = `<span>Einträge bleiben auf diesem Gerät</span>`;
            btn = `<button type="button" data-v="login">Anmelden</button>`;
          }
        }
        return `<div class="macct"><button type="button" class="av3" data-v="profile" aria-label="Profil öffnen">${esc(ini)}</button><span class="tx"><b>${esc(name)}</b>${sub}</span>${btn}</div>`;
      }
      /* ================= Fokusmodus (Canvas «Neu») ================= */
      /* Satzfortschritt je Übung: nur auf diesem Gerät und nur für den heutigen Trainingstag */
      const FC_SETS_KEY = "hx:fc-sets";
      const fcSetsAll = () => {
        try {
          return JSON.parse(lsGet(FC_SETS_KEY) || "{}") || {};
        } catch (_) {
          return {};
        }
      };
      const fcSetsGet = (id) => +fcSetsAll()[id] || 0;
      function fcSetsSet(id, n) {
        const a = fcSetsAll(),
          dk = id.split("|")[0],
          out = {};
        for (const k of Object.keys(a))
          if (k.startsWith(dk + "|")) out[k] = a[k];
        if (n > 0) out[id] = n;
        else delete out[id];
        lsSet(FC_SETS_KEY, JSON.stringify(out));
      }
      const s7SetN = (t) => {
        const m = /(\d+)\s*[×x]\s*(\d+)/.exec(String(t));
        return m ? Math.max(1, +m[1]) : 1;
      };
      const F7_X = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
      const F7_CHEV = (d) =>
        `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
      const F7_OK = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l5 5 9-10"/></svg>`;
      /* Eine Übung pro Bildschirm: Titel, Gewicht, Sätze, grosse Hauptaktion */
      function s7ExView(p, dk, n, nd, dran, dir) {
        const isDone = (x) => !!S.done[dk + "|" + x];
        const t = p.i[focusJ],
          id = dk + "|" + focusJ,
          on = isDone(focusJ),
          lift = isLift(p.k, t),
          filler = isFiller(t),
          r = s7Row(t),
          sn = s7SetN(t),
          sd = on ? sn : Math.min(sn - 1, fcSetsGet(id));
        const pre = !S.val[id] ? preWeight(p, t) : "",
          val = S.val[id] || pre,
          le = lift ? lastEntry(focusI, t) : null;
        const segs = p.i
          .map(
            (_, x) =>
              `<i class="${isDone(x) ? "d" : ""}${x === focusJ ? " c" : ""}"></i>`,
          )
          .join("");
        const items = p.i
          .map((t2, x) => {
            const r2 = s7Row(t2),
              wv = S.val[dk + "|" + x] || preWeight(p, t2),
              meta =
                x === dran && !isDone(x)
                  ? `<em class="g">Dran</em>`
                  : `<em>${esc(/×\s*\d+$/.test(r2.val) || !wv ? r2.val : wv)}</em>`;
            return `<button type="button" class="${x === focusJ ? "on" : ""}${isDone(x) ? " d" : ""}" data-fc="go" data-j="${x}"><i>${isDone(x) ? "✓" : x + 1}</i><span>${esc(r2.title.replace(", dann ", " + "))}</span>${meta}</button>`;
          })
          .join("");
        const nm = r.title.length;
        const fs =
          nm > 30 ? "f7-xs" : nm > 20 ? "f7-s" : nm > 14 ? "f7-m2" : "";
        const subs = r.subs.filter(Boolean).join(" · ");
        const setsTxt = /^(\d+) × (\d+)$/.exec(r.val);
        const meta = `<span class="f7-de">${setsTxt ? `${setsTxt[1]} Sätze × ${setsTxt[2]} Wiederholungen` : esc(r.val)}${subs ? ` · ${esc(subs)}` : ""}</span><span class="f7-mo">${setsTxt ? `${setsTxt[1]} Sätze × ${setsTxt[2]} Wdh` : esc(r.val)}${subs ? ` · ${esc(subs)}` : ""}</span>`;
        // Gewicht oder Zeitfelder
        let field = "",
          note = "";
        if (!filler) {
          if (lineSlots(t))
            field = `<div class="fc-field slots">${slotsField(id, lineSlots(t), S.val[id])}</div>`;
          else if (lift) {
            const num = String(val || "").replace(/\s*kg\s*$/i, "");
            field = `<div class="f7-w"><button type="button" data-fc="dec" aria-label="Gewicht verringern">${F7_CHEV("M5 12h14")}</button><div class="f7-wv"><div class="f7-n"><input class="f7-in${pre ? " pre" : ""}" type="text" data-v2="${id}" value="${esc(num)}" inputmode="decimal" placeholder="–" enterkeyhint="done" aria-label="Gewicht für ${esc(r.title)} in Kilogramm"><span>kg</span></div><span class="s6-kick">Gewicht</span></div><button type="button" data-fc="inc" aria-label="Gewicht erhöhen">${F7_CHEV("M12 5v14M5 12h14")}</button></div>`;
            note =
              le && le.v && S.val[id] !== le.v && !pre
                ? `<button type="button" class="f7-last" data-fc="last" data-v="${esc(le.v)}">Zuletzt ${esc(le.v)} übernehmen</button>`
                : le && le.v
                  ? `<p class="f7-note"><span class="f7-de">Zuletzt ${esc(le.v)}, bereits übernommen. Ändern mit − und +.</span><span class="f7-mo">Zuletzt ${esc(le.v)}, übernommen.</span></p>`
                  : pre
                    ? `<p class="f7-note">Geplant ${esc(pre)}. Ändern mit − und +.</p>`
                    : `<p class="f7-note">Gewicht mit − und + eintragen.</p>`;
          } else
            field = `<div class="f7-w one"><div class="f7-wv"><input class="f7-in txt" type="text" data-v2="${id}" value="${esc(val)}" placeholder="${esc(placeholder(p.k, t))}" enterkeyhint="done" aria-label="Wert für ${esc(r.title)}"><span class="s6-kick">Zeit oder Wert</span></div></div>`;
        }
        // Sätze
        let sets = "";
        if (sn > 1)
          sets = `<div class="f7-sets" role="group" aria-label="Sätze"><span class="s6-kick">Satz</span>${Array.from({ length: sn }, (_, k) => `<button type="button" class="${k < sd ? "d" : k === sd ? "on" : ""}" data-fc="sset" data-k="${k + 1}" aria-label="Satz ${k + 1}${k < sd ? " erledigt" : ""}">${k < sd ? "✓" : k + 1}</button>`).join("")}</div>`;
        // Timer nur, wenn der Plan eine Zeit vorgibt
        const spec = timedSpec(t, p.k);
        let timer = "";
        if (spec) {
          const v =
            fcT.spec &&
            fcT.spec.work === spec.work &&
            fcT.spec.rounds === spec.rounds
              ? fcView(spec)
              : {
                  time: mmss(spec.work),
                  label:
                    spec.label +
                    (spec.rounds > 1 ? ` · ${spec.rounds} Runden` : ""),
                  ph: "idle",
                };
          const started = fcT.spec && fcElapsed() > 0;
          timer = `<div class="fc-timer" data-ph="${v.ph}"><div><div class="fc-time" id="fc-time">${v.time}</div><div class="fc-tlabel" id="fc-tlabel">${esc(v.label)}</div></div><div class="fc-tbtn"><button type="button" class="${fcT.run ? "stop" : "go"}" data-fc="tstart">${fcT.run ? "Pause" : started && v.ph !== "done" ? "Weiter" : "Start"}</button>${started && !fcT.run ? `<button type="button" data-fc="treset">Neu</button>` : ""}</div></div>`;
        }
        const nxt =
          on || dran !== focusJ
            ? dran
            : nextOpen(n, (x) => isDone(x) || x === focusJ, focusJ + 1);
        const nxName =
          nxt >= 0 && nxt !== focusJ ? esc(s7Row(p.i[nxt]).title) : "";
        const label = on
          ? "Erledigt"
          : sn > 1
            ? `Satz ${sd + 1} fertig`
            : "Fertig";
        return `<header class="f7-h"><button type="button" class="f7-x" data-fc="close" aria-label="Fokusmodus schliessen">${F7_X}</button><div class="f7-t"><span class="s6-kick">${esc(KIND[p.k] || "")}</span><b>${esc(s7Title(p.t))}</b></div><div class="f7-p"><span class="f7-sg" aria-hidden="true">${segs}</span><span class="f7-c">${nd} / ${n}</span></div></header>
    <div class="f7-segrow" aria-hidden="true">${segs}</div>
    <div class="f7-b"><nav class="f7-list" aria-label="Übungen">${items}</nav>
    <main class="f7-ma${dir ? " go-" + dir : ""}"><div class="f7-ex"><span class="s6-kick f7-gold f7-mo">Übung ${focusJ + 1} von ${n}</span><h1 class="f7-name ${fs}">${esc(r.title)}</h1><p class="f7-meta">${meta}</p></div>${field}${note}${sets}${timer}
    <div class="f7-bot">${nxName ? `<button type="button" class="f7-up f7-mo" data-fc="go" data-j="${nxt}"><span><small class="s6-kick">Danach</small> <b>${nxName}</b></span>${F7_CHEV("M9 6l6 6-6 6")}</button>` : ""}
    <div class="f7-nav"><button type="button" class="f7-pv" data-fc="prev" ${focusJ === 0 ? "disabled" : ""} aria-label="Vorherige Übung">${F7_CHEV("M15 6l-6 6 6 6")}</button><button type="button" class="f7-ok${on ? " on" : ""}" data-fc="sdone" aria-label="${on ? "Erledigt, nochmals tippen zum Rückgängig" : label}">${F7_OK}${label}</button><div class="f7-nx">${nxName ? `<span class="f7-de"><small class="s6-kick">Danach</small><b>${nxName}</b></span>` : ""}<button type="button" data-fc="next" ${focusJ === n - 1 ? "disabled" : ""} aria-label="Nächste Übung">${F7_CHEV("M9 6l6 6-6 6")}</button></div></div></div></main></div>`;
      }
      /* Satz abschliessen; nach dem letzten Satz ist die Übung erledigt. Auf einen erledigten Satz tippen nimmt ihn zurück. */
      let fcTapLock = 0;
      function fcSetDone() {
        if (Date.now() < fcTapLock) return;
        const p = dayPlan(focusI),
          dk = keyI(focusI),
          id = dk + "|" + focusJ,
          n = s7SetN(p.i[focusJ]);
        if (S.done[id]) {
          fcSetsSet(id, Math.max(0, n - 1));
          return focusDone(); // nochmals tippen = wieder öffnen
        }
        const sd = fcSetsGet(id) + 1;
        if (sd < n) {
          fcSetsSet(id, sd);
          try {
            navigator.vibrate && navigator.vibrate(18);
          } catch (_) {}
          return focusRender();
        }
        fcSetsSet(id, n);
        fcTapLock = Date.now() + 500;
        focusDone();
      }
      function fcSetTap(k) {
        const p = dayPlan(focusI),
          id = keyI(focusI) + "|" + focusJ,
          n = s7SetN(p.i[focusJ]);
        if (S.done[id]) return;
        const sd = fcSetsGet(id);
        if (k >= n) {
          fcSetsSet(id, n - 1);
          return fcSetDone();
        }
        fcSetsSet(id, k === sd ? Math.max(0, k - 1) : k);
        focusRender();
      }

      /* ---------- Stationstag: Schritte mit Zeiten (Splits) ---------- */
      const SP_KEY = "hx:fc-sp";
      const SP_COL = {
        warm: "#9a9ba3",
        cool: "#9a9ba3",
        run: "#64a8ff",
        station: "#bf8cff",
        rest: "#6d7176",
        other: "#9a9ba3",
      };
      /* Plan eines Stationstags → Schritte: Einlaufen, Referenzlauf, je Runde Station · Lauf · Pause, Auslaufen. Sonst null (dann normaler Fokusmodus). */
      function s7Steps(p) {
        if (!p || p.k !== "station" || !(p.i || []).length) return null;
        const all = p.i.join(" | "),
          f200 =
            /Erste (\d+) m nach jeder Station .*?bei (\d:\d\d)\s*\/km/.exec(
              all,
            ),
          ue = /(\d+) s Übergang/.exec(all),
          steps = [];
        let rounds = 0;
        // Aufgeteilte Runden (src/split.js: «Runde 2: Station» + «Runde 2: 1 km …») wieder zu einer Runde zusammenfassen;
        // jr = Zeile des Laufs, damit Lauf und Pause an ihrer eigenen Zeile hängen
        const lines = [];
        p.i.forEach((t0, j) => {
          const t = String(t0).replace(/\s+/g, " ").trim(),
            prev = lines[lines.length - 1],
            rm = /^Runde (\d+):\s*(\d+(?:,\d+)?\s?km)\s*@/.exec(t),
            sm = /^Runde (\d+):\s*(.+?)\s*\(([^)]*)\)$/.exec(t);
          if (rm && prev && prev.round === rm[1] && !prev.merged) {
            prev.t += " → " + t.replace(/^Runde \d+:\s*/, "");
            prev.jr = j;
            prev.merged = true;
            return;
          }
          lines.push({ t, j, jr: j, round: sm && !/\bkm\b/.test(sm[2]) ? sm[1] : null });
        });
        lines.forEach(({ t, j, jr }) => {
          let m;
          if (
            (m =
              /^(Einlaufen|Auslaufen)\s+(\d[\d,.]*\s?(?:km|m))\s*@\s*(\d:\d\d)\/km\s*\((\d+:\d\d)\)$/.exec(
                t,
              ))
          )
            steps.push({
              j,
              kind: m[1] === "Einlaufen" ? "warm" : "cool",
              tp: m[1],
              name: m[2],
              sub: `@ ${m[3]} /km`,
              goal: parseT(m[4]),
            });
          else if (
            (m =
              /^Runde (\d+) frisch ohne Station:\s*(\d+(?:,\d+)? km)\b.*?\((\d+:\d\d)\)/.exec(
                t,
              ))
          )
            steps.push({
              j,
              kind: "run",
              tp: "Lauf",
              name: `${m[2]} Referenz`,
              sub: "",
              goal: parseT(m[3]),
            });
          else if (
            (m = /^Runde (\d+):\s*(.+?)\s*\(([^)]*)\)\s*→\s*(.+)$/.exec(t))
          ) {
            rounds++;
            const hm = /^(.*?)\s+(\d[\d,.]*\s?m)(?:\s+mit\s+(\d+\s?kg))?$/.exec(
                m[2],
              ),
              ps = m[3].split(/,\s*/),
              plates = ps.find((x) => /^\d+\s?kg Platten$/.test(x)),
              ziel = ps.map((x) => /^Ziel (\d+:\d\d)$/.exec(x)).find(Boolean),
              extra = ps
                .filter(
                  (x) =>
                    x !== plates && !/^Ziel /.test(x) && !/Übergang/.test(x),
                )
                .map((x) => x.replace(/ als Ghost-Partner$/, "")),
              tail = m[4].split(/,\s*/),
              rest = tail
                .map((x) => /^(\d+) (Min|s) Pause$/.exec(x))
                .find(Boolean);
            const kg =
              hm && hm[3]
                ? plates
                  ? `${hm[3]} (${plates})`
                  : hm[3]
                : plates || "";
            steps.push({
              j,
              kind: "station",
              tp: "Station",
              name: hm ? hm[1] : m[2],
              sub: [hm ? hm[2] : "", kg, ...extra].filter(Boolean).join(" · "),
              goal: ziel ? parseT(ziel[1]) : 0,
            });
            const rm =
              /(\d+(?:,\d+)?\s?km)\s*@\s*(\d:\d\d)\/km\s*(?:\((\d+:\d\d)\))?/.exec(
                m[4],
              );
            steps.push({
              j: jr,
              kind: "run",
              tp: "Lauf",
              name: rm ? rm[1] : "Lauf",
              sub:
                ue && f200
                  ? `${ue[1]} s Übergang · erste ${f200[1]} m ${f200[2]}`
                  : rm
                    ? `@ ${rm[2]} /km`
                    : "",
              goal:
                rm && rm[3]
                  ? parseT(rm[3])
                  : rm
                    ? Math.round(parseFloat(rm[1]) * parseT(rm[2]))
                    : 0,
            });
            if (rest)
              steps.push({
                j: jr,
                kind: "rest",
                tp: "Pause",
                name: "Erholen",
                sub: rest[2],
                goal: +rest[1] * (rest[2] === "Min" ? 60 : 1),
              });
          } else if (!/^Erste \d+ m nach jeder Station/.test(t))
            steps.push({
              j,
              kind: "other",
              tp: "Schritt",
              name: s7Row(t).title,
              sub: "",
              goal: 0,
            });
        });
        return rounds ? steps : null;
      }
      function s7SpRules(p) {
        const all = (p.i || []).join(" | "),
          tempo = /Verbot schneller als (\d:\d\d)\s*\/km/.exec(all),
          puls = /Puls (\d+[–-]\d+) bpm/.exec(all),
          red = /Redline ab (\d+) bpm/.exec(all),
          f =
            /Erste (\d+) m nach jeder Station .*?bei (\d:\d\d)\s*\/km .*?dann auf (\d:\d\d)\s*\/km/.exec(
              all,
            );
        const w = (k, v, s) =>
          `<div class="sp-w"><span class="s6-kick">${k}</span><b>${v}</b><span>${s}</span></div>`;
        const out = [
          tempo ? w("Tempo", `${tempo[1]} /km`, "nie schneller") : "",
          puls && red ? w("Puls", puls[1], `Redline ${red[1]} bpm`) : "",
          f ? w("Nach Station", `${f[1]} m ${f[2]} /km`, `dann ${f[3]}`) : "",
        ].filter(Boolean);
        return out.length ? `<div class="sp-rules">${out.join("")}</div>` : "";
      }
      let fcSp = null, // {dk, t0, s0, idx, done:[s]} – gemessene Schritte des Tages
        fcSpIv = null,
        fcSpBeep = -1;
      const spSave = () => lsSet(SP_KEY, JSON.stringify(fcSp));
      function spLoad(dk, steps) {
        let o = null;
        try {
          o = JSON.parse(lsGet(SP_KEY) || "null");
        } catch (_) {}
        if (
          o &&
          o.t0 &&
          o.idx < steps.length &&
          Date.now() - o.s0 > 6 * 3600 * 1000
        )
          o = null; // alte, nie beendete Messung
        fcSp =
          o && o.dk === dk && Array.isArray(o.done)
            ? o
            : { dk, t0: 0, s0: 0, idx: 0, done: [] };
        if (fcSp.idx > steps.length) fcSp.idx = steps.length;
      }
      const spDiff = (a, g) => {
        const d = a - g;
        return d === 0
          ? { t: "0:00", c: "ze" }
          : d > 0
            ? { t: "+" + mmss(d), c: "pl" }
            : { t: "−" + mmss(-d), c: "mi" };
      };
      const spCur = () =>
        fcSp && fcSp.t0
          ? Math.max(0, Math.round((Date.now() - fcSp.s0) / 1000))
          : 0;
      function spTick() {
        if (
          focusI == null ||
          !fcSp ||
          !fcSp.t0 ||
          !document.getElementById("sp")
        )
          return;
        const steps = s7Steps(dayPlan(focusI));
        if (!steps || fcSp.idx >= steps.length) return;
        const set = (id, t) => {
          const e = document.getElementById(id);
          if (e && e.textContent !== t) e.textContent = t;
        };
        set(
          "sp-tot",
          mmss(Math.max(0, Math.round((Date.now() - fcSp.t0) / 1000))),
        );
        set("sp-cur", mmss(spCur()));
        const g = steps[fcSp.idx].goal;
        if (g && spCur() >= g && fcSpBeep !== fcSp.idx) {
          fcSpBeep = fcSp.idx;
          fcBeep(false);
        }
      }
      function spStartTick() {
        clearInterval(fcSpIv);
        fcSpIv = setInterval(spTick, 250);
      }
      function spStart() {
        const steps = s7Steps(dayPlan(focusI));
        if (!steps) return;
        fcSp.t0 = fcSp.s0 = Date.now();
        fcSp.idx = 0;
        fcSp.done = [];
        fcSpBeep = -1;
        spSave();
        fcBeep(false); // der erste Ton entsperrt auch den Ton auf dem Handy
        spStartTick();
        focusRender();
      }
      function spSplit() {
        const steps = s7Steps(dayPlan(focusI));
        if (!steps || !fcSp || !fcSp.t0 || fcSp.idx >= steps.length) return;
        if (spCur() < 2) return; // versehentlicher Doppeltipp
        fcSp.done[fcSp.idx] = Math.max(1, spCur());
        fcSp.idx++;
        fcSp.s0 = Date.now();
        fcSpBeep = -1;
        spSave();
        try {
          navigator.vibrate && navigator.vibrate(30);
        } catch (_) {}
        if (fcSp.idx >= steps.length) {
          clearInterval(fcSpIv);
          fcBeep(true);
        } else fcBeep(false);
        focusRender();
      }
      /* Kacheln (Desktop) bzw. Zeilen (Handy): gleiche Struktur, die Darstellung wechselt per CSS */
      function s7SpView(p, steps) {
        const run = !!fcSp.t0,
          fin = fcSp.idx >= steps.length;
        const tiles = steps
          .map((s, k) => {
            const d = k < fcSp.idx,
              now = run && !fin && k === fcSp.idx;
            const big = d
              ? mmss(fcSp.done[k])
              : now
                ? mmss(spCur())
                : s.goal
                  ? mmss(s.goal)
                  : "–";
            const df = d && s.goal ? spDiff(fcSp.done[k], s.goal) : null;
            const dd = d
              ? s.goal
                ? `Ziel ${mmss(s.goal)}${df ? ` · <b class="${df.c}">${df.t}</b>` : ""}`
                : ""
              : now
                ? `läuft${s.goal ? ` · Ziel ${mmss(s.goal)}` : ""}${s.sub ? ` · ${esc(s.sub)}` : ""} · beim Zieleinlauf tippen`
                : esc(s.sub);
            const tag = now ? "button" : "div";
            return `<${tag} ${now ? `type="button" data-fc="sp-split" id="sp-now" aria-label="Split speichern: ${esc(s.tp)} ${esc(s.name)}"` : ""} class="sp-t${d ? " done" : ""}${now ? " now" : ""}"><i class="bar" style="background:${SP_COL[s.kind]}"></i><span class="mid"><span class="tp"><i class="dt" style="background:${SP_COL[s.kind]}"></i>${k + 1} · ${esc(s.tp)}</span><span class="nm">${esc(s.name)}</span><span class="dd">${dd}</span></span><span class="big"${now ? ` id="sp-cur"` : ""}>${big}</span><span class="ck${d ? " on" : ""}" aria-hidden="true">${d ? S7_CHECK : ""}</span></${tag}>`;
          })
          .join("");
        const tot = run
          ? fin
            ? fcSp.done.reduce((a, b) => a + (b || 0), 0)
            : Math.round((Date.now() - fcSp.t0) / 1000)
          : 0;
        const btn = fin
          ? ""
          : run
            ? `<button type="button" class="f7-go" data-fc="sp-split"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l5 5 9-10"/></svg>Split</button>`
            : `<button type="button" class="f7-go" data-fc="sp-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Start</button>`;
        return `<div id="sp" class="sp"><header class="sp-h"><button type="button" class="f7-x" data-fc="close" aria-label="Fokusmodus schliessen">${F7_X}</button><div class="sp-tt"><span class="s6-kick">Stationen · Kachel tippen oder Lap-Taste = Split speichern</span><b>${esc(s7Title(p.t))}</b></div><span class="sp-tot" id="sp-tot">${mmss(tot)}</span>${btn}</header><p class="sp-hint">Tippe eine Kachel beim Zieleinlauf (oder drücke die Lap-Taste der Uhr): Der Split wird gespeichert und die nächste Kachel startet.</p><div class="sp-g">${tiles}</div>${run && !fin ? `<button type="button" class="s7-tx sp-rd" data-fc="sp-redo">Messung verwerfen und neu starten</button>` : ""}</div>`;
      }
      /* Splits prüfen: Ist-Zeiten lassen sich korrigieren */
      function s7SpCheck(p, steps) {
        const sum = (a) => a.reduce((x, y) => x + (y || 0), 0),
          gT = sum(steps.map((s) => s.goal)),
          aT = sum(steps.map((_, k) => fcSp.done[k])),
          df = spDiff(aT, gT);
        const rows = steps
          .map((s, k) => {
            const d = spDiff(fcSp.done[k] || 0, s.goal);
            return `<div class="tr"><div class="nm"><small>${esc(s.tp)}</small>${esc(s.name)}</div><div class="c ze">${s.goal ? mmss(s.goal) : "–"}</div><input class="ist" type="text" inputmode="text" pattern="[0-9:]*" value="${mmss(fcSp.done[k] || 0)}" data-sp="${k}" aria-label="Ist-Zeit ${esc(s.tp)} ${esc(s.name)}"><div class="c ${s.goal ? d.c : "ze"}" id="sp-d${k}">${s.goal ? d.t : "–"}</div></div>`;
          })
          .join("");
        return `<div id="sp" class="sp chk"><header class="sp-h"><button type="button" class="f7-x" data-fc="close" aria-label="Zurück zur Übersicht" title="Zurück">${F7_CHEV("M15 6l-6 6 6 6")}</button><div class="sp-tt"><span class="s6-kick">Nach der Einheit</span><b>Splits prüfen</b></div></header>
    <div class="sp-sum"><div><span class="s6-kick">Gesamt</span><b id="sp-sa">${mmss(aT)}</b></div><div class="r"><span class="s6-kick">Ziel ${mmss(gT)}</span><b class="${df.c}" id="sp-sd">${df.t}</b></div></div>
    <p class="sp-hint">Die Splits wurden beim Tippen gespeichert. Falsch? Tippe auf die Ist-Zeit und korrigiere sie.</p>
    <div class="sp-tab"><div class="th"><span class="s6-kick">Schritt</span><span class="s6-kick r">Ziel</span><span class="s6-kick c">Ist</span><span class="s6-kick r">Diff</span></div>${rows}</div>
    <div class="sp-act"><button type="button" class="s6-btn gold" data-fc="sp-save">Speichern</button><button type="button" class="s6-btn" data-fc="sp-watch">Splits aus der Uhr übernehmen</button><button type="button" class="s7-tx" data-fc="sp-redo">Messung verwerfen und neu starten</button></div></div>`;
      }
      function spEdit(k, txt) {
        const steps = s7Steps(dayPlan(focusI));
        const m = /^(\d{1,3}):(\d{2})$/.exec(String(txt).trim()),
          s = m
            ? +m[1] * 60 + +m[2]
            : /^\d+$/.test(String(txt).trim())
              ? +txt
              : NaN;
        if (!steps || isNaN(s)) return focusRender();
        fcSp.done[k] = s;
        spSave();
        const sum = (a) => a.reduce((x, y) => x + (y || 0), 0),
          gT = sum(steps.map((q) => q.goal)),
          aT = sum(steps.map((_, i) => fcSp.done[i])),
          df = spDiff(aT, gT),
          d = spDiff(s, steps[k].goal);
        const set = (id, t, c) => {
          const e = document.getElementById(id);
          if (e) {
            e.textContent = t;
            if (c)
              e.className =
                e.className.replace(/\b(pl|mi|ze)\b/g, "").trim() + " " + c;
          }
        };
        set("sp-sa", mmss(aT));
        set("sp-sd", df.t, df.c);
        set("sp-d" + k, steps[k].goal ? d.t : "–", d.c);
      }
      function spSaveAll() {
        const p = dayPlan(focusI),
          steps = s7Steps(p),
          dk = keyI(focusI);
        if (!steps) return;
        const byLine = {};
        steps.forEach((s, k) =>
          (byLine[s.j] = byLine[s.j] || []).push(fcSp.done[k]),
        );
        for (const [j, arr] of Object.entries(byLine)) {
          const id = dk + "|" + j;
          S.val[id] = arr.map((x) => mmss(x || 0)).join(" · ");
          S.done[id] = 1;
        }
        p.i.forEach((_, j) => {
          if (!byLine[j]) S.done[dk + "|" + j] = 1; // Regel- und Hinweiszeilen ohne eigene Zeit
        });
        save();
        const at = focusI;
        lsSet(SP_KEY, "null");
        fcSp = null;
        focusClose();
        fin7Open(at, true);
      }
      /* Neuer Fokus-Bildschirm für Stationstage und alle Übungen ohne eigenes Lauf-Dashboard. Gibt true zurück, wenn gezeichnet. */
      function s7FocusPaint(el, p, dk, n, nd, dran, dir) {
        const steps = s7Steps(p);
        if (steps) {
          if (!fcSp || fcSp.dk !== dk) spLoad(dk, steps);
          if (fcSp.t0 && fcSp.idx < steps.length) spStartTick();
          else clearInterval(fcSpIv);
          el.className = "f7on sp-on";
          el.innerHTML =
            fcSp.idx >= steps.length && fcSp.t0
              ? s7SpCheck(p, steps)
              : s7SpView(p, steps);
          const nw = el.querySelector("#sp-now");
          if (nw && nw.scrollIntoView) nw.scrollIntoView({ block: "center" });
          return true;
        }
        if (runPhases(p, focusJ).length) return false;
        el.className = "f7on";
        el.innerHTML = s7ExView(p, dk, n, nd, dran, dir);
        const cur = el.querySelector(".f7-list .on");
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
        return true;
      }

      /* ================= Einheit abschliessen (Sheet) ================= */
      let fin7 = null; // {i, mode: "plan"|"part"|"other", rpe, note, picks:Set, sub: null|"w", w:{j:kg|null}, focus}
      function fin7Open(i, fromFocus) {
        const p = dayPlan(i),
          dk = keyI(i);
        if (!p || p.k === "rest") return;
        const done = p.i.map((_, j) => !!S.done[dk + "|" + j]),
          part = done.some(Boolean) && !done.every(Boolean);
        fin7 = {
          i,
          mode: part ? "part" : "plan",
          rpe: S.rpe[dk] != null ? +S.rpe[dk] : null,
          note: S.notes[dk] || "",
          picks: new Set(
            done.map((d, j) => (d ? j : -1)).filter((j) => j >= 0),
          ),
          skips: new Set(p.i.map((_, j) => (S.xs[dk + "|" + j] ? j : -1)).filter((j) => j >= 0)),
          sub: null,
          w: null,
          focus: !!fromFocus,
        };
        fin7Paint();
      }
      function fin7Close() {
        fin7 = null;
        const el = document.getElementById("fin7");
        const prev = el && el._prev;
        if (el) el.remove();
        document.body.classList.remove("fin-on");
        try {
          if (prev && prev.isConnected && prev.focus) prev.focus();
        } catch (_) {}
      }
      const fin7Lifts = (p) =>
        p.i
          .map((t, j) => ({ t, j }))
          .filter(
            ({ t }) => !isFiller(t) && (isLift(p.k, t) || preWeight(p, t)),
          );
      /* Zeilen mit Zeit-/Split-Feld (Lauf, Stationen …): alles Nicht-Kraft, ohne Füllzeilen */
      const fin7Splits = (p) =>
        p.k === "kraft"
          ? []
          : p.i
              .map((t, j) => ({ t, j }))
              .filter(
                ({ t }) => !isFiller(t) && !isLift(p.k, t) && !preWeight(p, t) && !/^Erste \d+ m nach jeder Station/.test(t) && !/Verbot schneller|Redline ab/.test(t),
              );
      function fin7Paint() {
        if (!fin7) return;
        const p = dayPlan(fin7.i),
          dk = keyI(fin7.i),
          wave = weekInfo(Math.floor(fin7.i / 7)).wave,
          lim = review.RPE_MAX[wave];
        let el = document.getElementById("fin7");
        const first = !el;
        if (first) {
          el = document.createElement("div");
          el.id = "fin7";
          el._prev = document.activeElement;
          document.body.appendChild(el);
          document.body.classList.add("fin-on");
        }
        const oldSheet = el.querySelector(".f7-sheet"),
          keepTop = oldSheet ? oldSheet.scrollTop : 0,
          ae =
            document.activeElement && el.contains(document.activeElement)
              ? document.activeElement
              : null,
          keepSel =
            ae && ae.dataset && ae.dataset.fin
              ? ["fin", "j", "r", "m", "d"]
                  .filter((k) => ae.dataset[k] != null)
                  .map((k) => `[data-${k}="${ae.dataset[k]}"]`)
                  .join("")
              : "";
        let body;
        if (fin7.sub === "w") {
          const rows = fin7Lifts(p)
            .map(({ t, j }) => {
              const r = s7Row(t),
                le = lastEntry(fin7.i, t),
                v = fin7.w[j];
              const sb = [
                r.val,
                r.subs[0] && /je Seite/.test(r.subs[0]) ? "je Seite" : "",
                le && le.v ? `zuletzt ${le.v}` : "",
              ]
                .filter(Boolean)
                .join(" · ");
              return `<div class="r"><div class="nm">${esc(r.title)}<div class="sb">${esc(sb)}</div></div><button type="button" class="b" data-fin="wst" data-j="${j}" data-d="-1" aria-label="weniger">${F7_CHEV("M5 12h14")}</button><div class="v${v == null ? " e" : ""}">${v == null ? "–" : String(v).replace(".", ",")}<br><small>kg</small></div><button type="button" class="b" data-fin="wst" data-j="${j}" data-d="1" aria-label="mehr">${F7_CHEV("M12 5v14M5 12h14")}</button></div>`;
            })
            .join("");
          body = `<div><h2>Gewichte eintragen</h2><div class="sb2">Pro Übung das Arbeitsgewicht. Leer lassen, was Du nicht brauchst.</div></div><div class="f7-wl">${rows}</div><div class="acts"><button type="button" class="s6-btn gold" data-fin="wok">Übernehmen</button></div>`;
        } else if (fin7.sub === "s") {
          const rows = fin7Splits(p)
            .map(({ t, j }) => {
              const r = s7Row(t),
                slots = lineSlots(t),
                vals = fin7.s[j] || [];
              const fld = slots
                ? slots
                    .map(
                      (sl, k) =>
                        `<label class="f7-sl"><span>${esc(sl.label)}</span><input class="f7-notiz" type="text" inputmode="numeric" data-fin-sp="${j}" data-k="${k}" value="${esc(vals[k] || "")}" placeholder="${esc(sl.goal || "Zeit")}" enterkeyhint="next" aria-label="${esc(sl.label)}"></label>`,

      function toast(m, warn, undo) {
        const t = $("#toast");
        clearTimeout(toast.h);
        clearTimeout(toast.o);
        t.classList.remove("out");
        t.textContent = m;
        t.classList.toggle("warn", !!warn);
        t.classList.toggle("has-undo", !!undo);
        if (undo) {
          // Rückgängig: Knopf im Hinweis, bleibt etwas länger sichtbar
          const b = document.createElement("button");
          b.type = "button";
          b.className = "toast-undo";
          b.textContent = "Rückgängig";
          b.addEventListener("click", () => {
            clearTimeout(toast.h);
            clearTimeout(toast.o);
            t.hidden = true;
            undo();
          });
          t.append(" ", b);
        }
        t.hidden = false;
        toast.h = setTimeout(
          () => {
            if (calm()) {
              t.hidden = true;
              return;
            }
            t.classList.add("out");
            toast.o = setTimeout(() => {
              t.hidden = true;
              t.classList.remove("out");
            }, 240);
          },
          undo ? 6500 : warn ? 4200 : 2600,
        );
      }
      /* Check-in fertig: auf der Startseite schrumpft die Karte weg, im Dashboard blendet die Empfehlung ein */
      function leaveCheckin(t) {
        const card = t.closest(".card");
        if (view === "today" && card) shrink(card, render);
        else transition("fade", render);
      }
      /* Menü-Einträge gestaffelt einfliegen lassen (Reihenfolge als --i) */
      document
        .querySelectorAll("#sheet .drawer-h, #sheet .cap, #sheet .mi, #acct")
        .forEach((el, k) => el.style.setProperty("--i", k));
      const layout = () => (WIDE() ? 2 : MID() ? 1 : 0);
      let wasWide = layout();
      addEventListener("resize", () => {
        const w = layout();
        if (w !== wasWide) {
          wasWide = w;
          if (
            !document.activeElement ||
            !/INPUT|TEXTAREA/.test(document.activeElement.tagName)
          )
            render();
        }
      });

      /* Regal: Karten ziehen. Maus überall, Touch nur am Griff (sonst liesse sich die Seite nicht mehr scrollen). */
      const slotAt = (x, y) => {
        const el = document.elementFromPoint(x, y),
          s = el && el.closest(".fach[data-slot]");
        return s ? +s.dataset.slot : null;
      };
      function dragInfo(from, to) {
        if (to == null || to === from) return "";
        if (!shelfOk(from, to)) return "Hier geht kein Tausch.";
        const q = dayPlan(to),
          clash = hardClash(from, to),
          bits = [`${shortDay(from)} ↔ ${shortDay(to)}`];
        if (q.k === "rest" && isFixedRest(q, to))
          bits.push("fixer Ruhetag wird belegt");
        if (clash.length)
          bits.push("hart auf hart: " + clash.map(shortDay).join(", "));
        return bits.join(" · ");
      }
      function dragUpdate() {
        if (!drag || !drag.on) return;
        drag.ghost.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px)`;
        const to = slotAt(drag.x, drag.y);
        if (to === drag.to) return;
        drag.to = to;
        document
          .querySelectorAll(".fach.over,.fach.nope")
          .forEach((el) => el.classList.remove("over", "nope"));
        if (to != null && to !== drag.from) {
          const el = document.querySelector(`.fach[data-slot="${to}"]`);
          if (el) el.classList.add(shelfOk(drag.from, to) ? "over" : "nope");
        }
        const info = $("#drag-info");
        if (info) info.textContent = dragInfo(drag.from, to);
      }
      function dragStop(commit) {
        if (!drag) return;
        const { on, from, to, ghost, raf } = drag;
        cancelAnimationFrame(raf);
        if (ghost) ghost.remove();
        document.body.classList.remove("dragging");
        document
          .querySelectorAll(".fach.over,.fach.nope,.sl-card.lifted")
          .forEach((el) => el.classList.remove("over", "nope", "lifted"));
        const info = $("#drag-info");
        if (info) info.textContent = "";
        drag = null;
        if (!on) return;
        dragEnd = Date.now();
        if (commit && to != null && shelfOk(from, to)) return doSwap(from, to);
        if (renderHeld) {
          renderHeld = false;
          render();
        }
      }
      document.addEventListener("pointerdown", (e) => {
        let card = e.target.closest && e.target.closest(".sl-card[data-drag]");
        if (!card) return;
        if (drag) {
          dragStop(false); // übrig gebliebene Geste (verlorenes pointerup) zuerst beenden; das kann neu aufbauen
          card = document.getElementById("fc-" + card.dataset.drag) || card;
        }
        if (
          e.pointerType === "mouse"
            ? e.button !== 0
            : !e.target.closest(".grip")
        )
          return;
        drag = {
          from: +card.dataset.drag,
          id: e.pointerId,
          x0: e.clientX,
          y0: e.clientY,
          x: e.clientX,
          y: e.clientY,
          on: false,
          to: null,
          card,
          ghost: null,
          raf: 0,
          dx: 0,
          dy: 0,
        };
      });
      document.addEventListener(
        "pointermove",
        (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          drag.x = e.clientX;
          drag.y = e.clientY;
          if (!drag.on) {
            if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 6) return;
            const r = drag.card.getBoundingClientRect(),
              g = drag.card.cloneNode(true);
            g.classList.add("ghost");
            g.removeAttribute("data-drag");
            g.removeAttribute("data-shelf");
            g.setAttribute("aria-hidden", "true");
            g.style.setProperty(
              "--kc",
              getComputedStyle(drag.card).getPropertyValue("--kc"),
            );
            g.style.width = r.width + "px";
            g.style.height = r.height + "px";
            drag.dx = drag.x0 - r.left;
            drag.dy = drag.y0 - r.top;
            document.body.appendChild(g);
            drag.ghost = g;
            drag.on = true;
            drag.card.classList.add("lifted");
            document.body.classList.add("dragging");
            const loop = () => {
              if (!drag || !drag.on) return;
              if (drag.y < 70) scrollBy(0, -14);
              else if (drag.y > innerHeight - 70) scrollBy(0, 14);
              dragUpdate();
              drag.raf = requestAnimationFrame(loop);
            };
            drag.raf = requestAnimationFrame(loop);
          }
          e.preventDefault();
          dragUpdate();
        },
        { passive: false },
      );
      document.addEventListener("pointerup", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        if (drag.on) drag.to = slotAt(e.clientX, e.clientY);
        dragStop(true);
      });
      document.addEventListener("pointercancel", () => dragStop(false));
      addEventListener("blur", () => dragStop(false));
      document.addEventListener(
        "visibilitychange",
        () => document.hidden && dragStop(false),
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") dragStop(false);
      });

      const CLICK =
        "[data-v],[data-goday],[data-last],[data-wk],[data-open],[data-sel],[data-r],[data-act],[data-back],[data-move],[data-shelf],[data-injs],[data-injd],[data-injm],[data-edit],[data-ci],[data-sug],[data-sug-no],[data-who],[data-imp-all],[data-pb],[data-pd],[data-pgo]";
      document.addEventListener("click", async (e) => {
        const t = e.target.closest(CLICK);
        if (!t) return;
        const d = t.dataset;
        // Passwort ein-/ausblenden direkt im DOM, damit die Eingabe erhalten bleibt
        if (d.act === "auth-mode") {
          const el = $("#le");
          if (el) loginEmail = el.value.trim();
          authMode = d.mode;
          loginMsg = loginOk = "";
          render();
          const f = $("#le");
          if (f) f.focus();
          return;
        }
        if (d.act === "pw-eye") {
          const w = t.parentElement,
            i = w.querySelector("input"),
            show = i.type === "password";
          i.type = show ? "text" : "password";
          w.classList.toggle("show", show);
          t.setAttribute("aria-pressed", show);
          t.setAttribute(
            "aria-label",
            show ? "Passwort verbergen" : "Passwort anzeigen",
          );
          i.focus();
          const n = i.value.length;
          try {
            i.setSelectionRange(n, n);
          } catch (_) {}
          return;
        }
        if (d.v) {
          if (d.v === "coach" && t.closest("#sheet")) coachTab = "chat";
          return go(d.v);
        }
        if (d.back !== undefined)
          return go(view === "edit" && editBack ? editBack : prevView, "back");
        if (d.move !== undefined) {
          moveFrom = +d.move;
          shelfWk = null;
          return go("move");
        }
        if (d.shelf !== undefined) {
          if (Date.now() - dragEnd < 350) return; // Klick direkt nach dem Ziehen ignorieren
          moveFrom = +d.shelf;
          return render();
        }
        if (d.edit !== undefined) {
          editFrom = +d.edit;
          editBack = view === "coach" ? "coach" : null;
          return go("edit");
        }
        if (d.act === "shelf-wk") {
          shelfWk = Math.max(0, Math.min(NWEEKS - 2, shelfWk + +d.d));
          return render();
        }
        if (d.act === "shelf-today") {
          moveFrom = Math.max(0, Math.min(LAST, TODAY));
          shelfWk = shelfStart(Math.floor(moveFrom / 7), NWEEKS);
          return render();
        }
        if (d.act === "shelf-step") {
          const i = moveFrom,
            j = i + +d.d;
          if (shelfOk(i, j)) doSwap(i, j);
          return;
        }
        if (d.act === "ol-easy") {
          setE(+d.i, { easy: 1 });
          save();
          toast("Einheit entlastet: ca. 75 % Volumen, RPE max. 6");
          return render();
        }
        if (d.act === "swapfix") {
          setE(+d.i, { easy: 1 });
          if (swapUndo) swapUndo.eased.push(+d.i);
          save();
          toast("Einheit entlastet: ca. 75 % Volumen, RPE max. 6");
          return render();
        }
        if (d.act === "swapfix-no") {
          swapPair = null;
          return render();
        }
        if (
          d.act === "swap-undo" &&
          swapUndo &&
          (srcOf(swapUndo.i) !== swapUndo.sig[0] ||
            srcOf(swapUndo.j) !== swapUndo.sig[1])
        ) {
          swapUndo = swapPair = null; // der Plan hat sich seit dem Tausch geändert
          toast(
            "Der Plan wurde seither geändert, Rückgängig geht nicht mehr",
            true,
          );
          return render();
        }
        if (d.act === "swap-undo" && swapUndo) {
          const { i, j, skip, eased } = swapUndo;
          eased.forEach((x) => setE(x, { easy: null })); // Entlastung aus der Karte zuerst weg, damit sie nicht an der Einheit hängen bleibt
          swapDays(i, j);
          [i, j].forEach((x, n) => {
            if (skip[n]) S.skip[keyI(x)] = 1;
            else delete S.skip[keyI(x)];
          });
          swapUndo = swapPair = null;
          moveFrom = i;
          save();
          toast("Tausch rückgängig");
          return render();
        }
        if (d.act === "strava-no") {
          S.dismiss["stv:" + d.i] = 1;
          save();
          return render();
        }
        if (d.act === "sim-save") {
          const st = [...document.querySelectorAll("[data-sim]")]
              .sort((a, b) => a.dataset.sim - b.dataset.sim)
              .map((x) => x.value.trim()),
            day = ($("#sim-d") || {}).value,
            pct = +($("#sim-i") || {}).value;
          if (
            !day ||
            !pct ||
            st.length !== 8 ||
            !st.every((x) => parseT(x) > 0)
          )
            return toast(
              "Bitte alle acht Stationszeiten als m:ss eintragen",
              true,
            );
          S.simres = S.simres || {};
          S.simres[day] = { i: pct / 100, st: st.map((x) => mmss(parseT(x))) };
          save();
          toast("Simulation gespeichert – die Prognose ist angepasst");
          return render();
        }
        if (d.act === "sim-del") {
          if (S.simres) delete S.simres[d.k];
          save();
          return render();
        }
        if (d.act === "off") {
          const k = keyI(+d.i);
          if (S.off[k]) delete S.off[k];
          else S.off[k] = 1;
          save();
          toast(S.off[k] ? "Einheit gestrichen" : "Einheit wieder im Plan");
          return render();
        }
        if (d.act === "later") {
          const i = +d.i,
            p = dayPlan(i),
            dk = keyI(i),
            open = openItems(p, { ...S.done, ...S.xs }, dk);
          if (!canCarry({ i, today: TODAY, last: LAST, day: p, open })) return;
          S.later[dk] = makeCarry(keyI(i + 1), open);
          save();
          toast(
            `${open.length} ${open.length === 1 ? "Übung hängt" : "Übungen hängen"} an ${DAYSF[dow(i + 1)]}`,
          );
          return render();
        }
        if (d.act === "x-ex") {
          if (S.xs[d.k]) delete S.xs[d.k];
          else {
            S.xs[d.k] = 1;
            delete S.done[d.k];
          }
          save();
          toast(S.xs[d.k] ? "Übung ausgelassen" : "Übung wieder offen");
          return render();
        }
        if (d.act === "later-undo") {
          delete S.later[d.k];
          save();
          toast("Wieder am ursprünglichen Tag");
          return render();
        }
        if (d.act === "solo") {
          const dk = keyI(+d.i);
          if (S.solo[dk]) delete S.solo[dk];
          else S.solo[dk] = 1;
          save();
          toast(
            S.solo[dk]
              ? "Solo: Einheit für allein angepasst"
              : `Wieder mit ${PARTNER}`,
          );
          return render();
        }
        if (d.act === "x-open" || d.act === "x-sug") {
          xOpen = +d.i;
          xPre = d.act === "x-sug" ? { type: d.xt, min: d.min } : null;
          render();
          grow($(".xform"));
          const m = $("#x-min");
          if (m) m.focus({ preventScroll: true });
          return;
        }
        if (d.act === "x-cancel") {
          return shrink($(".xform"), () => {
            xOpen = null;
            xPre = null;
            render();
          });
        }
        if (d.act === "x-type") {
          t.parentNode.querySelectorAll("button").forEach((b) => {
            b.classList.toggle("on", b === t);
            b.setAttribute("aria-pressed", b === t);
          });
          return;
        }
        if (d.act === "x-add") {
          const i = +d.i,
            f = t.closest(".xform"),
            on = f.querySelector("[data-xt].on");
          const e = makeExtra({
            type: on && on.dataset.xt,
            min: f.querySelector("#x-min").value,
            rpe: f.querySelector("#x-rpe").value,
            note: f.querySelector("#x-note").value,
          });
          if (!e)
            return toast(
              "Dauer in Minuten (1–600), RPE 1–10 – oder leer lassen",
            );
          const dk = keyI(i);
          S.extra[dk] = addExtra(cleanExtras(S.extra[dk]), e);
          xOpen = null;
          xPre = null;
          save();
          toast("Gespeichert: " + extraLabel(e));
          return render();
        }
        if (d.act === "x-del") {
          const dk = keyI(+d.i),
            l = removeExtra(S.extra[dk], d.x);
          if (l.length) S.extra[dk] = l;
          else delete S.extra[dk];
          if (String(d.x).startsWith("a:")) S.dismiss["xa:" + d.x.slice(2)] = 1; // automatisch erkannte nicht wieder anlegen
          save();
          return render();
        }
        if (d.act === "sore-open") {
          coachTab = "sore";
          soreInitOpen();
          return go("coach");
        }
        if (d.act === "ci-ok") {
          const c = (S.checkin[d.k] = S.checkin[d.k] || {});
          // Gemeldeter Muskelkater bleibt massgebend, der Rest wird grün
          const sl = sore.checkinLevel(soreAt(soreToday()));
          for (const [f] of CHECKIN_FIELDS)
            c[f] = f === "sore" && sl ? sl : "g";
          ciOpen = false;
          save();
          toast(
            sl && sl !== "g"
              ? "Check-in gespeichert – Muskelkater aus deinen Meldungen"
              : "Check-in: keine Beschwerden",
          );
          return leaveCheckin(t);
        }
        if (d.act === "all-done") return fin7Open(+d.i);
        if (d.act === "rpe-set") {
          if (+S.rpe[d.k] === +d.r) delete S.rpe[d.k];
          else S.rpe[d.k] = +d.r;
          save();
          return render();
        }
        if (d.act === "fold") {
          if (fold.has(d.f)) fold.delete(d.f);
          else fold.add(d.f);
          return render();
        }
        if (d.act === "rpe-clear") {
          delete S.rpe[d.k];
          save();
          return render();
        }
        if (d.act === "dash-chip") {
          if (d.g === "lift") dashLift = d.k;
          else if (d.g === "well") dashWell = d.k;
          render();
          animateChart(document.querySelector("#dc-" + d.g));
          return pop(`#dc-${d.g} .lchips .on`);
        }
        if (d.act === "done-open") {
          const i = +d.i,
            bar = t.closest(".done-bar"),
            h0 = bar ? bar.getBoundingClientRect().height : 60;
          doneOpen.add(i);
          render();
          return grow(
            document.querySelector(`.card.hero[data-day="${i}"]`),
            h0,
          );
        }
        if (d.act === "done-close") {
          return closeCard(+d.i);
        }
        if (d.last) {
          const el = document.querySelector(`[data-v2="${d.last}"]`);
          S.val[d.last] = d.lv;
          save();
          if (el) {
            el.value = d.lv;
            el.classList.remove("pre");
            el.focus();
          }
          return toast(`Übernommen: ${d.lv}`);
        }
        if (d.act === "sore-clear") {
          delete S.sore[soreToday()];
          soreSave();
          toast("Muskelkater zurückgesetzt");
          return render();
        }
        if (d.ci) {
          const [k, f, v] = d.ci.split("|");
          const c = (S.checkin[k] = S.checkin[k] || {});
          if (c[f] === v) delete c[f];
          else c[f] = v;
          ciOpen = true;
          save();
          render();
          return pop(`[data-ci="${d.ci}"]`);
        }
        if (d.act === "dash-ser") {
          dashSer = d.k;
          return render();
        }
        if (d.act === "ci-edit") {
          return transition("fade", () => {
            ciOpen = true;
            render();
          });
        }
        if (d.act === "ci-done") {
          ciOpen = false;
          return leaveCheckin(t);
        }
        if (d.sug) {
          const s = SUGS.find((x) => x.id === d.sug);
          if (!s) return;
          applySug(s);
          save();
          toast(
            s.type === "swap"
              ? `${dayPlan(s.to).t} → ${shortDay(s.to)}`
              : "Plan angepasst",
          );
          return transition("fade", render);
        }
        if (d.sugNo) {
          S.dismiss[d.sugNo] = 1;
          save();
          return transition("fade", render);
        }
        if (d.act === "ed-add") {
          const r = document.createElement("div");
          r.className = "ed-r";
          r.innerHTML = `<span class="n"></span><input type="text" class="ed-li" value="" aria-label="Übung" placeholder="z. B. Back Squat 4×5, Pause 150 s"><button type="button" class="ed-x" data-act="ed-del" aria-label="Übung löschen">×</button>`;
          $("#ed-list").appendChild(r);
          r.querySelector("input").focus();
          return;
        }
        if (d.act === "ed-del") {
          const r = t.closest(".ed-r");
          if (r) r.remove();
          edSync();
          return;
        }
        if (d.act === "edit-save") {
          edSync();
          const lines = $("#ed-i")
            .value.split("\n")
            .map((s) => s.trim())
            .filter(Boolean);
          if (!lines.length) return toast("Mindestens eine Übung eintragen");
          const src = srcOf(editFrom),
            k = S.edit[src] && S.edit[src].k; // vom Coach gesetzte Disziplin behalten
          S.edit[src] = {
            t: $("#ed-t").value.trim(),
            i: lines,
            n: $("#ed-n").value.trim(),
            ...(k ? { k } : {}),
          };
          save();
          toast("Einheit angepasst");
          return go(editBack || prevView, "back");
        }
        if (d.act === "edit-save-all" || d.act === "edit-reset-all") {
          if (!sb || !USER)
            return toast("Dafür ist der Cloud-Login nötig", true);
          const src = srcOf(editFrom);
          let err;
          if (d.act === "edit-reset-all") {
            if (!confirm("Gemeinsame Änderung für ALLE zurücksetzen?")) return;
            ({ error: err } = await sb.rpc("reset_shared_edit", {
              p_day: src,
            }));
          } else {
            edSync();
            const lines = $("#ed-i")
              .value.split("\n")
              .map((x) => x.trim())
              .filter(Boolean);
            if (!lines.length) return toast("Mindestens eine Übung eintragen");
            if (!$("#ed-t").value.trim()) return toast("Titel fehlt");
            if (
              !confirm(
                "Diese Änderung gilt für ALLE Nutzer der Gruppe. Speichern?",
              )
            )
              return;
            // Pläne sind aus Jaimes Sicht geschrieben: der Name des Partners wird dafür zurückgetauscht
            const canon = (x) =>
              ME === "Jaime" ? x : String(x).split(PARTNER).join("Jimoh");
            ({ error: err } = await sb.rpc("set_shared_edit", {
              p_day: src,
              p_data: {
                t: canon($("#ed-t").value.trim()),
                k: ownPlan(src).k,
                i: lines.map(canon),
                n: canon($("#ed-n").value.trim()),
              },
            }));
            if (!err) delete S.edit[src]; // sonst würde die eigene Änderung die gemeinsame überdecken
          }
          if (err)
            return toast(
              "Speichern fehlgeschlagen. Bitte Verbindung prüfen.",
              true,
            );
          await loadTeamEdits();
          save();
          toast(
            d.act === "edit-reset-all"
              ? "Für alle zurückgesetzt"
              : "Für alle gespeichert",
          );
          return go(editBack || prevView, "back");
        }
        if (d.act === "edit-reset") {
          delete S.edit[srcOf(editFrom)];
          save();
          toast("Original wiederhergestellt");
          return go(editBack || prevView, "back");
        }
        if (d.who) {
          const el = $("#le");
          if (el) loginEmail = el.value.trim();
          loginWho = d.who;
          return render();
        }
        if (d.act === "logout") {
          menu(false);
          if (!sb) {
            lsDel("hx:mock");
            setNames("Jaime");
            toast("Abgemeldet");
            return render();
          }
          if (
            !confirm(

        },
        true,
      );
      /* Zeitfelder: "352" → "3:52" (Handy-Ziffernblock hat keinen Doppelpunkt); danach über den Input-Handler speichern */
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (
          !t.matches ||
          !t.matches(
            "input[data-vs],input[data-sim],input[data-l],input[data-s]",
          )
        )
          return;
        const n = normTime(t.value);
        if (n !== t.value.trim()) {
          t.value = n;
          t.dispatchEvent(new Event("input", { bubbles: true }));
        }
      });
      document.addEventListener("change", async (e) => {
        const t = e.target;
        if (t.dataset.sz) {
          soreSave();
          return render();
        }
        if (t.dataset.file) {
          const f = t.files && t.files[0];
          t.value = "";
          if (!f) return;
          if (t.dataset.file === "plan") return importFile(f);
          if (t.dataset.file === "garmin") return garminConnect(f);
          if (t.dataset.file === "backup") {
            try {
              bkp = { name: f.name, ...readBackup(await f.text()) };
            } catch (err) {
              toast(err.message);
            }
            return render();
          }
          try {
            const n = mergeActs(strava.parseActivities(await f.text()));
            save();
            toast(
              n
                ? `${n} neue Aktivitäten importiert`
                : "Keine neuen Aktivitäten seit Planstart",
            );
          } catch (err) {
            toast(
              err.code === "csv_format"
                ? "Das ist keine Strava-activities.csv"
                : "Datei konnte nicht gelesen werden",
            );
          }
          return render();
        }
        if (t.dataset.c) {
          if (t.checked) {
            S.done[t.dataset.c] = 1;
            delete S.xs[t.dataset.c];
            const sx = t.closest(".ex");
            if (sx) sx.classList.remove("is-skipped");
          } else delete S.done[t.dataset.c];
          ciOpen = false;
          // Geplantes Gewicht beim Abhaken als Wert übernehmen (aus dem Plan, nicht aus dem DOM)
          if (t.checked && !S.val[t.dataset.c]) {
            const pw = preWeightOf(t.dataset.c);
            if (pw) {
              S.val[t.dataset.c] = pw;
              const pv = document.querySelector(
                `[data-v2="${t.dataset.c}"].pre`,
              );
              if (pv) pv.classList.remove("pre");
            }
          }
          save();
          if (t.closest(".carry")) return render();
          const ex = t.closest(".ex");
          if (ex) ex.classList.toggle("is-done", t.checked);
          // Fortschritt ohne Neuaufbau aktualisieren (Fokus in Eingabefeldern bleibt)
          const card = t.closest(".card");
          if (card) {
            const all = card.querySelectorAll("[data-c]"),
              n = all.length,
              dn = [...all].filter((x) => x.checked).length;
            const bar = card.querySelector(".prog i");
            if (bar) bar.style.width = (dn / n) * 100 + "%";
            const s = card.querySelector(".prog+.sub");
            if (s) s.textContent = dn + " von " + n + " erledigt";
            if (t.checked && card.dataset.day)
              workoutFeedback(+card.dataset.day, t.dataset.c, dn === n);
            if (
              t.checked &&
              dn === n &&
              card.dataset.day &&
              card.classList.contains("hero") &&
              dayPlan(+card.dataset.day).k !== "rest"
            )
              closeCard(+card.dataset.day);
          }
        }
      });
      /* Wert im Eingabefeld beim Antippen markieren, damit er direkt überschrieben werden kann */
      document.addEventListener("focusin", (e) => {
        const t = e.target;
        if (t.matches && t.matches("input[data-v2]") && t.value)
          setTimeout(() => t.select(), 0);
      });
      document.addEventListener("input", (e) => {
        const t = e.target,
          d = t.dataset;
        let redo = false;
        if (d.sz) {
          const v = +t.value,
            t0 = soreToday();
          S.sore[t0] = soreOwn(t0);
          S.sore[t0][d.sz] = v;
          // Anzeige ohne Neuaufbau aktualisieren, damit der Regler beim Ziehen nicht springt
          const it = t.closest(".sore-it");
          if (it) it.style.setProperty("--sc", soreFill(v));
          const l = $("#szv-" + d.sz);
          if (l) l.innerHTML = soreVal(v);
          t.setAttribute("aria-valuetext", `${v} von 10, ${sore.strength(v)}`);
          return;
        }
        if (t.id === "cc-in") {
          ccDraft = t.value;
          return;
        }
        if (d.n !== undefined) {
          S.notes[d.n] = t.value;
        } else if (d.vs) {
          const fields = [
            ...document.querySelectorAll(`input[data-vs="${d.vs}"]`),
          ];
          S.val[d.vs] = fields
            .map((x) => x.value.trim())
            .join(" / ")
            .replace(/(?: \/ )+$/, "");
        } else if (d.v2) {
          S.val[d.v2] = t.value;
          t.classList.remove("pre");
          const di = idxOfIso(d.v2.split("|")[0]);
          if (testsFromDay(di, false) && !testToast[di]) {
            testToast[di] = 1;
            toast("Wird automatisch in Tests & Benchmarks übernommen");
          }
        } else if (
          t.readOnly ||
          ((d.w || d.l || d.s || d.t) &&
            (view !== "profile" || profWho !== "me"))
        )
          return;
        else if (d.w) {
          const v = cleanWeight(t.value);
          if (v) S.weights[d.w] = v;
          else delete S.weights[d.w];
        } else if (d.l) {
          const [w, r] = d.l.split("|");
          if (w !== myCol()) return;
          S.tests.lauf[w][+r] = t.value;
          S.tests.at = isoD(NOW);
          redo = true;
        } else if (d.s) {
          const [r, w] = d.s.split("|");
          if (w !== myCol()) return;
          S.tests.station[r] = S.tests.station[r] || {};
          S.tests.station[r][w] = t.value;
          S.tests.at = isoD(NOW);
          redo = true;
        } else if (d.t) {
          S.tests.trans[+d.t] = t.value;
          redo = true;
        } else return;
        save();
        if (redo) {
          const id = d.l || d.s || d.t,
            attr = d.l ? "data-l" : d.s ? "data-s" : "data-t",
            p = t.selectionStart;
          const y = window.scrollY;
          render();
          window.scrollTo(0, y);
          const el = document.querySelector(`[${attr}="${id}"]`);
          if (el) {
            el.focus();
            try {
              el.setSelectionRange(p, p);
            } catch (_) {}
          }
        }
      });

      // Falls der Start scheitert, nicht ewig auf dem Splash hängen bleiben
      boot().catch((e) => {
        console.error(e);
        render();
      });
      // Tipp auf den Wochenbericht, während die App schon offen ist
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data && e.data.open === "review" && authed()) {
            rvW = null;
            go("review");
          }
        });
      if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
        navigator.serviceWorker
          .register("sw.js")
          .then((reg) => {
            // Neue App-Version suchen: beim Start und bei jeder Rückkehr in die App
            const upd = () => reg.update().catch(() => {});
            upd();
            document.addEventListener(
              "visibilitychange",
              () => document.visibilityState === "visible" && upd(),
            );
            window.addEventListener("pageshow", upd);
          })
          .catch(() => {});
      if (
        "serviceWorker" in navigator &&
        location.protocol.startsWith("http")
      ) {
        // Übernimmt eine neue Version die Seite, lädt die App beim nächsten ruhigen Moment neu (nicht beim Tippen)
        const hadSw = !!navigator.serviceWorker.controller;
        let swNew = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (hadSw) swNew = true;
        });
        document.addEventListener("visibilitychange", () => {
          const busy =
            document.activeElement &&
            /INPUT|TEXTAREA/.test(document.activeElement.tagName);
          if (
            document.visibilityState === "visible" &&
            swNew &&
            !busy &&
            !dirty
          )
            location.reload();
        });
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data && e.data.resub) pushRepair();
        });
      }
    </script>
  </body>
</html>
