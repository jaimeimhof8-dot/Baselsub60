          cur.n > 1
            ? dash.lineChart(pts, {
                fmt: (v) => Math.round(v) + " kg",
                label: "Gewichtsverlauf " + cur.label,
                height: 130,
              })
            : `<p class="sub mt-2">Erst ein Eintrag. Ab dem zweiten entsteht hier die Kurve.</p>`;
        return `<div class="card" id="dc-lift">${dchips(
          "lift",
          L.map((e) => [e.key, e.label]),
          cur.key,
        )}<div class="lstats l3">
      <div><span>Aktuell</span><b>${kg(cur.last)}</b></div>
      <div><span>Bestwert</span><b>${kg(cur.best)}</b></div>
      <div><span>Seit Start</span><b class="${diff > 0 ? "up" : diff < 0 ? "down" : ""}">${diff > 0 ? "+" : ""}${kg(diff)}</b></div>
    </div>${chart}</div>`;
      }

      /* Dashboard nach dem Vorbild von Whoop: drei Ringe (Erholung, Belastung, Woche), darunter eine klare Aussage für heute.
   Danach nur, was eine Entscheidung erleichtert: diese Woche, Trends, Kraft, letzte Aktivitäten. */
      const LVL = { gut: "green", mittel: "yellow", schlecht: "red" };
      const LVL_COL = {
        green: "var(--ok)",
        yellow: "var(--warn)",
        red: "var(--danger)",
      };
      const LVL_TXT = { green: "Gut", yellow: "Mittel", red: "Tief" };
      /* Schlechterer Wert aus Check-in-Ampel und Garmin-Erholung */
      const worst = (a, b) =>
        ["red", "yellow", "green"].find((l) => l === a || l === b) || null;
      function todayVerdict(lvl, p) {
        if (!p) return "";
        if (p.k === "rest")
          return lvl === "red"
            ? "Ruhetag – genau richtig heute. Gut schlafen, viel trinken."
            : "Ruhetag. Erholung ist heute dein Training.";
        if (!lvl)
          return `Heute: ${esc(p.t)}. Mach den Check-in, dann sagt dir die App, wie hart du gehen kannst.`;
        return {
          green: `Bereit. ${esc(p.t)} wie geplant.`,
          yellow: `Etwas angeschlagen. ${esc(p.t)} machen, aber harte Teile eher etwas lockerer.`,
          red: `Heute Erholung vor Leistung. ${esc(p.t)} nur locker oder verschieben.`,
        }[lvl];
      }
      function vDashboard() {
        const T = Math.max(-1, Math.min(TODAY, LAST)),
          inPlan = TODAY >= 0 && TODAY <= LAST,
          curW = Math.max(0, Math.floor(Math.max(T, 0) / 7));
        const acts = Object.values(S.strava.acts);
        const w = S.garmin.well[isoD(NOW)] || {},
          rec = garmin.recoveryHint(S.garmin.well[isoD(NOW)]);
        const ci = inPlan ? readiness(S.checkin[keyI(TODAY)] || {}) : null;
        // Zahl, die beim Einblenden hochzählt; Endwert steht schon im HTML (ohne JS korrekt)
        const cnt = (v, dec = 0, suf = "") =>
          `<span class="cnt" data-to="${v}" data-dec="${dec}" data-suf="${esc(suf)}">${dec ? (+v).toFixed(dec).replace(".", ",") : Math.round(v)}${esc(suf)}</span>`;
        let h = `<div class="wide">${vhead("Dashboard", `${DAYSF[(NOW.getDay() + 6) % 7]}, ${fmt(NOW)}`, false)}`;

        // Ring 1 – Erholung: Garmin-Readiness (0–100); ohne Garmin die Check-in-Ampel
        const recLvl = LVL[rec.level] || null,
          lvl = worst(recLvl, ci);
        const r1 =
          w.readiness != null
            ? dash.ringGauge(w.readiness, {
                label: "Erholung",
                value: cnt(w.readiness),
                color: LVL_COL[recLvl] || "var(--muted)",
              })
            : dash.ringGauge(ci ? 100 : 0, {
                label: "Erholung",
                value: ci ? `<small>${LVL_TXT[ci]}</small>` : "–",
                color: LVL_COL[ci] || "var(--muted)",
              });
        // Ring 2 – Belastung: Anstrengung heute (RPE 1–10)
        const rpe = inPlan ? S.rpe[keyI(TODAY)] : null;
        const r2 = dash.ringGauge(rpe != null ? rpe * 10 : 0, {
          label: "Belastung",
          value: rpe != null ? cnt(rpe) : "–",
          sub: rpe != null ? "RPE heute" : "heute",
          color: "var(--lauf)",
        });
        // Ring 3 – Woche: erledigte Einheiten dieser Woche
        let wPlan = 0,
          wDone = 0;
        for (let x = curW * 7; x < curW * 7 + 7 && x <= LAST; x++)
          if (isSession(x)) {
            wPlan++;
            if (x <= T && trained(x)) wDone++;
          }
        const r3 = dash.ringGauge(wPlan ? (wDone / wPlan) * 100 : 0, {
          label: "Woche",
          value: `${cnt(wDone)}<small>/${wPlan}</small>`,
          color: "var(--accent)",
        });
        h += `<div class="card dash-rings">${r1}${r2}${r3}</div>`;

        // Heute: Check-in (solange offen) bzw. eine klare Empfehlung + die wichtigsten Garmin-Werte
        if (inPlan) {
          const p = dayPlan(TODAY);
          const m = [
            ["Schlaf", w.sleepH != null ? fmtWell(w, "sleepH") + " h" : null],
            ["HRV", w.hrv != null ? w.hrv + " ms" : null],
            ["Ruhepuls", w.rhr != null ? w.rhr : null],
            ["Body Battery", w.bb != null ? w.bb : null],
          ].filter((x) => x[1] != null);
          const mHtml = m.length
            ? `<div class="lstats mt-3" style="grid-template-columns:repeat(${m.length},1fr)">${m.map(([l, v]) => `<div><span>${l}</span><b>${esc(String(v))}</b></div>`).join("")}</div>`
            : "";
          // Check-in offen: hier nur eine Zeile (das Formular steht auf der Startseite); „Ausfüllen“ klappt es hier auf
          if (ciOpen) h += checkinCard(TODAY);
          else if (ciPending(TODAY))
            h += `<div class="card dash-today"><div class="row between"><h3>Heute</h3><button class="btn primary sm" data-act="ci-edit">Check-in ausfüllen</button></div>
      <p class="sub mt-2">${todayVerdict(recLvl, p)}</p>${mHtml}</div>`;
          else
            h += `<div class="card dash-today"><div class="row between"><h3>Heute</h3>${lvl ? `<span class="amp amp-${lvl}">${LVL_TXT[lvl]}</span>` : ""}</div>
      <p class="mt-2">${todayVerdict(lvl, p)}</p>${rec.why.length ? `<p class="sub mt-1">Garmin: ${esc(rec.why.join(", "))}</p>` : ""}${mHtml}
      <button class="btn ghost sm mt-3" data-act="ci-edit">Check-in ändern</button></div>`;
        }

        // Diese Woche: Anstrengung pro Tag + drei Zahlen
        const wk = dash.weekly(acts, idxOfIso, curW),
          cw = wk[curW] || { min: 0, runKm: 0, n: 0 };
        const wd = [];
        for (let x = curW * 7; x < curW * 7 + 7; x++) wd.push(x);
        const rpes = wd
          .map((x) => (x <= T ? S.rpe[keyI(x)] : null))
          .filter((v) => v != null)
          .map(Number);
        h += `<div class="dash-title">Diese Woche</div><div class="card"><div class="lstats l3">
      <div><span>Laufen</span><b>${cnt(cw.runKm, 1, " km")}</b></div>
      <div><span>Trainingszeit</span><b>${dash.hm(cw.min)}</b></div>
      <div><span>Ø Anstrengung</span><b>${rpes.length ? cnt(rpes.reduce((a, b) => a + b, 0) / rpes.length, 1) : "–"}</b></div></div>
    <div class="sub mt-3">Anstrengung pro Tag (RPE 1–10)</div>
    ${
      !rpes.length
        ? `<p class="sub mt-2">Noch keine Einträge diese Woche. Nach jedem Training die Anstrengung (RPE) eintragen, dann entsteht hier dein Wochenbild.</p>`
        : dash.barChart(
            wd.map((x, d) => {
              const v = x <= T ? S.rpe[keyI(x)] : null,
                p = dayPlan(x);
              return {
                label: DAYS[d],
                value: v != null ? +v : 0,
                hi: x === TODAY,
                tip: `${DAYSF[d]}: ${v != null ? "RPE " + v : "kein Eintrag"}${p ? " · " + p.t : ""}`,
              };
            }),
            {
              label: "Anstrengung pro Tag",
              fmt: (v) => Math.round(v) + "",
              height: 110,
            },
          )
    }</div>`;

        // Trends (4 Wochen): eine Kennzahl, Auswahl per Chip
        // Letzte 4 Wochen, aber nur ab Planstart (Werte von davor gehören nicht zum Plan)
        const days = [];
        for (let k = 27; k >= 0; k--) {
          const d = isoD(new Date(+NOW - k * dayMs));
          if (idxOfIso(d) >= 0) days.push(d);
        }
        const one = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
        const WELL = {
          readiness: [
            "Erholung",
            (v) => Math.round(v) + "",
            { min: 0, max: 100 },
            "Garmin Training Readiness (0–100). Über 60 = bereit für hartes Training.",
          ],
          sleepH: [
            "Schlaf",
            (v) => one(v) + " h",
            { min: 0, max: 10 },
            "Schlafdauer pro Nacht. Ziel: 7–9 Stunden.",
          ],
          hrv: [
            "HRV",
            (v) => Math.round(v) + " ms",
            {},
            "Herzfrequenzvariabilität in der Nacht. Fällt sie über Tage, braucht der Körper Erholung.",
          ],
          rhr: [
            "Ruhepuls",
            (v) => Math.round(v) + " bpm",
            {},
            "Steigt der Ruhepuls deutlich über deinen Schnitt, ist oft Erholung nötig.",
          ],
        };
        const have = Object.keys(WELL).filter((k) =>
          days.some((d) => S.garmin.well[d] && S.garmin.well[d][k] != null),
        );
        h += `<div class="dgrid"><section><div class="dash-title">Trends · ${days.length >= 28 ? "4 Wochen" : "seit Planstart"}</div>`;
        if (have.length) {
          const ksel = have.includes(dashWell) ? dashWell : have[0],
            [, wf, wo, wdesc] = WELL[ksel];
          const vals = days.map((d) => {
            const x = S.garmin.well[d];
            return x && x[ksel] != null ? +x[ksel] : null;
          });
          const avgOf = (a) => {
            const v = a.filter((x) => x != null);
            return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
          };
          const a7 = avgOf(vals.slice(-7)),
            a28 = avgOf(vals);
          h += `<div class="card" id="dc-well">${dchips(
            "well",
            have.map((k) => [k, WELL[k][0]]),
            ksel,
          )}
      <div class="lstats l2"><div><span>Ø 7 Tage</span><b>${a7 != null ? wf(a7) : "–"}</b></div><div><span>${days.length >= 28 ? "Ø 4 Wochen" : "Ø seit Start"}</span><b>${a28 != null ? wf(a28) : "–"}</b></div></div>
      ${dash.lineChart(
        days.map((d, i) => ({
          label: dmy(d),
          value: vals[i],
          tip: `${dmy(d)}: ${vals[i] == null ? "keine Daten" : wf(vals[i])}`,
        })),
        { fmt: wf, label: WELL[ksel][0], height: 120, ...wo },
      )}
      <p class="sub mt-2">${wdesc}</p></div>`;
        } else
          h += `<div class="card"><p class="sub">${S.garmin.conn ? "Noch keine Erholungswerte. Unter Menü → Strava / Garmin synchronisieren." : "Verbinde Garmin (Menü → Strava / Garmin), dann siehst du hier Erholung, Schlaf, HRV und Ruhepuls im Verlauf."}</p></div>`;
        h += `</section><section><div class="dash-title">Kraft</div>${liftCard()}</section></div>`;
        h += `<div class="dash-title">Schlaf</div>${sleepCard(days)}`;

        // Letzte Aktivitäten (3) + Weg zu allen Aktivitäten und zu den Tests
        const last = acts
          .slice()
          .sort((a, b) => ((a.start || a.date) < (b.start || b.date) ? 1 : -1))
          .slice(0, 3);
        h += `<div class="dash-title">Letzte Aktivitäten</div>`;
        h += last.length
          ? `<div class="list">${last
              .map((a) => {
                const i = idxOfIso(a.date),
                  p = i >= 0 && i <= LAST ? dayPlan(i) : null,
                  rs = dash.repSummary(
                    a,
                    p && p.i ? p.i.find((t) => dash.parseReps(t)) || "" : "",
                  ),
                  d = isoToDate(a.date);
                return `<div class="act"><div class="d">${DAYS[(d.getDay() + 6) % 7]}<b>${d.getDate()}</b></div><div><b>${esc(a.name || strava.SPORT_LABEL[a.group])}</b> <span class="badge ${srcCls(a)}">${srcName(a)}</span><div class="sub">${esc(strava.summary(a))}</div>${rs ? `<div class="sub mt-1">Intervalle ${esc(rs)}</div>` : ""}</div></div>`;
              })
              .join("")}</div>`
          : `<div class="card"><p class="sub">Noch keine Aktivitäten. Verbinde Strava oder Garmin im Menü.</p></div>`;
        h += `<div class="list dash-links"><button class="mi" data-v="strava"><span><b>Alle Aktivitäten</b><span class="sub">Strava / Garmin</span></span><span class="chev">›</span></button>
    <button class="mi" data-v="tests"><span><b>Tests &amp; Benchmarks</b><span class="sub">Pacing-Test, Stationen, Übergaben</span></span><span class="chev">›</span></button></div>`;
        return h + `</div>`;
      }

      /* Schlaf (Garmin): letzte Nacht mit Phasen, Schnitt 7 Tage, Verlauf 4 Wochen und alle Nächte als Tabelle.
   days = ISO-Daten der letzten 28 Tage (älteste zuerst). Zeigt nur, was Garmin liefert. */
      let sleepOpen = false; // Details (Nachtwerte, Verlauf, alle Nächte) aufgeklappt
      function sleepCard(allDays) {
        // Nur Nächte ab Planstart – was davor war, gehört nicht zum Plan
        const days = allDays.filter((d) => idxOfIso(d) >= 0);
        const W = S.garmin.well,
          nights = days.filter((d) => W[d] && W[d].sleepH != null);
        if (!nights.length)
          return `<div class="card"><p class="sub">${S.garmin.conn ? "Noch keine Schlafdaten. Unter Menü → Strava / Garmin synchronisieren." : "Verbinde Garmin (Menü → Strava / Garmin), dann siehst du hier deinen Schlaf: Dauer, Score, Phasen, Einschlaf- und Aufwachzeit."}</p></div>`;
        const one = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
        const hm = (m) => (m == null ? "–" : `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`);
        const avg = (k, list) => {
          const v = list.map((d) => W[d][k]).filter((x) => x != null);
          return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
        };
        const last = nights[nights.length - 1],
          n = W[last];
        const PH = [
          ["deep", "Tief", "var(--sl-deep)"],
          ["rem", "REM", "var(--sl-rem)"],
          ["light", "Leicht", "var(--sl-light)"],
          ["awake", "Wach", "var(--sl-awake)"],
        ];
        const tot = PH.reduce((a, [k]) => a + (n[k] || 0), 0);
        let h = `<div class="card"><div class="row between"><h3>Letzte Nacht</h3><span class="sub">${dmy(last)}${n.bed && n.wake ? ` · ${n.bed} – ${n.wake}` : ""}</span></div>
    <div class="lstats l3 mt-2"><div><span>Dauer</span><b>${one(n.sleepH)} h</b></div><div><span>Score</span><b>${n.sleepScore ?? "–"}</b></div><div><span>Tiefschlaf</span><b>${hm(n.deep)}</b></div></div>`;
        if (tot)
          h += `<div class="sl-bar mt-3" role="img" aria-label="Schlafphasen">${PH.filter(([k]) => n[k]).map(([k, l, c]) => `<span style="flex:${n[k]};background:${c}" title="${l}: ${hm(n[k])} h"></span>`).join("")}</div>
    <div class="sl-leg">${PH.filter(([k]) => n[k] != null).map(([k, l, c]) => `<span><i style="background:${c}"></i>${l} ${hm(n[k])} (${Math.round((n[k] / tot) * 100)} %)</span>`).join("")}</div>`;
        // Schnitt 7 Tage kompakt in einer Zeile, Rest auf Wunsch
        const w7 = nights.filter((d) => days.indexOf(d) >= days.length - 7);
        const a = (k, list, fmtf) => { const v = avg(k, list); return v == null ? "–" : fmtf(v); };
        h += `<p class="sub mt-3">Ø 7 Nächte: <b>${a("sleepH", w7, (v) => one(v) + " h")}</b> · Score ${a("sleepScore", w7, (v) => Math.round(v))} · Tief ${a("deep", w7, hm)} · REM ${a("rem", w7, hm)}</p>`;
        h += `<button class="btn ghost sm mt-2" data-act="sleep-open" aria-expanded="${sleepOpen}">${sleepOpen ? "Weniger anzeigen" : "Details und alle Nächte"}</button>`;
        if (!sleepOpen) return h + `</div>`;
        const night = [
          ["Atmung", n.resp != null ? one(n.resp) + " /min" : null],
          ["SpO₂", n.spo2 != null ? n.spo2 + " %" : null],
          ["Stress", n.sleepStress != null ? one(n.sleepStress) : null],
          ["Unruhig", n.restless != null ? n.restless + "×" : null],
          ["HRV", n.hrv != null ? n.hrv + " ms" : null],
          ["Ruhepuls", n.rhr != null ? n.rhr : null],
        ].filter((x) => x[1] != null);
        if (night.length)
          h += `<div class="lstats mt-3" style="grid-template-columns:repeat(${Math.min(3, night.length)},1fr)">${night.map(([l, v]) => `<div><span>${l}</span><b>${esc(String(v))}</b></div>`).join("")}</div>`;
        // Verlauf Schlafdauer seit Planstart (höchstens 4 Wochen)
        if (days.length > 1) h += `<div class="sub mt-3">Schlafdauer pro Nacht (Ziel 7–9 h)</div>${dash.barChart(
          days.map((d) => ({
            label: isoToDate(d).getDay() === 1 ? dmy(d).slice(0, 5) : "", // nur Montage beschriften
            value: W[d] && W[d].sleepH != null ? W[d].sleepH : 0,
            hi: d === last,
            tip: `${dmy(d)}: ${W[d] && W[d].sleepH != null ? one(W[d].sleepH) + " h" + (W[d].sleepScore != null ? " · Score " + W[d].sleepScore : "") : "keine Daten"}`,
          })),
          { label: "Schlafdauer", fmt: (v) => Math.round(v) + " h", height: 120 },
        )}`;
        if (nights.length > 7)
          h += `<p class="sub mt-2">Ø seit Planstart: ${a("sleepH", nights, (v) => one(v) + " h")} · Score ${a("sleepScore", nights, (v) => Math.round(v))}</p>`;
        // Alle Nächte (neueste zuerst)
        const list = nights.slice().reverse(),
          shown = list;
        h += `<div class="cap mt-4">Alle Nächte</div><div style="overflow-x:auto"><table class="well"><tr><th>Nacht</th><th>Dauer</th><th>Score</th><th>Tief</th><th>REM</th><th>Schlafzeit</th></tr>${shown
          .map((d) => { const x = W[d]; return `<tr><td>${dmy(d).slice(0, 5)}</td><td>${one(x.sleepH)}</td><td>${x.sleepScore ?? "–"}</td><td>${hm(x.deep)}</td><td>${hm(x.rem)}</td><td>${x.bed && x.wake ? x.bed + "–" + x.wake : "–"}</td></tr>`; })
          .join("")}</table></div>`;
        if (nights.some((d) => W[d].deep == null))
          h += `<p class="sub mt-2">Phasen und Zeiten fehlen bei älteren Nächten. „Alles neu laden“ unter Strava / Garmin holt sie nach.</p>`;
        return h + `</div>`;
      }

      /* Dashboard-Animationen (GSAP), bewusst sparsam wie bei Whoop: die drei Ringe füllen sich, Zahlen zählen hoch.
   Alles andere steht sofort da (kein Verstecken bis zum Hineinscrollen – das ruckelt und kann Inhalte verschlucken).
   Nur beim Öffnen des Dashboards, nicht bei jedem Neuaufbau (Sync). „Bewegung reduzieren“ = keine Animation. */
      let dashSeen = false;
      function animateDash() {
        const g = window.gsap;
        if (!g) return;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const root = $("#main .wide");
        if (!root) return;
        root.querySelectorAll(".ring-fg").forEach((c) => {
          const C = +c.dataset.c;
          g.fromTo(
            c,
            { strokeDashoffset: C },
            {
              strokeDashoffset: C * (1 - +c.dataset.pct / 100),
              duration: 0.65,
              ease: "power3.out",
            },
          );
        });
        root.querySelectorAll(".dash-rings .cnt").forEach((el) => {
          const to = +el.dataset.to,
            dec = +el.dataset.dec,
            suf = el.dataset.suf || "",
            o = { v: 0 };
          if (isNaN(to)) return;
          g.to(o, {
            v: to,
            duration: 0.65,
            ease: "power3.out",
            onUpdate: () => {
              el.textContent =
                (dec ? o.v.toFixed(dec).replace(".", ",") : Math.round(o.v)) +
                suf;
            },
          });
        });
      } /* Nur das Diagramm einer Karte neu einblenden (nach Umschalten per Chip) */
      function animateChart(card) {
        const g = window.gsap;
        if (
          !g ||
          !card ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
        )
          return;
        const bars = card.querySelectorAll(".viz .bar");
        if (bars.length)
          g.from(bars, {
            scaleY: 0,
            transformOrigin: "50% 100%",
            duration: 0.55,
            stagger: 0.025,
            ease: "back.out(1.3)",
          });
        card.querySelectorAll(".viz .ln").forEach((p) => {
          const L = p.getTotalLength();
          g.fromTo(
            p,
            { strokeDasharray: L, strokeDashoffset: L },
            {
              strokeDashoffset: 0,
              duration: 0.8,
              ease: "power2.inOut",
              clearProps: "strokeDasharray,strokeDashoffset",
            },
          );
        });
        const ar = card.querySelectorAll(".viz .area, .viz .last");
        if (ar.length) g.from(ar, { opacity: 0, duration: 0.5, delay: 0.2 });
        const st = card.querySelectorAll(".lstats b");
        if (st.length)
          g.from(st, { opacity: 0, y: 6, duration: 0.3, stagger: 0.04 });
      }

      /* Tooltip für Diagramme: [data-tip] überfahren oder antippen */
      (function () {
        let tipEl = null,
          onEl = null;
        const show = (el, x, y) => {
          if (!tipEl) {
            tipEl = document.createElement("div");
            tipEl.id = "viztip";
            tipEl.setAttribute("role", "status");
            document.body.appendChild(tipEl);
          }
          tipEl.textContent = el.getAttribute("data-tip");
          tipEl.hidden = false;
          const r = tipEl.getBoundingClientRect();
          tipEl.style.left =
            Math.max(6, Math.min(innerWidth - r.width - 6, x - r.width / 2)) +
            "px";
          tipEl.style.top = Math.max(6, y - r.height - 12) + "px";
          if (onEl && onEl !== el) onEl.classList.remove("on");
          onEl = el;
          el.classList.add("on");
        };
        const hide = () => {
          if (tipEl) tipEl.hidden = true;
          if (onEl) {
            onEl.classList.remove("on");
            onEl = null;
          }
        };
        document.addEventListener("pointermove", (e) => {
          const el = e.target.closest && e.target.closest(".viz [data-tip]");
          if (el) show(el, e.clientX, e.clientY);
          else if (onEl) hide();
        });
        document.addEventListener("pointerdown", (e) => {
          const el = e.target.closest && e.target.closest(".viz [data-tip]");
          if (el) show(el, e.clientX, e.clientY);
          else hide();
        });
        document.addEventListener("scroll", hide, { passive: true });
      })();

      /* ---------- Wochen-Check (src/review.js) ----------
   Einmal pro Woche: Zahlen der Woche, Rennprognose aus den Tests, eigene Einschätzung → Ampel + Fokus für nächste Woche.
   Fällig ab Samstag bis Dienstag danach (Karte auf der Startseite), jederzeit über das Dashboard. */
      let rvW = null, // angezeigte Woche (null = fällige bzw. aktuelle)
        rvDraft = null; // eigene Einschätzung in Bearbeitung {w, feel, prog, pain, note}
      const LVL_LABEL = { green: "Auf Kurs", yellow: "Aufpassen", red: "Nachsteuern" };
      const RV_SR = { green: "Gut", yellow: "Achtung", red: "Kritisch" };
      function rvData(w) {
        const T = Math.min(TODAY, LAST),
          days = [];
        for (let i = w * 7; i < w * 7 + 7 && i <= T; i++) {
          const p = dayPlan(i);
          // Heute zählt erst als verpasst, wenn der Tag vorbei ist
          if (!p || (i === TODAY && !trained(i))) continue;
          days.push({
            t: p.t,
            k: isSession(i) ? p.k : "rest",
            done: trained(i),
            rpe: S.rpe[keyI(i)],
            ready: readiness(S.checkin[keyI(i)] || {}),
          });
        }
        const wl = dash.weekly(Object.values(S.strava.acts), idxOfIso, w),
          extras = [];
        for (let i = w * 7; i < w * 7 + 7; i++)
          extras.push(...cleanExtras(S.extra[keyI(i)]));
        const self = review.cleanSelf(S.review[w]);
        return review.weekCheck({
          days,
          wave: weekInfo(w).wave,
          load: wl[w],
          prev: wl.slice(Math.max(0, w - 3), w),
          extras,
          self: Object.keys(self).length ? self : null,
        });
      }
      /* Prognose aus den aktuellen Tests (ich + Partner) */
      function rvForecast() {
        const me = myTests(),
          pa = partnerTests();
        return review.forecast({
          lauf: [...me.lauf, ...pa.lauf].map(parseT),
          station: me.station.map((v, r) => [parseT(v), parseT(pa.station[r])]),
        });
      }
      /* Kurzfassung der laufenden Woche in S.wsnap – die Edge Function „weekly“ macht daraus den Push am Sonntag.
   Gibt true zurück, wenn sich etwas geändert hat. */
      function weekSnap() {
        if (TODAY < 0 || TODAY > LAST + 1 || !S.review) return false;
        const w = Math.floor(Math.min(TODAY, LAST) / 7),
          r = rvData(w),
          fc = rvForecast();
        const sl = [];
        for (let k = 0; k < 7; k++) {
          const x = S.garmin.well[isoD(new Date(+NOW - k * dayMs))];
          if (x && x.sleepH != null) sl.push(x.sleepH);
        }
        const snap = {
          w,
          level: r.level,
          done: r.done,
          planned: r.planned,
          rpe: r.avgRpe != null ? Math.round(r.avgRpe * 10) / 10 : null,
          sleep: sl.length ? Math.round((sl.reduce((a, b) => a + b, 0) / sl.length) * 10) / 10 : null,
          fc: fc && fc.total ? Math.round(fc.total) : null,
          focus: r.focus[0] || "",
          reviewed: !!(S.review[w] && S.review[w].at),
        };
        if (stable(snap) === stable(S.wsnap || null)) return false;
        S.wsnap = snap;
        return true;
      }
      /* ---------- Wochenbericht per Push (Edge Function „weekly“, supabase/push.sql) ---------- */
      const PUSH_OK =
        "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && !!(window.HX_CONFIG || {}).vapidPublicKey;
      let pushState = null, // null = unbekannt, "on" | "off" | "denied"
        pushBusy = false;
      async function pushSub() {
        const reg = await navigator.serviceWorker.ready;
        return reg.pushManager.getSubscription();
      }
      async function pushCheck() {
        if (!PUSH_OK) return;
        const sub = await pushSub().catch(() => null);
        pushState = Notification.permission === "denied" ? "denied" : sub ? "on" : "off";
        if (view === "review") render();
      }
      async function pushOn() {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          pushState = perm === "denied" ? "denied" : "off";
          return toast("Ohne Erlaubnis keine Push-Nachrichten", true);
        }
        const reg = await navigator.serviceWorker.ready;
        const key = Uint8Array.from(
          atob(CFG.vapidPublicKey.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );
        const sub =
          (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
        const j = sub.toJSON();
        const { error } = await sb
          .from("push_subs")
          .upsert({ endpoint: j.endpoint, user_id: USER.id, p256dh: j.keys.p256dh, auth: j.keys.auth });
        if (error) throw error;
        pushState = "on";
        toast("Wochenbericht ist aktiv – jeden Sonntag um 18 Uhr");
      }
      async function pushOff() {
        const sub = await pushSub();
        if (sub) {
          await sb.from("push_subs").delete().eq("endpoint", sub.endpoint);
          await sub.unsubscribe();
        }
        pushState = "off";
        toast("Wochenbericht ausgeschaltet");
      }
      function pushCard() {
        let h = `<div class="card"><h3>Wochenbericht aufs Handy</h3><p class="sub mt-1">Jeden Sonntag um 18 Uhr eine Push-Nachricht mit deiner Woche: Einheiten, Anstrengung, Schlaf, Prognose und Fokus. Ein Tipp darauf öffnet den Wochen-Check.</p>`;
        if (!(sb && USER)) return h + `<p class="sub mt-2">Nur mit Anmeldung verfügbar.</p></div>`;
        if (!PUSH_OK)
          return h + `<p class="sub mt-2">Dieser Browser kann keine Push-Nachrichten empfangen. Auf Android: in Chrome öffnen und über das Menü „App installieren“ wählen.</p></div>`;
        if (pushState === null) {
          pushCheck();
          return h + `<p class="sub mt-2">Prüfe …</p></div>`;
        }
        if (pushState === "denied")
          return h + `<p class="sub mt-2">Benachrichtigungen sind für diese Seite blockiert. In den Browser- bzw. App-Einstellungen unter „Benachrichtigungen“ erlauben, dann hier einschalten.</p></div>`;
        if (pushState === "on")
          return h + `<p class="mt-2"><span class="amp amp-green">Aktiv auf diesem Gerät</span></p><div class="grid2 mt-3"><button class="btn" data-act="push-test" ${pushBusy ? "disabled" : ""}>Test senden</button><button class="btn ghost" data-act="push-off" ${pushBusy ? "disabled" : ""}>Ausschalten</button></div></div>`;
        return h + `<div class="btns"><button class="btn primary" data-act="push-on" ${pushBusy ? "disabled" : ""}>Wochenbericht einschalten</button></div></div>`;
      }
      /* Erste Sitzung in einer neuen Planwoche (pro Gerät gemerkt): nur dann erscheint der offene Check der Vorwoche */
      const RV_FIRST = (() => {
        const w = Math.floor(Math.max(0, Math.min(TODAY, LAST)) / 7),
          seen = lsGet("rv-open-w");
        if (seen === String(w)) return false;
        lsSet("rv-open-w", String(w));
        return seen !== null;
      })();
      const rvDueW = () =>
        TODAY >= 0 && TODAY <= LAST + 2
          ? review.reviewDue(Math.min(TODAY, LAST), S.review, RV_FIRST)
          : null;
      function reviewCard() {
        const w = rvDueW();
        if (w == null) return "";
        const r = rvData(w);
        return `<div class="card tight"><div class="row between"><h3>Wochen-Check Woche ${w + 1}</h3><span class="amp amp-${r.level}">${LVL_LABEL[r.level]}</span></div>
    <p class="sub mt-2">${r.done}/${r.planned} Einheiten. 1 Minute: Bist du auf Kurs für Basel?</p><button class="btn primary sm mt-3" data-act="rv-open" data-w="${w}">Wochen-Check machen →</button></div>`;
      }
      function vReview() {
        const cur = Math.max(0, Math.min(NWEEKS - 1, Math.floor(Math.min(TODAY, LAST) / 7)));
        const w = rvW != null ? rvW : (rvDueW() ?? cur);
        const r = rvData(w),
          saved = S.review[w] || {},
          self = rvDraft && rvDraft.w === w ? rvDraft : { w, ...review.cleanSelf(saved) };
        rvDraft = self;
        let h = `<div class="narrow">${vhead("Wochen-Check", "Jede Woche prüfen, ob du auf Kurs bist – nicht erst am Race Day.", true)}`;
        h += `<div class="wk"><button data-act="rv-wk" data-d="-1" aria-label="Vorherige Woche" ${w === 0 ? "disabled" : ""}>‹</button>
    <div><h2>Woche ${w + 1}</h2><div class="sub">${fmt(dateFromIdx(w * 7))} – ${fmt(dateFromIdx(w * 7 + 6))} · ${esc(weekInfo(w).wave)}</div></div>
    <button data-act="rv-wk" data-d="1" aria-label="Nächste Woche" ${w >= cur ? "disabled" : ""}>›</button></div>`;
        // 1. Zahlen der Woche
        h += `<div class="card"><div class="row between"><h3>Die Woche</h3><span class="amp amp-${r.level}">${LVL_LABEL[r.level]}</span></div>
    <ul class="rv-notes mt-2">${r.notes.map((n) => `<li class="rv-${n.level}"><span class="vh-only">${RV_SR[n.level]}: </span>${esc(n.text)}</li>`).join("")}${r.extraN ? `<li class="rv-green"><span class="vh-only">${RV_SR.green}: </span>${r.extraN} Zusatz-${r.extraN === 1 ? "Einheit" : "Einheiten"}${r.extraMin ? ` · ${r.extraMin}′` : ""}.</li>` : ""}</ul>
    <div class="cap mt-3">Fokus nächste Woche</div><ul class="rv-focus mt-1">${r.focus.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
        // 2. Rennprognose
        const fc = rvForecast(),

        h += `<div class="card"><h3>Rennprognose</h3>`;
        if (!fc)
          h += `<p class="sub mt-2">Noch keine Testwerte. Trage den Lauf-Pacing-Test und den Stationen-Benchmark ein, dann rechnet die App hier deine Zeit hoch.</p><div class="btns"><button class="btn" data-v="tests">Tests eintragen →</button></div>`;
        else {
          const t = review.onTrack(fc.total, weeksLeft);
          h += `<div class="lstats l3 mt-2"><div><span>Laufen 8 km</span><b>${mmss(fc.run)}</b></div><div><span>Stationen</span><b>${fc.st != null ? mmss(fc.st) : "–"}</b></div><div><span>Gesamt</span><b>${fc.total != null ? mmss(fc.total) : "–"}</b></div></div>`;
          h += t
            ? `<p class="mt-3"><span class="amp amp-${t.level}">${t.level === "green" ? "Sub-60 in Reichweite" : t.level === "yellow" ? "Machbar mit Fortschritt" : "Ziel prüfen"}</span> ${esc(review.trackText(fc.total, t))}</p>`
            : `<p class="sub mt-3">Für die Gesamtzeit fehlen noch ${fc.missing} Stationszeiten.</p>`;
          // Verlauf der beim Abschliessen gespeicherten Prognosen
          const pts = [];
          for (let x = 0; x <= cur; x++)
            pts.push({ label: "W" + (x + 1), value: S.review[x] && S.review[x].fc ? S.review[x].fc / 60 : null });
          if (pts.filter((p) => p.value != null).length >= 2)
            h += `<div class="sub mt-3">Prognose pro Wochen-Check</div>${dash.lineChart(pts, { label: "Rennprognose", fmt: (v) => mmss(v * 60), height: 120 })}`;
          h += `<p class="sub mt-2">Grobe Schätzung: 1-km-Testpace + ${review.RUN_PENALTY} s/km, Stationen ${Math.round(review.DOUBLES_SHARE * 100)} % der Solo-Zeit (geteilt), ${mmss(review.ROXZONE)} Roxzone. Wird mit jedem neuen Test genauer.</p>`;
        }
        h += `</div>`;
        // 3. Eigene Einschätzung
        h += `<div class="card"><h3>Deine Einschätzung</h3>`;
        for (const [k, q] of Object.entries(review.SELF))
          h += `<div class="ci-row"><span>${q.label}</span><div class="seg" role="group" aria-label="${q.label}">${q.opts.map((o, j) => `<button class="v-${["g", "y", "r"][j]} ${self[k] === j ? "on" : ""}" data-act="rv-self" data-f="${k}" data-j="${j}" aria-pressed="${self[k] === j}">${o}</button>`).join("")}</div></div>`;
        h += `<label class="lbl mt-3" for="rv-note">Notiz (optional)</label><textarea id="rv-note" maxlength="300" rows="2" placeholder="Was lief gut, was nicht?">${esc(self.note || "")}</textarea>
    <div class="btns"><button class="btn primary" data-act="rv-save" data-w="${w}">${saved.at ? "Aktualisieren" : "Wochen-Check abschliessen"}</button></div>${saved.at ? `<p class="sub mt-2">Abgeschlossen am ${new Date(saved.at).toLocaleDateString("de-CH")}.</p>` : ""}</div>`;
        // Verlauf: Ampel pro abgeschlossener Woche
        const past = [];
        for (let x = 0; x <= cur; x++)
          if (S.review[x] && S.review[x].at)
            past.push(`<button class="btn sm rv-wbtn rv-${S.review[x].level || "green"}" data-act="rv-go" data-w="${x}" aria-label="Woche ${x + 1}: ${LVL_LABEL[S.review[x].level || "green"]}">W${x + 1}</button>`);
        if (past.length)
          h += `<div class="card tight"><div class="cap">Bisherige Wochen</div><div class="chiprow mt-2">${past.join("")}</div></div>`;
        return h + pushCard() + `</div>`;
      }

      /* ---------- Backup ---------- */
      let bkp = null; // eingelesenes Backup, wartet auf Bestätigung: {name, data, meta, summary}

        "[data-v],[data-last],[data-wk],[data-open],[data-sel],[data-r],[data-act],[data-back],[data-move],[data-swap],[data-injs],[data-injd],[data-injm],[data-edit],[data-ci],[data-sug],[data-sug-no],[data-who],[data-imp-all],[data-pb],[data-pd],[data-pgo]";
      document.addEventListener("click", async (e) => {
        const t = e.target.closest(CLICK);
        if (!t) return;
        const d = t.dataset;
        // Passwort ein-/ausblenden direkt im DOM, damit die Eingabe erhalten bleibt
        if (d.act === "auth-mode") {
          const el = $("#le");
          if (el) loginEmail = el.value.trim();
          authMode = d.mode;
          loginMsg = loginOk = "";
          render();
          const f = $("#le");
          if (f) f.focus();
          return;
        }
        if (d.act === "pw-eye") {
          const w = t.parentElement,
            i = w.querySelector("input"),
            show = i.type === "password";
          i.type = show ? "text" : "password";
          w.classList.toggle("show", show);
          t.setAttribute("aria-pressed", show);
          t.setAttribute(
            "aria-label",
            show ? "Passwort verbergen" : "Passwort anzeigen",
          );
          i.focus();
          const n = i.value.length;
          try {
            i.setSelectionRange(n, n);
          } catch (_) {}
          return;
        }
        if (d.v) {
          if (d.v === "coach" && t.closest("#sheet")) coachTab = "chat";
          return go(d.v);
        }
        if (d.back !== undefined)
          return go(view === "edit" && editBack ? editBack : prevView, "back");
        if (d.move !== undefined) {
          moveFrom = +d.move;
          return go("move");
        }
        if (d.edit !== undefined) {
          editFrom = +d.edit;
          editBack = view === "coach" ? "coach" : null;
          return go("edit");
        }
        if (d.act === "mv-day") {
          moveFrom = Math.max(0, Math.min(LAST, moveFrom + +d.d));
          return render();
        }
        if (d.act === "mv-today") {
          moveFrom = Math.max(0, Math.min(LAST, TODAY));
          return render();
        }
        if (d.act === "ol-easy") {
          setE(+d.i, { easy: 1 });
          save();
          toast("Einheit entlastet: ca. 75 % Volumen, RPE max. 6");
          return render();
        }
        if (d.act === "strava-no") {
          S.dismiss["stv:" + d.i] = 1;
          save();
          return render();
        }
        if (d.act === "solo") {
          const dk = keyI(+d.i);
          if (S.solo[dk]) delete S.solo[dk];
          else S.solo[dk] = 1;
          save();
          toast(
            S.solo[dk]
              ? "Solo: Einheit für allein angepasst"
              : `Wieder mit ${PARTNER}`,
          );
          return render();
        }
        if (d.act === "x-open" || d.act === "x-sug") {
          xOpen = +d.i;
          xPre = d.act === "x-sug" ? { type: d.xt, min: d.min } : null;
          render();
          grow($(".xform"));
          const m = $("#x-min");
          if (m) m.focus({ preventScroll: true });
          return;
        }
        if (d.act === "x-cancel") {
          return shrink($(".xform"), () => {
            xOpen = null;
            xPre = null;
            render();
          });
        }
        if (d.act === "x-type") {
          t.parentNode.querySelectorAll("button").forEach((b) => {
            b.classList.toggle("on", b === t);
            b.setAttribute("aria-pressed", b === t);
          });
          return;
        }
        if (d.act === "x-add") {
          const i = +d.i,
            f = t.closest(".xform"),
            on = f.querySelector("[data-xt].on");
          const e = makeExtra({
            type: on && on.dataset.xt,
            min: f.querySelector("#x-min").value,
            rpe: f.querySelector("#x-rpe").value,
            note: f.querySelector("#x-note").value,
          });
          if (!e)
            return toast("Dauer in Minuten (1–600), RPE 1–10 – oder leer lassen");
          const dk = keyI(i);
          S.extra[dk] = addExtra(cleanExtras(S.extra[dk]), e);
          xOpen = null;
          xPre = null;
          save();
          toast("Gespeichert: " + extraLabel(e));
          return render();
        }
        if (d.act === "x-del") {
          const dk = keyI(+d.i),
            l = removeExtra(S.extra[dk], d.x);
          if (l.length) S.extra[dk] = l;
          else delete S.extra[dk];
          save();
          return render();
        }
        if (d.act === "sore-open") {
          coachTab = "sore";
          soreInitOpen();
          return go("coach");
        }
        if (d.act === "ci-ok") {
          const c = (S.checkin[d.k] = S.checkin[d.k] || {});
          // Gemeldeter Muskelkater bleibt massgebend, der Rest wird grün
          const sl = sore.checkinLevel(soreAt(soreToday()));
          for (const [f] of CHECKIN_FIELDS)
            c[f] = f === "sore" && sl ? sl : "g";
          ciOpen = false;
          save();
          toast(
            sl && sl !== "g"
              ? "Check-in gespeichert – Muskelkater aus deinen Meldungen"
              : "Check-in: keine Beschwerden",
          );
          return leaveCheckin(t);
        }
        if (d.act === "all-done") return completeAll(+d.i);
        if (d.act === "rpe-clear") {
          delete S.rpe[d.k];
          save();
          return render();
        }
        if (d.act === "dash-chip") {
          if (d.g === "lift") dashLift = d.k;
          else if (d.g === "well") dashWell = d.k;
          render();
          animateChart(document.querySelector("#dc-" + d.g));
          return pop(`#dc-${d.g} .lchips .on`);
        }
        if (d.act === "done-open") {
          const i = +d.i,
            bar = t.closest(".done-bar"),
            h0 = bar ? bar.getBoundingClientRect().height : 60;
          doneOpen.add(i);
          render();
          return grow(
            document.querySelector(`.card.hero[data-day="${i}"]`),
            h0,
          );
        }
        if (d.act === "done-close") {
          return closeCard(+d.i);
        }
        if (d.last) {
          const el = document.querySelector(`[data-v2="${d.last}"]`);
          S.val[d.last] = d.lv;
          save();
          if (el) {
            el.value = d.lv;
            el.classList.remove("pre");
            el.focus();
          }
          return toast(`Übernommen: ${d.lv}`);
        }
        if (d.act === "sore-clear") {
          delete S.sore[soreToday()];
          soreSave();
          toast("Muskelkater zurückgesetzt");
          return render();
        }
        if (d.ci) {
          const [k, f, v] = d.ci.split("|");
          const c = (S.checkin[k] = S.checkin[k] || {});
          if (c[f] === v) delete c[f];
          else c[f] = v;
          ciOpen = true;
          save();
          render();
          return pop(`[data-ci="${d.ci}"]`);
        }
        if (d.act === "ci-edit") {
          return transition("fade", () => {
            ciOpen = true;
            render();
          });
        }
        if (d.act === "ci-done") {
          ciOpen = false;
          return leaveCheckin(t);
        }
        if (d.sug) {
          const s = SUGS.find((x) => x.id === d.sug);
          if (!s) return;
          applySug(s);
          save();
          toast(
            s.type === "swap"
              ? `${dayPlan(s.to).t} → ${shortDay(s.to)}`
              : "Plan angepasst",
          );
          return transition("fade", render);
        }
        if (d.sugNo) {
          S.dismiss[d.sugNo] = 1;
          save();
          return transition("fade", render);
        }
        if (d.act === "edit-save") {
          const lines = $("#ed-i")
            .value.split("\n")
            .map((s) => s.trim())
            .filter(Boolean);
          if (!lines.length) return toast("Mindestens eine Übung eintragen");
          const src = srcOf(editFrom),
            k = S.edit[src] && S.edit[src].k; // vom Coach gesetzte Disziplin behalten
          S.edit[src] = {
            t: $("#ed-t").value.trim(),
            i: lines,
            n: $("#ed-n").value.trim(),
            ...(k ? { k } : {}),
          };
          save();
          toast("Einheit angepasst");
          return go(editBack || prevView, "back");
        }
        if (d.act === "edit-save-all" || d.act === "edit-reset-all") {
          if (!sb || !USER) return toast("Dafür ist der Cloud-Login nötig", true);
          const src = srcOf(editFrom);
          let err;
          if (d.act === "edit-reset-all") {
            if (!confirm("Gemeinsame Änderung für ALLE zurücksetzen?")) return;
            ({ error: err } = await sb.rpc("reset_shared_edit", { p_day: src }));
          } else {
            const lines = $("#ed-i")
              .value.split("\n")
              .map((x) => x.trim())
              .filter(Boolean);
            if (!lines.length) return toast("Mindestens eine Übung eintragen");
            if (!$("#ed-t").value.trim()) return toast("Titel fehlt");
            if (!confirm("Diese Änderung gilt für ALLE Nutzer der Gruppe. Speichern?")) return;
            // Pläne sind aus Jaimes Sicht geschrieben: der Name des Partners wird dafür zurückgetauscht
            const canon = (x) => (ME === "Jaime" ? x : String(x).split(PARTNER).join("Jimoh"));
            ({ error: err } = await sb.rpc("set_shared_edit", {
              p_day: src,
              p_data: {
                t: canon($("#ed-t").value.trim()),
                k: ownPlan(src).k,
                i: lines.map(canon),
                n: canon($("#ed-n").value.trim()),
              },
            }));
            if (!err) delete S.edit[src]; // sonst würde die eigene Änderung die gemeinsame überdecken
          }
          if (err) return toast("Speichern fehlgeschlagen. Bitte Verbindung prüfen.", true);
          await loadTeamEdits();
          save();
          toast(d.act === "edit-reset-all" ? "Für alle zurückgesetzt" : "Für alle gespeichert");
          return go(editBack || prevView, "back");
        }
        if (d.act === "edit-reset") {
          delete S.edit[srcOf(editFrom)];
          save();
          toast("Original wiederhergestellt");
          return go(editBack || prevView, "back");
        }
        if (d.who) {
          const el = $("#le");
          if (el) loginEmail = el.value.trim();
          loginWho = d.who;
          return render();
        }
        if (d.act === "logout") {
          menu(false);
          if (!sb) {
            lsDel("hx:mock");
            setNames("Jaime");
            toast("Abgemeldet");
            return render();
          }
          if (
            !confirm(
              "Abmelden? Deine Daten bleiben in der Cloud gespeichert und werden von diesem Gerät entfernt.",
            )
          )
            return;
          (async () => {
            if (dirty) {
              clearTimeout(pushT);
              await push();
            }
            // Lokale Kopie nur löschen, wenn alles in der Cloud ist – sonst gingen Offline-Änderungen verloren
            const uid = USER.id,
              keep = dirty;
            if (!keep) {
              lsDel("hx:" + uid);
              lsDel("hx:" + uid + ":base");
              lsDel("hx:" + uid + ":strava");
              lsDel("hx:names:" + uid);
            }
            lsDel("hx:last");
            resetAuth(
              keep
                ? "Nicht alles war gespeichert. Die Einträge bleiben auf diesem Gerät und werden beim nächsten Login hochgeladen."
                : "",
            );
            await sb.auth.signOut();
          })();
          return;
        }
        if (d.swap !== undefined) {
          const i = moveFrom,
            j = +d.swap,
            pulled = dayPlan(i).k === "rest",
            to = pulled ? i : j;
          swapDays(i, j);
          save();
          moveFrom = to;
          render();
          return toast(`${dayPlan(to).t} → ${shortDay(to)}`);
        }
        if (d.injs) {
          injStart = Math.max(0, Math.min(LAST, injStart + +d.injs));
          return render();
        }
        if (d.injd) {
          injDays = +d.injd;
          return render();
        }
        if (d.injm) {
          injMode = d.injm;
          return render();
        }
        if (d.act === "skip") {
          const k = keyI(moveFrom);
          if (S.skip[k]) delete S.skip[k];
          else S.skip[k] = 1;
          save();
          // Ausfall direkt dem Coach melden: er schlägt die Umplanung im Chat vor, übernommen wird erst nach Bestätigung
          if (S.skip[k] && coachReady() && !ccBusy) {
            toast(
              `Training vom ${shortDay(moveFrom)} als ausgefallen markiert – der Coach plant um`,
            );
            coachTab = "chat";
            return sendCoach(coach.skipMessage(moveFrom, dayPlan(moveFrom).t));
          }
          toast(
            S.skip[k]
              ? `Training vom ${shortDay(moveFrom)} als ausgefallen markiert – wähle unten einen neuen Tag`
              : "Ausgefallen-Markierung entfernt",
          );
          return render();
        }
        if (d.act === "restore") {
          restoreDay(moveFrom);
          save();
          toast("Original wiederhergestellt");
          return render();
        }
        if (d.act === "inj-from") {
          injStart = Math.max(0, moveFrom);
          return go("inj");
        }
        if (d.act === "inj-apply") {
          applyInjury(injStart, injDays, injMode);
          save();
          toast("Plan angepasst. Gute Besserung!");
          return go(prevView, "back");
        }
        if (d.act === "inj-end") {
          endInjury();
          save();
          toast("Willkommen zurück – 3 Comeback-Einheiten geplant");
          return go(prevView, "back");
        }
        if (d.impAll !== undefined) {
          imp.all = d.impAll === "1";
          return render();
        }
        if (d.act === "imp-apply") {
          const { plan, changed } = mergeImport(PLAN(), imp.parsed, {
            from: imp.all ? 0 : Math.max(0, TODAY),
            name: imp.name,
          });
          S.plan = plan;
          imp = { step: "pick" };
          wk = CURW;
          openDay = null;
          save();
          toast(`Plan übernommen – ${changed.length} Tage aktualisiert`);
          return go("week");
        }
        if (d.act === "imp-cancel") {
          imp = { step: "pick" };
          return render();
        }
        if (d.act === "imp-undo") {
          if (
            !confirm(
              S.plan.prev
                ? "Vorherigen Plan wiederherstellen?"
                : "Importierten Plan verwerfen und den eingebauten Plan verwenden?",
            )
          )
            return;
          S.plan = undoImport(S.plan);
          save();
          toast("Plan wiederhergestellt");
          return render();
        }
        if (d.act === "strava-take") {
          const i = +d.i,
            p = dayPlan(i),
            dk = keyI(i),
            a = actsOf(i).find((x) => strava.fits(p.k, x.group));
          p.i.forEach((_, j) => (S.done[dk + "|" + j] = 1));
          const j = p.i.findIndex((t) => !isFiller(t));
          if (a && j >= 0 && !S.val[dk + "|" + j])
            S.val[dk + "|" + j] = strava.summary(a);
          let msg = "Workout erledigt – von " + srcName(a) + " übernommen";
          if (a && a.laps) {
            // Zeile mit Intervall-Vorgabe ("4×1km") bekommt die Zeiten jeder Wiederholung statt nur der Gesamtzeit
            const r = p.i.findIndex((t) => dash.parseReps(t)),
              plan = r >= 0 ? p.i[r] : "",
              rs = dash.repSummary(a, plan);
            if (rs) {
              const k = r >= 0 ? r : j;
              if (k >= 0) S.val[dk + "|" + k] = rs;
              msg = "Erledigt – Intervallzeiten übernommen";
              // Pacing-Test: Pace jeder Wiederholung direkt in Profil → Tests (nur leere Felder, nichts überschreiben)
              if (p.test && p.k === "lauf") {
                const P = dash.repPaces(a, plan),
                  mc = myCol(),
                  L = S.tests.lauf[mc] || (S.tests.lauf[mc] = ["", "", "", ""]);
                let n = 0;
                P.slice(0, 4).forEach((v, x) => {
                  if (v && !String(L[x] || "").trim()) {
                    L[x] = mmss(v);
                    n++;
                  }
                });
                if (n)
                  msg =
                    "Erledigt – Intervallzeiten auch in den Pacing-Test übernommen";
              }
            }
          }
          save();
          toast(msg);
          return render();
        }
        if (d.act === "st-connect" && stServer()) {
          if (navigator.onLine === false)
            return toast("Offline – zum Verbinden braucht es Internet", true);
          stBusy = true;
          stMsg = "";
          render();
          (async () => {
            try {
              const id =
                CFG.stravaClientId ||
                (await stInvoke({ action: "config" })).clientId;
              if (!/^\d+$/.test(String(id || "")))
                throw new Error(
                  "Auf dem Server ist keine gültige Strava-Client-ID hinterlegt.",
                );
              location.href = strava.authUrl(id, redirectUri());
            } catch (e) {
              stBusy = false;
              stMsg = e instanceof TypeError ? stravaErr(e) : e.message;
              render();
            }
          })();
          return;
        }
        if (d.act === "st-connect") {
          const id = $("#st-id").value.trim(),
            sec = $("#st-sec").value.trim();
          if (!/^\d+$/.test(id) || !sec)
            return toast("Client-ID (nur Ziffern) und Secret eintragen");
          if (navigator.onLine === false)
            return toast("Offline – zum Verbinden braucht es Internet", true);
          lsSet("hx:strava-id", id);
          lsSet("hx:strava-secret", sec);
          location.href = strava.authUrl(id, redirectUri());
          return;
        }
        if (d.act === "st-sync") return stravaSync(false);
        if (d.act === "gm-sync") return garminSync(false);
        // Fehlende ältere Einheiten nachholen: Zeitstempel vergessen, dann holt der Sync alles ab Planstart
        if (d.act === "st-full") {
          S.strava.at = 0;
          return stravaSync(false);
        }
        if (d.act === "gm-full") {
          S.garmin.at = 0;
          return garminSync(false);
        }
        if (d.act === "gm-off") return garminOff();
        if (d.act === "gm-mfa-x") return garminMfaCancel();
        if (d.act === "gm-copy") {
          const txt = gmCmd();
          if (navigator.clipboard)
            navigator.clipboard.writeText(txt).then(
              () => toast("Befehl kopiert"),
              () => prompt("Befehl:", txt),
            );
          else prompt("Befehl:", txt);
          return;
        }
        if (d.act === "st-off") {
          if (!confirm("Strava trennen? Bereits geladene Aktivitäten bleiben."))
            return;
          lsDel(stKey());
          stMsg = "";
          return render();
        }
        if (d.act === "st-clear") {
          if (
            !confirm(
              "Alle Strava- und Garmin-Aktivitäten aus der App löschen? Beim nächsten Synchronisieren werden sie neu geladen.",
            )
          )
            return;
          S.strava = { acts: {}, at: 0 };
          save();
          return render();
        }
        if (d.act === "shared-close") {
          SHARED = null;
          history.replaceState(null, "", location.pathname + location.search);
          return go("today");
        }
        if (d.wk) {
          const n = Math.max(0, Math.min(NWEEKS - 1, wk + +d.wk));
          if (n === wk) return;
          return transition(n > wk ? "next" : "prev", () => {
            wk = n;
            openDay = null;
            render();
          });
        }
        if (d.pb) {
          const id = d.pb,
            body = document.querySelector("#main .blk-body");
          if (planBlk === id)
            return shrink(body, () => {
              planBlk = null;
              planDay = null;
              render();
            });
          const open = () => {
            planBlk = id;
            planDay = null;
            render();
            grow(document.querySelector("#main .blk-body"));
            const el = document.querySelector(`[data-pb="${CSS.escape(id)}"]`);
            if (el)
              el.scrollIntoView({
                block: "nearest",
                behavior: calm() ? "auto" : "smooth",
              });
          };
          return body ? shrink(body, open) : open();
        }
        if (d.pd !== undefined) {
          const i = +d.pd,
            body = document.querySelector("#main .pday-body");
          if (planDay === i)
            return shrink(body, () => {
              planDay = null;
              render();
            });
          const open = () => {
            planDay = i;
            render();
            grow(document.querySelector("#main .pday-body"));
          };
          return body ? shrink(body, open) : open();
        }
        if (d.pgo !== undefined) {
          const i = +d.pgo;
          wk = Math.floor(i / 7);
          openDay = i;
          return go("week");
        }
        if (d.open !== undefined) {
          const i = +d.open;
          // Breit: Tag steht rechts daneben → überblenden. Schmal: unter der Zeile aufklappen
          if (WIDE()) {
            if (openDay === i) return;
            return transition("fade", () => {
              openDay = i;
              render();
            });
          }
          const body = document.querySelector("#main .day-body");
          if (openDay === i)
            return shrink(body, () => {
              openDay = null;
              render();
            });
          const open = () => {
            openDay = i;
            render();
            grow(document.querySelector("#main .day-body"));
          };
          return body ? shrink(body, open) : open();
        }
        if (d.sel !== undefined) {
          const n = +d.sel,
            cur = sel != null ? sel : Math.max(0, Math.min(LAST, TODAY));
          if (n === cur) return;
          return transition(n > cur ? "next" : "prev", () => {
            sel = n === TODAY ? null : n;
            render();
            window.scrollTo(0, 0);
          });
        }
        if (d.r) {
          const [k, r] = d.r.split("|"),
            set = S.rpe[k] != r;
          if (set) S.rpe[k] = +r;
          else delete S.rpe[k];
          ciOpen = false;
          save();
          render();
          pop(`[data-r="${d.r}"]`);
          // Nach der RPE-Wahl direkt weiter zur Notiz
          const n = set && document.querySelector(`[data-n="${k}"]`);
          if (n) {
            n.focus({ preventScroll: true });
            n.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          return;
        }
        if (d.act === "menu") return menu(true);
        if (d.act === "close") return menu(false);
        if (d.act === "bk-export") return exportBackup();
        if (d.act === "bk-share") {
          const txt = JSON.stringify(makeBackup(S, { user: ME }));
          if (navigator.share)
            navigator
              .share({ title: "Basel Sub-60 Backup", text: txt })
              .catch(() => {});
          else if (navigator.clipboard)
            navigator.clipboard
              .writeText(txt)
              .then(() => toast("Backup kopiert"));
          else prompt("Backup:", txt);
          return;
        }
        if (d.act === "rv-open" || d.act === "rv-go") {
          rvW = +d.w;
          rvDraft = null;
          if (view === "review") return render();
          return go("review");
        }
        if (d.act === "rv-wk") {
          const cur = Math.max(0, Math.floor(Math.min(TODAY, LAST) / 7));
          rvW = Math.max(0, Math.min(cur, (rvW ?? rvDueW() ?? cur) + +d.d));
          rvDraft = null;
          return render();
        }
        if (d.act === "rv-self") {
          const n = $("#rv-note");
          if (n) rvDraft.note = n.value;
          rvDraft[d.f] = +d.j;
          return render();
        }
        if (d.act === "rv-save") {
          const w = +d.w,
            n = $("#rv-note");
          if (n) rvDraft.note = n.value;
          const fc = rvForecast();
          S.review[w] = { ...review.cleanSelf(rvDraft), at: Date.now() };
          S.review[w].level = rvData(w).level;
          if (fc && fc.total) S.review[w].fc = Math.round(fc.total);
          rvDraft = null;
          save();
          toast("Wochen-Check gespeichert");
          return render();
        }
        if (["push-on", "push-off", "push-test"].includes(d.act)) {
          if (pushBusy) return;
          pushBusy = true;
          render();
          (async () => {
            try {
              if (d.act === "push-on") await pushOn();
              if (d.act === "push-off") await pushOff();
              if (d.act === "push-test") {
                const { data, error } = await sb.functions.invoke("weekly", { body: { action: "test" } });
                if (error || !data || !data.sent) throw error || new Error("not_sent");
                toast("Test gesendet – kommt gleich aufs Handy");
              }
            } catch (_) {
              toast(
                d.act === "push-test"
                  ? "Test fehlgeschlagen. Ist die Function „weekly“ eingerichtet (SETUP.md)?"
                  : "Hat nicht geklappt. Ist supabase/push.sql ausgeführt?",
                true,
              );
            }
            pushBusy = false;
            render();
          })();
          return;
        }
        if (d.act === "sleep-open") {
          sleepOpen = !sleepOpen;
          return render();
        }
        if (d.act === "hist-all") {
          histAll = true;
          return render();
        }
        if (d.act === "hist-load") {
          const r = Array.isArray(hist) && hist.find((x) => +x.id === +d.id);
          if (!r) return;
          (async () => {
            const { data, error } = await sb.rpc("history_data", { p_id: +d.id });
            if (error || !data) return toast("Stand konnte nicht geladen werden");
            try {
              // Gleiche Vorschau + Bestätigung wie beim Datei-Backup
              bkp = {
                name: "Cloud-Sicherung",
                ...readBackup(JSON.stringify(data)),
              };
              bkp.meta = { exportedAt: r.saved_at, user: ME, version: 0 };
            } catch (_) {
              return toast("Dieser Stand ist leer");
            }
            render();
            window.scrollTo(0, 0);
          })();
          return;
        }
        if (d.act === "bk-cancel") {
          bkp = null;
          return render();
        }
        if (d.act === "bk-apply") {
          if (
            !bkp ||
            !confirm(
              "Wirklich alle aktuellen Einträge durch das Backup ersetzen?",
            )
          )
            return;
          S = fill(Object.assign(def(), bkp.data));
          bkp = null;
          replaceCloud = true;
          save();
          hist = null;
          setTimeout(loadHistory, 3000);
          toast("Backup eingespielt");
          return render();
        }
        if (d.act === "onb-skip") {
          S.onb.strava = Date.now();
          save();
          return go("today");
        }
        if (d.act === "cc-apply") {
          const m = S.chat[+d.k];
          if (!m || m.state !== "open") return;
          const { valid } = coachCheck(m.actions);
          if (!valid.length) return toast("Keine Vorschläge mehr anwendbar");
          applyCoach(valid);
          m.state = "applied";
          save();
          toast(
            `Plan angepasst (${valid.length} ${valid.length === 1 ? "Änderung" : "Änderungen"})`,
          );
          return render();
        }
        if (d.act === "cc-dismiss") {
          const m = S.chat[+d.k];
          if (m) {
            m.state = "dismissed";
            save();
          }
          return render();
        }
        if (d.act === "prof-who") {
          if (profWho === d.whoP) return;
          return transition("fade", () => {
            profWho = d.whoP;
            if (profWho === "partner") loadPartner();
            render();
          });
        }
        if (d.act === "cc-tab") {
          if (coachTab === d.tab) return;
          return transition("fade", () => {
            if (d.tab === "sore" && coachTab !== "sore") soreInitOpen();
            coachTab = d.tab;
            render();
          });
        }
        if (d.act === "cc-mode") {
          const ta = $("#cc-in");
          if (ta) ccDraft = ta.value;
          ccExplain = d.m === "explain";
          return render();
        }
        if (d.act === "explain") {
          const i = +d.i,
            p = dayPlan(i);
          if (!p) return;
          if (!coachReady() || ccBusy)
            return toast("Der Coach braucht den Cloud-Login", true);
          ccExplain = true;
          coachTab = "chat";
          go("coach");
          return sendCoach(coach.explainMessage(i, p));
        }
        if (d.act === "cc-clear") {
          if (!confirm("Chatverlauf löschen? Der Plan bleibt unverändert."))
            return;
          S.chat = [];
          ccErr = "";
          save();
          return render();
        }
        if (d.act === "cc-copy") {
          try {
            copyCoach(
              coach.buildCoachRequest({
                context: coachCtx(),
                chat: S.chat,
                message: $("#cc-in").value,
              }),
            );
          } catch (e) {
            toast(e.message);
          }
          return;
        }
      });
      document.addEventListener(
        "toggle",
        (e) => {
          const sec = e.target.dataset && e.target.dataset.sec;
          if (sec) {
            if (e.target.open) soreOpen.add(sec);
            else soreOpen.delete(sec);
          }
        },
        true,
      );
      document.addEventListener("change", async (e) => {
        const t = e.target;
        if (t.dataset.sz) {
          soreSave();
          return render();
        }
        if (t.dataset.file) {
          const f = t.files && t.files[0];
          t.value = "";
          if (!f) return;
          if (t.dataset.file === "plan") return importFile(f);
          if (t.dataset.file === "garmin") return garminConnect(f);
          if (t.dataset.file === "backup") {
            try {
              bkp = { name: f.name, ...readBackup(await f.text()) };
            } catch (err) {
              toast(err.message);
            }
            return render();
          }
          try {
            const n = mergeActs(strava.parseActivities(await f.text()));
            save();
            toast(
              n
                ? `${n} neue Aktivitäten importiert`
                : "Keine neuen Aktivitäten seit Planstart",
            );
          } catch (err) {
            toast(
              err.code === "csv_format"
                ? "Das ist keine Strava-activities.csv"
                : "Datei konnte nicht gelesen werden",
            );
          }
          return render();
        }
        if (t.dataset.c) {
          if (t.checked) S.done[t.dataset.c] = 1;
          else delete S.done[t.dataset.c];
          ciOpen = false;
          // Vorbelegtes Standardgewicht beim Abhaken als Wert übernehmen
          const pv = document.querySelector(`[data-v2="${t.dataset.c}"].pre`);
          if (t.checked && pv && !S.val[t.dataset.c]) {
            S.val[t.dataset.c] = pv.value;
            pv.classList.remove("pre");
          }
          save();
          const ex = t.closest(".ex");
          if (ex) ex.classList.toggle("is-done", t.checked);
          // Fortschritt ohne Neuaufbau aktualisieren (Fokus in Eingabefeldern bleibt)
          const card = t.closest(".card");
          if (card) {
            const all = card.querySelectorAll("[data-c]"),
              n = all.length,
              dn = [...all].filter((x) => x.checked).length;
            const bar = card.querySelector(".prog i");
            if (bar) bar.style.width = (dn / n) * 100 + "%";
            const s = card.querySelector(".prog+.sub");
            if (s) s.textContent = dn + " von " + n + " erledigt";
            if (t.checked && card.dataset.day)
              workoutFeedback(+card.dataset.day, t.dataset.c, dn === n);
            if (
              t.checked &&
              dn === n &&
              card.dataset.day &&
              card.classList.contains("hero") &&
              dayPlan(+card.dataset.day).k !== "rest"
            )
              closeCard(+card.dataset.day);
          }
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target,
          d = t.dataset;
        let redo = false;
        if (d.sz) {
          const v = +t.value,
            t0 = soreToday();
          S.sore[t0] = soreOwn(t0);
          S.sore[t0][d.sz] = v;
          // Anzeige ohne Neuaufbau aktualisieren, damit der Regler beim Ziehen nicht springt
          const it = t.closest(".sore-it");
          if (it) it.style.setProperty("--sc", soreFill(v));
          const l = $("#szv-" + d.sz);
          if (l) l.innerHTML = soreVal(v);
          t.setAttribute("aria-valuetext", `${v} von 10, ${sore.strength(v)}`);
          return;
        }
        if (t.id === "cc-in") {
          ccDraft = t.value;
          return;
        }
        if (d.n !== undefined) {
          S.notes[d.n] = t.value;
        } else if (d.v2) {
          S.val[d.v2] = t.value;
          t.classList.remove("pre");
        } else if (
          t.readOnly ||
          ((d.w || d.l || d.s || d.t) &&
            (view !== "profile" || profWho !== "me"))
        )
          return;
        else if (d.w) {
          const v = cleanWeight(t.value);
          if (v) S.weights[d.w] = v;
          else delete S.weights[d.w];
        } else if (d.l) {
          const [w, r] = d.l.split("|");
          if (w !== myCol()) return;
          S.tests.lauf[w][+r] = t.value;
          redo = true;
        } else if (d.s) {
          const [r, w] = d.s.split("|");
          if (w !== myCol()) return;
          S.tests.station[r] = S.tests.station[r] || {};
          S.tests.station[r][w] = t.value;
          redo = true;
        } else if (d.t) {
          S.tests.trans[+d.t] = t.value;
          redo = true;
        } else return;
        save();
        if (redo) {
          const id = d.l || d.s || d.t,
            attr = d.l ? "data-l" : d.s ? "data-s" : "data-t",
            p = t.selectionStart;
          const y = window.scrollY;
          render();
          window.scrollTo(0, y);
          const el = document.querySelector(`[${attr}="${id}"]`);
          if (el) {
            el.focus();
            try {
              el.setSelectionRange(p, p);
            } catch (_) {}
          }
        }
      });

      // Falls der Start scheitert, nicht ewig auf dem Splash hängen bleiben
      boot().catch((e) => {
        console.error(e);
        render();
      });
      // Tipp auf den Wochenbericht, während die App schon offen ist
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data && e.data.open === "review" && authed()) {
            rvW = null;
            go("review");
          }
        });
      if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
        navigator.serviceWorker.register("sw.js").catch(() => {});
    </script>
  </body>
</html>
