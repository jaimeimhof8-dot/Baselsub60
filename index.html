          rec = garmin.recoveryHint(S.garmin.well[isoD(NOW)]);
        const ci = inPlan ? readiness(S.checkin[keyI(TODAY)] || {}) : null;
        // Zahl, die beim Einblenden hochzählt; Endwert steht schon im HTML (ohne JS korrekt)
        const cnt = (v, dec = 0, suf = "") =>
          `<span class="cnt" data-to="${v}" data-dec="${dec}" data-suf="${esc(suf)}">${dec ? (+v).toFixed(dec).replace(".", ",") : Math.round(v)}${esc(suf)}</span>`;
        let h = `<div class="wide">${legacy ? "" : vhead("Dashboard", "", false, `${DAYSF[(NOW.getDay() + 6) % 7]}, ${fmt(NOW)}`)}`;

        // Ring 1 – Erholung: Garmin-Readiness (0–100); ohne Garmin die Check-in-Ampel
        const recLvl = LVL[rec.level] || null,
          lvl = worst(recLvl, ci);
        const r1 =
          w.readiness != null
            ? dash.ringGauge(w.readiness, {
                label: "Erholung",
                value: cnt(w.readiness),
                color: LVL_COL[recLvl] || "var(--muted)",
              })
            : dash.ringGauge(ci ? 100 : 0, {
                label: "Erholung",
                value: ci ? `<small>${LVL_TXT[ci]}</small>` : "–",
                sub: ci ? "" : "Check-in fehlt",
                color: LVL_COL[ci] || "var(--muted)",
              });
        // Ring 2 – Belastung: Anstrengung heute (RPE 1–10)
        const rpe = inPlan ? S.rpe[keyI(TODAY)] : null;
        const r2 = dash.ringGauge(rpe != null ? rpe * 10 : 0, {
          label: "Belastung",
          value: rpe != null ? cnt(rpe) : "–",
          sub:
            rpe != null
              ? "RPE heute"
              : inPlan && !isSession(TODAY)
                ? "Ruhetag"
                : "noch offen",
          color: "var(--lauf)",
        });
        // Ring 3 – Woche: erledigte Einheiten dieser Woche
        let wPlan = 0,
          wDone = 0;
        for (let x = curW * 7; x < curW * 7 + 7 && x <= LAST; x++)
          if (isSession(x)) {
            wPlan++;
            if (x <= T && trained(x)) wDone++;
          }
        const r3 = dash.ringGauge(wPlan ? (wDone / wPlan) * 100 : 0, {
          label: "Woche",
          value: `${cnt(wDone)}<small>/${wPlan}</small>`,
          color: "var(--accent)",
        });
        if (!legacy) h += `<div class="card dash-rings">${r1}${r2}${r3}</div>`;

        // Heute: Check-in (solange offen) bzw. eine klare Empfehlung + die wichtigsten Garmin-Werte
        if (inPlan) {
          const p = dayPlan(TODAY);
          const m = [
            ["HRV", w.hrv != null ? w.hrv + " ms" : null],
            ["Ruhepuls", w.rhr != null ? w.rhr : null],
            ["Body Battery", w.bb != null ? w.bb : null],
          ].filter((x) => x[1] != null);
          const mHtml = m.length
            ? `<div class="lstats mt-3" style="grid-template-columns:repeat(${m.length},1fr)">${m.map(([l, v]) => `<div><span>${l}</span><b>${esc(String(v))}</b></div>`).join("")}</div>`
            : "";
          // Check-in offen: hier nur eine Zeile (das Formular steht auf der Startseite); „Ausfüllen“ klappt es hier auf
          if (ciOpen) h += checkinCard(TODAY);
          else if (ciPending(TODAY))
            h += `<div class="card dash-today"><div class="row between"><h3>Heute</h3><button class="btn primary sm" data-act="ci-edit">Check-in ausfüllen</button></div>
      <p class="sub mt-2">${todayVerdict(recLvl, p)}</p>${mHtml}</div>`;
          else
            h += `<div class="card dash-today"><div class="row between"><h3>Heute</h3>${lvl ? `<span class="amp amp-${lvl}">${LVL_TXT[lvl]}</span>` : ""}</div>
      <p class="mt-2">${todayVerdict(lvl, p)}</p>${rec.why.length ? `<p class="sub mt-1">Garmin: ${esc(rec.why.join(", "))}</p>` : ""}${mHtml}
      <button class="btn ghost sm mt-3" data-act="ci-edit">Check-in ändern</button></div>`;
        }

        // Garmin-Kacheln: Wert von heute mit Verlaufslinie der letzten 7 Tage
        {
          const iso7 = [];
          for (let k = 6; k >= 0; k--)
            iso7.push(isoD(new Date(+NOW - k * dayMs)));
          const hm = (v) =>
            Math.floor(v) +
            ":" +
            String(Math.round((v - Math.floor(v)) * 60)).padStart(2, "0");
          const defs = [
            ["Schlaf", "sleepH", hm, " h"],
            ["HRV", "hrv", (v) => Math.round(v), " ms"],
            ["Ruhepuls", "rhr", (v) => Math.round(v), " bpm"],
            ["Body Battery", "bb", (v) => Math.round(v), ""],
          ];
          const tiles = defs
            .map(([l, k, f, u]) => {
              const cur = w[k];
              if (cur == null) return "";
              const ser = iso7
                .map((d) => (S.garmin.well[d] || {})[k])
                .map((v) => (v == null ? null : +v));
              const nums = ser.filter((v) => v != null);
              let line = "";
              if (nums.length > 1) {
                const lo = Math.min(...nums),
                  hi = Math.max(...nums),
                  rg = hi - lo || 1;
                const pts = ser
                  .map((v, i) =>
                    v == null
                      ? null
                      : (i * 90) / 6 +
                        "," +
                        (18 - ((v - lo) / rg) * 16).toFixed(1),
                  )
                  .filter(Boolean)
                  .join(" ");
                line = `<svg class="dg-spark" viewBox="0 0 90 20" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline></svg>`;
              }
              return `<div class="dg-tile"><span>${l}</span><b>${esc(String(f(+cur)))}<small>${u}</small></b>${line}</div>`;
            })
            .filter(Boolean);
          if (tiles.length && !legacy)
            h += `<div class="dg-tiles n${tiles.length}" aria-label="Garmin-Werte">${tiles.join("")}</div>`;
        }

        // Diese Woche: Anstrengung pro Tag + drei Zahlen
        const wk = dash.weekly(acts, idxOfIso, curW),
          cw = wk[curW] || { min: 0, runKm: 0, n: 0 };
        const wd = [];
        for (let x = curW * 7; x < curW * 7 + 7; x++) wd.push(x);
        const rpes = wd
          .map((x) => (x <= T ? S.rpe[keyI(x)] : null))
          .filter((v) => v != null)
          .map(Number);
        // Nur Zahlen, die es gibt: ohne Strava/Garmin-Aktivitäten keine 0,0 km
        const ws = [
          cw.runKm > 0 &&
            `<div><span>Laufen</span><b>${cnt(cw.runKm, 1, " km")}</b></div>`,
          cw.min > 0 &&
            `<div><span>Trainingszeit</span><b>${dash.hm(cw.min)}</b></div>`,
          `<div><span>Ø Anstrengung</span><b>${rpes.length ? cnt(rpes.reduce((a, b) => a + b, 0) / rpes.length, 1) : "–"}</b></div>`,
        ]
          .filter(Boolean)
          .slice(-3);
        h += `<div class="dash-title">Diese Woche</div><div class="card"><div class="lstats" style="grid-template-columns:repeat(${ws.length},1fr)">${ws.join("")}</div>
    <div class="sub mt-3">Anstrengung pro Tag (RPE 1–10)</div>
    ${
      !rpes.length
        ? `<p class="sub mt-2">Noch keine Einträge diese Woche. Nach jedem Training die Anstrengung (RPE) eintragen.</p>`
        : dash.barChart(
            wd.map((x, d) => {
              const v = x <= T ? S.rpe[keyI(x)] : null,
                p = dayPlan(x);
              return {
                label: DAYS[d],
                value: v != null ? +v : 0,
                hi: x === TODAY,
                tip: `${DAYSF[d]}: ${v != null ? "RPE " + v : "kein Eintrag"}${p ? " · " + p.t : ""}`,
              };
            }),
            {
              label: "Anstrengung pro Tag",
              fmt: (v) => Math.round(v) + "",
              height: 110,
            },
          )
    }</div>`;

        // Trends (4 Wochen): eine Kennzahl, Auswahl per Chip
        // Letzte 4 Wochen, aber nur ab Planstart (Werte von davor gehören nicht zum Plan)
        const days = [];
        for (let k = 27; k >= 0; k--) {
          const d = isoD(new Date(+NOW - k * dayMs));
          if (idxOfIso(d) >= 0) days.push(d);
        }
        const one = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
        const WELL = {
          readiness: [
            "Erholung",
            (v) => Math.round(v) + "",
            { min: 0, max: 100 },
            "Garmin Training Readiness (0–100). Über 60 = bereit für hartes Training.",
          ],
          hrv: [
            "HRV",
            (v) => Math.round(v) + " ms",
            {},
            "Herzfrequenzvariabilität in der Nacht. Fällt sie über Tage, braucht der Körper Erholung.",
          ],
          rhr: [
            "Ruhepuls",
            (v) => Math.round(v) + " bpm",
            {},
            "Steigt der Ruhepuls deutlich über deinen Schnitt, ist oft Erholung nötig.",
          ],
        };
        const have = Object.keys(WELL).filter((k) =>
          days.some((d) => S.garmin.well[d] && S.garmin.well[d][k] != null),
        );
        h += `<div class="dgrid"><section><div class="dash-title">Erholung im Verlauf</div>`;
        if (have.length) {
          const ksel = have.includes(dashWell) ? dashWell : have[0],
            [, wf, wo, wdesc] = WELL[ksel];
          const vals = days.map((d) => {
            const x = S.garmin.well[d];
            return x && x[ksel] != null ? +x[ksel] : null;
          });
          const avgOf = (a) => {
            const v = a.filter((x) => x != null);
            return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null;
          };
          const a7 = avgOf(vals.slice(-7)),
            a28 = avgOf(vals);
          h += `<div class="card" id="dc-well">${dchips(
            "well",
            have.map((k) => [k, WELL[k][0]]),
            ksel,
          )}
      <div class="lstats l2"><div><span>Ø 7 Tage</span><b>${a7 != null ? wf(a7) : "–"}</b></div><div><span>${days.length >= 28 ? "Ø 4 Wochen" : "Ø seit Start"}</span><b>${a28 != null ? wf(a28) : "–"}</b></div></div>
      ${dash.lineChart(
        days.map((d, i) => ({
          label: dmy(d),
          value: vals[i],
          tip: `${dmy(d)}: ${vals[i] == null ? "keine Daten" : wf(vals[i])}`,
        })),
        { fmt: wf, label: WELL[ksel][0], height: 120, ...wo },
      )}
      <p class="sub mt-2">${wdesc}</p></div>`;
        } else
          h += `<div class="card"><p class="sub">${S.garmin.conn ? "Noch keine Erholungswerte. Unter Menü → Strava / Garmin synchronisieren." : "Verbinde Garmin (Menü → Strava / Garmin), dann siehst du hier Erholung, Schlaf, HRV und Ruhepuls im Verlauf."}</p></div>`;
        h += `</section>${liftData().length ? `<section><div class="dash-title">Kraft</div>${liftCard()}</section>` : ""}</div>`;
        h += `<div class="dash-title">Schlaf</div>${sleepCard(days)}`;

        // Letzte Aktivitäten (3) + Weg zu allen Aktivitäten und zu den Tests
        const last = acts
          .slice()
          .sort((a, b) => ((a.start || a.date) < (b.start || b.date) ? 1 : -1))
          .slice(0, 3);
        if (last.length)
          h += `<div class="dash-title">Letzte Aktivitäten</div>`;
        h += last.length
          ? `<div class="list">${last
              .map((a) => {
                const i = idxOfIso(a.date),
                  p = i >= 0 && i <= LAST ? dayPlan(i) : null,
                  rs = repSummary(
                    a,
                    p && p.i ? p.i.find((t) => dash.parseReps(t)) || "" : "",
                  ),
                  d = isoToDate(a.date);
                return `<div class="act"><div class="d">${DAYS[(d.getDay() + 6) % 7]}<b>${d.getDate()}</b></div><div><b>${esc(a.name || strava.SPORT_LABEL[a.group])}</b> <span class="badge ${srcCls(a)}">${srcName(a)}</span><div class="sub">${esc(strava.summary(a))}</div>${rs ? `<div class="sub mt-1">Intervalle ${esc(rs)}</div>` : ""}</div></div>`;
              })
              .join("")}</div>`
          : "";
        h += `<div class="list dash-links"><button class="mi" data-v="strava"><span><b>Alle Aktivitäten</b><span class="sub">Strava / Garmin</span></span><span class="chev">›</span></button>
    <button class="mi" data-v="tests"><span><b>Tests &amp; Benchmarks</b><span class="sub">Pacing-Test, Stationen, Übergaben</span></span><span class="chev">›</span></button></div>`;
        return h + `</div>`;
      }

      /* Schlaf (Garmin): letzte Nacht mit Phasen, Schnitt 7 Tage, Verlauf 4 Wochen und alle Nächte als Tabelle.
   days = ISO-Daten der letzten 28 Tage (älteste zuerst). Zeigt nur, was Garmin liefert. */
      let sleepOpen = false; // Details (Nachtwerte, Verlauf, alle Nächte) aufgeklappt
      function sleepCard(allDays) {
        // Nur Nächte ab Planstart – was davor war, gehört nicht zum Plan
        const days = allDays.filter((d) => idxOfIso(d) >= 0);
        const W = S.garmin.well,
          nights = days.filter((d) => W[d] && W[d].sleepH != null);
        if (!nights.length)
          return `<div class="card"><p class="sub">${S.garmin.conn ? "Noch keine Schlafdaten. Unter Menü → Strava / Garmin synchronisieren." : "Verbinde Garmin (Menü → Strava / Garmin), dann siehst du hier deinen Schlaf: Dauer, Score, Phasen, Einschlaf- und Aufwachzeit."}</p></div>`;
        const one = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
        const hm = (m) =>
          m == null
            ? "–"
            : `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
        const avg = (k, list) => {
          const v = list.map((d) => W[d][k]).filter((x) => x != null);
          return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
        };
        const last = nights[nights.length - 1],
          n = W[last];
        const PH = [
          ["deep", "Tief", "var(--sl-deep)"],
          ["rem", "REM", "var(--sl-rem)"],
          ["light", "Leicht", "var(--sl-light)"],
          ["awake", "Wach", "var(--sl-awake)"],
        ];
        const tot = PH.reduce((a, [k]) => a + (n[k] || 0), 0);
        let h = `<div class="card"><div class="row between"><h3>Letzte Nacht</h3><span class="sub">${dmy(last)}${n.bed && n.wake ? ` · ${n.bed} – ${n.wake}` : ""}</span></div>
    <div class="lstats l2 mt-2"><div><span>Dauer</span><b>${one(n.sleepH)} h</b><span class="sl-avg" data-avg="sleepH"></span></div><div><span>Score</span><b>${n.sleepScore ?? "–"}</b><span class="sl-avg" data-avg="sleepScore"></span></div></div>`;
        if (tot)
          h += `<div class="sl-bar mt-3" role="img" aria-label="Schlafphasen">${PH.filter(
            ([k]) => n[k],
          )
            .map(
              ([k, l, c]) =>
                `<span style="flex:${n[k]};background:${c}" title="${l}: ${hm(n[k])} h"></span>`,
            )
            .join("")}</div>
    <div class="sl-leg">${PH.filter(([k]) => n[k] != null)
      .map(
        ([k, l, c]) =>
          `<span><i style="background:${c}"></i>${l} ${hm(n[k])} (${Math.round((n[k] / tot) * 100)} %)</span>`,
      )
      .join("")}</div>`;
        // Schnitt 7 Tage kompakt in einer Zeile, Rest auf Wunsch
        const w7 = nights.filter((d) => days.indexOf(d) >= days.length - 7);
        const a = (k, list, fmtf) => {
          const v = avg(k, list);
          return v == null ? "–" : fmtf(v);
        };
        // Dauer und Score tragen ihren 7-Nächte-Schnitt direkt darunter (kein zweites «Dauer» im Fliesstext)
        h = h
          .replace('<span class="sl-avg" data-avg="sleepH"></span>', `<span class="sl-avg">Ø 7 Nächte ${a("sleepH", w7, (v) => one(v) + " h")}</span>`)
          .replace('<span class="sl-avg" data-avg="sleepScore"></span>', `<span class="sl-avg">Ø 7 Nächte ${a("sleepScore", w7, (v) => Math.round(v))}</span>`);
        h += `<button class="btn ghost sm mt-2" data-act="sleep-open" aria-expanded="${sleepOpen}">${sleepOpen ? "Weniger anzeigen" : "Details und alle Nächte"}</button>`;
        if (!sleepOpen) return h + `</div>`;
        const night = [
          ["Atmung", n.resp != null ? one(n.resp) + " /min" : null],
          ["SpO₂", n.spo2 != null ? n.spo2 + " %" : null],
          ["Stress", n.sleepStress != null ? one(n.sleepStress) : null],
          ["Unruhig", n.restless != null ? n.restless + "×" : null],
          ["HRV", n.hrv != null ? n.hrv + " ms" : null],
          ["Ruhepuls", n.rhr != null ? n.rhr : null],
        ].filter((x) => x[1] != null);
        if (night.length)
          h += `<div class="lstats mt-3" style="grid-template-columns:repeat(${Math.min(3, night.length)},1fr)">${night.map(([l, v]) => `<div><span>${l}</span><b>${esc(String(v))}</b></div>`).join("")}</div>`;
        // Verlauf Schlafdauer seit Planstart (höchstens 4 Wochen)
        if (days.length > 1)
          h += `<div class="sub mt-3">Schlafdauer pro Nacht (Ziel 7–9 h)</div>${dash.barChart(
            days.map((d) => ({
              label: isoToDate(d).getDay() === 1 ? dmy(d).slice(0, 5) : "", // nur Montage beschriften
              value: W[d] && W[d].sleepH != null ? W[d].sleepH : 0,
              hi: d === last,
              tip: `${dmy(d)}: ${W[d] && W[d].sleepH != null ? one(W[d].sleepH) + " h" + (W[d].sleepScore != null ? " · Score " + W[d].sleepScore : "") : "keine Daten"}`,
            })),
            {
              label: "Schlafdauer",
              fmt: (v) => Math.round(v) + " h",
              height: 120,
            },
          )}`;
        if (nights.length > 7)
          h += `<p class="sub mt-2">Ø seit Planstart: ${a("sleepH", nights, (v) => one(v) + " h")} · Score ${a("sleepScore", nights, (v) => Math.round(v))}</p>`;
        // Alle Nächte (neueste zuerst)
        const list = nights.slice().reverse(),
          shown = list;
        h += `<div class="cap mt-4">Alle Nächte</div><div style="overflow-x:auto"><table class="well"><tr><th>Nacht</th><th>Dauer</th><th>Score</th><th>Tief</th><th>REM</th><th>Schlafzeit</th></tr>${shown
          .map((d) => {
            const x = W[d];
            return `<tr><td>${dmy(d).slice(0, 5)}</td><td>${one(x.sleepH)}</td><td>${x.sleepScore ?? "–"}</td><td>${hm(x.deep)}</td><td>${hm(x.rem)}</td><td>${x.bed && x.wake ? x.bed + "–" + x.wake : "–"}</td></tr>`;
          })
          .join("")}</table></div>`;
        if (nights.some((d) => W[d].deep == null))
          h += `<p class="sub mt-2">Phasen und Zeiten fehlen bei älteren Nächten. „Alles neu laden“ unter Strava / Garmin holt sie nach.</p>`;
        return h + `</div>`;
      }

      /* Dashboard-Animationen (GSAP), bewusst sparsam wie bei Whoop: die drei Ringe füllen sich, Zahlen zählen hoch.
   Alles andere steht sofort da (kein Verstecken bis zum Hineinscrollen – das ruckelt und kann Inhalte verschlucken).
   Nur beim Öffnen des Dashboards, nicht bei jedem Neuaufbau (Sync). „Bewegung reduzieren“ = keine Animation. */
      let dashSeen = false;
      function animateDash() {
        const g = window.gsap;
        if (!g) return;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const root = $("#main .wide");
        if (!root) return;
        root.querySelectorAll(".ring-fg").forEach((c) => {
          const C = +c.dataset.c;
          g.fromTo(
            c,
            { strokeDashoffset: C },
            {
              strokeDashoffset: C * (1 - +c.dataset.pct / 100),
              duration: 0.65,
              ease: "power3.out",
            },
          );
        });
        root.querySelectorAll(".dash-rings .cnt").forEach((el) => {
          const to = +el.dataset.to,
            dec = +el.dataset.dec,
            suf = el.dataset.suf || "",
            o = { v: 0 };
          if (isNaN(to)) return;
          g.to(o, {
            v: to,
            duration: 0.65,
            ease: "power3.out",
            onUpdate: () => {
              el.textContent =
                (dec ? o.v.toFixed(dec).replace(".", ",") : Math.round(o.v)) +
                suf;
            },
          });
        });
      } /* Nur das Diagramm einer Karte neu einblenden (nach Umschalten per Chip) */
      function animateChart(card) {
        const g = window.gsap;
        if (
          !g ||
          !card ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
        )
          return;
        const bars = card.querySelectorAll(".viz .bar");
        if (bars.length)
          g.from(bars, {
            scaleY: 0,
            transformOrigin: "50% 100%",
            duration: 0.55,
            stagger: 0.025,
            ease: "back.out(1.3)",
          });
        card.querySelectorAll(".viz .ln").forEach((p) => {
          const L = p.getTotalLength();
          g.fromTo(
            p,
            { strokeDasharray: L, strokeDashoffset: L },
            {
              strokeDashoffset: 0,
              duration: 0.8,
              ease: "power2.inOut",
              clearProps: "strokeDasharray,strokeDashoffset",
            },
          );
        });
        const ar = card.querySelectorAll(".viz .area, .viz .last");
        if (ar.length) g.from(ar, { opacity: 0, duration: 0.5, delay: 0.2 });
        const st = card.querySelectorAll(".lstats b");
        if (st.length)
          g.from(st, { opacity: 0, y: 6, duration: 0.3, stagger: 0.04 });
      }

      /* Tooltip für Diagramme: [data-tip] überfahren oder antippen */
      (function () {
        let tipEl = null,
          onEl = null;
        const show = (el, x, y) => {
          if (!tipEl) {
            tipEl = document.createElement("div");
            tipEl.id = "viztip";
            tipEl.setAttribute("role", "status");
            document.body.appendChild(tipEl);
          }
          tipEl.textContent = el.getAttribute("data-tip");
          tipEl.hidden = false;
          const r = tipEl.getBoundingClientRect();
          tipEl.style.left =
            Math.max(6, Math.min(innerWidth - r.width - 6, x - r.width / 2)) +
            "px";
          tipEl.style.top = Math.max(6, y - r.height - 12) + "px";
          if (onEl && onEl !== el) onEl.classList.remove("on");
          onEl = el;
          el.classList.add("on");
        };
        const hide = () => {
          if (tipEl) tipEl.hidden = true;
          if (onEl) {
            onEl.classList.remove("on");
            onEl = null;
          }
        };
        document.addEventListener("pointermove", (e) => {
          const el = e.target.closest && e.target.closest(".viz [data-tip]");
          if (el) show(el, e.clientX, e.clientY);
          else if (onEl) hide();
        });
        document.addEventListener("pointerdown", (e) => {
          const el = e.target.closest && e.target.closest(".viz [data-tip]");
          if (el) show(el, e.clientX, e.clientY);
          else hide();
        });
        document.addEventListener("scroll", hide, { passive: true });
      })();

      /* ---------- Wochen-Check (src/review.js) ----------
   Einmal pro Woche: Zahlen der Woche, Rennprognose aus den Tests, eigene Einschätzung → Ampel + Fokus für nächste Woche.
   Fällig ab Samstag bis Dienstag danach (Karte auf der Startseite), jederzeit über das Dashboard. */
      let rvW = null, // angezeigte Woche (null = fällige bzw. aktuelle)
        rvDraft = null; // eigene Einschätzung in Bearbeitung {w, feel, prog, pain, note}
      const LVL_LABEL = {
        green: "Auf Kurs",
        yellow: "Aufpassen",
        red: "Nachsteuern",
      };
      const RV_SR = { green: "Gut", yellow: "Achtung", red: "Kritisch" };
      function rvData(w) {
        const T = Math.min(TODAY, LAST),
          days = [];
        for (let i = w * 7; i < w * 7 + 7 && i <= T; i++) {
          const p = dayPlan(i);
          // Heute zählt erst als verpasst, wenn der Tag vorbei ist
          if (
            !p ||
            (i === TODAY && !trained(i)) ||
            (S.off[keyI(i)] && !trained(i))
          )
            continue;
          days.push({
            t: p.t,
            k: isSession(i) ? p.k : "rest",
            done: trained(i),
            rpe: S.rpe[keyI(i)],
            ready: readiness(S.checkin[keyI(i)] || {}),
          });
        }
        const wl = dash.weekly(Object.values(S.strava.acts), idxOfIso, w),
          extras = [];
        for (let i = w * 7; i < w * 7 + 7; i++)
          extras.push(...cleanExtras(S.extra[keyI(i)]));
        return review.weekCheck({
          days,
          wave: weekInfo(w).wave,
          load: wl[w],
          prev: wl.slice(Math.max(0, w - 3), w),
          extras,
          self: null, // nur Daten: keine Selbsteinschätzung
        });
      }
      /* Kurzfassung der laufenden Woche in S.wsnap – die Edge Function „weekly“ macht daraus den Push am Sonntag.
   Gibt true zurück, wenn sich etwas geändert hat. */
      function weekSnap() {
        if (TODAY < 0 || TODAY > LAST + 1 || !S.review) return false;
        const w = Math.floor(Math.min(TODAY, LAST) / 7),
          r = rvData(w),
          fc = rvForecast();
        const sl = [];
        for (let k = 0; k < 7; k++) {
          const x = S.garmin.well[isoD(new Date(+NOW - k * dayMs))];
          if (x && x.sleepH != null) sl.push(x.sleepH);
        }
        const snap = {
          w,
          level: r.level,
          done: r.done,
          planned: r.planned,
          rpe: r.avgRpe != null ? Math.round(r.avgRpe * 10) / 10 : null,
          sleep: sl.length
            ? Math.round((sl.reduce((a, b) => a + b, 0) / sl.length) * 10) / 10
            : null,
          fc: fc && fc.total ? Math.round(fc.total) : null,
          focus: r.focus[0] || "",
          reviewed: !!(S.review[w] && S.review[w].at),
        };
        if (stable(snap) === stable(S.wsnap || null)) return false;
        S.wsnap = snap;
        return true;
      }
      /* ---------- Wochenbericht per Push (Edge Function „weekly“, supabase/push.sql) ---------- */
      const PUSH_OK =
        "serviceWorker" in navigator &&
        "PushManager" in window &&
        "Notification" in window &&
        !!(window.HX_CONFIG || {}).vapidPublicKey;
      let pushState = null, // null = unbekannt, "on" | "off" | "denied"
        pushBusy = false;
      async function pushSub() {
        const reg = await navigator.serviceWorker.ready;
        return reg.pushManager.getSubscription();
      }
      /* Function „weekly“ aufrufen; das Abo geht immer mit, damit es dem angemeldeten Konto gehört
         (über die Function, weil ein Abo eines anderen Kontos auf demselben Gerät per RLS nicht übernommen werden kann) */
      async function pushInvoke(action, sub) {
        const j = sub ? sub.toJSON() : null;
        const { data, error } = await sb.functions.invoke("weekly", {
          body: {
            action,
            sub: j
              ? {
                  endpoint: j.endpoint,
                  p256dh: j.keys.p256dh,
                  auth: j.keys.auth,
                }
              : undefined,
          },
        });
        if (error) {
          // Grund aus der Antwort der Function lesen (no_subscription, forbidden …)
          const r = await (error.context && error.context.json
            ? error.context.json().catch(() => null)
            : null);
          throw new Error((r && r.error) || error.message || "http");
        }
        return data;
      }
      async function pushCheck() {
        if (!PUSH_OK) return;
        const sub = await pushSub().catch(() => null);
        pushState =
          Notification.permission === "denied" ? "denied" : sub ? "on" : "off";
        if (view === "review") render();
      }
      async function pushOn() {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          pushState = perm === "denied" ? "denied" : "off";
          return toast("Ohne Erlaubnis keine Push-Nachrichten", true);
        }
        const reg = await navigator.serviceWorker.ready;
        const key = Uint8Array.from(
          atob(CFG.vapidPublicKey.replace(/-/g, "+").replace(/_/g, "/")),
          (c) => c.charCodeAt(0),
        );
        const sub =
          (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: key,
          }));
        await pushInvoke("subscribe", sub);
        lsSet("hx:push-on", "1");
        pushState = "on";
        toast("Wochenbericht ist aktiv – jeden Sonntag um 18 Uhr");
      }
      async function pushOff() {
        const sub = await pushSub();
        if (sub) {
          await sb.from("push_subs").delete().eq("endpoint", sub.endpoint); // nur eigene Abos (RLS)
          await sub.unsubscribe();
        }
        lsDel("hx:push-on");
        pushState = "off";
        toast("Wochenbericht ausgeschaltet");
      }
      function pushCard() {
        let h = `<div class="card"><div class="row between"><h3>Push am Sonntag</h3>${pushState === "on" ? `<span class="amp amp-green">Aktiv</span>` : ""}</div>${pushState === "on" ? "" : `<p class="sub mt-1">Jeden Sonntag um 18 Uhr dein Wochenrückblick als Nachricht aufs Handy.</p>`}`;
        if (!(sb && USER))
          return (
            h + `<p class="sub mt-2">Nur mit Anmeldung verfügbar.</p></div>`
          );
        if (!PUSH_OK)
          return (
            h +
            `<p class="sub mt-2">Dieser Browser kann keine Push-Nachrichten empfangen. Auf Android: in Chrome öffnen und über das Menü „App installieren“ wählen.</p></div>`
          );
        if (pushState === null) {
          pushCheck();
          return h + `<p class="sub mt-2">Prüfe …</p></div>`;
        }
        if (pushState === "denied")
          return (
            h +
            `<p class="sub mt-2">Benachrichtigungen sind für diese Seite blockiert. In den Browser- bzw. App-Einstellungen unter „Benachrichtigungen“ erlauben, dann hier einschalten.</p></div>`
          );
        if (pushState === "on")
          return (
            h +
            `<div class="grid2 mt-3"><button class="btn" data-act="push-test" ${pushBusy ? "disabled" : ""}>Test senden</button><button class="btn ghost" data-act="push-off" ${pushBusy ? "disabled" : ""}>Ausschalten</button></div></div>`
          );
        return (
          h +
          `<div class="btns"><button class="btn primary" data-act="push-on" ${pushBusy ? "disabled" : ""}>Einschalten</button></div></div>`
        );
      }
      /* Erste Sitzung in einer neuen Planwoche (pro Gerät gemerkt): nur dann erscheint der offene Check der Vorwoche */
      const RV_FIRST = (() => {
        const w = Math.floor(Math.max(0, Math.min(TODAY, LAST)) / 7),
          seen = lsGet("rv-open-w");
        if (seen === String(w)) return false;
        lsSet("rv-open-w", String(w));
        return seen !== null;
      })();
      const rvDueW = () =>
        TODAY >= 0 && TODAY <= LAST + 2
          ? review.reviewDue(Math.min(TODAY, LAST), S.review, RV_FIRST)
          : null;
      function reviewCard() {
        const w = rvDueW();
        if (w == null) return "";
        const r = rvData(w);
        return `<div class="card tight"><div class="row between"><h3>Wochenrückblick Woche ${w + 1}</h3><span class="amp amp-${r.level}">${LVL_LABEL[r.level]}</span></div>
    <p class="sub mt-2">${r.done}/${r.planned} Einheiten · Laufumfang, Prognose und Fokus der Woche.</p><button class="btn primary sm mt-3" data-act="rv-open" data-w="${w}">Ansehen →</button></div>`;
      }
      let rvEdit = false; // Einschätzung einer abgeschlossenen Woche wieder bearbeiten
      const RV_HEAD = {
        green: "Auf Kurs – weiter so.",
        yellow: "Gute Woche mit ein paar Punkten zum Beobachten.",
        red: "Diese Woche nachsteuern.",
      };
      /* Tage einer Woche für den Streifen: Status, Anstrengung, Art */
      function rvDays(w) {
        const out = [];
        for (let d = 0; d < 7; d++) {
          const i = w * 7 + d,
            p = dayPlan(i),
            sess = !!p && isSession(i),
            rpe = S.rpe[keyI(i)];
          const st =
            !sess || (S.off[keyI(i)] && !trained(i))
              ? "rest"
              : trained(i)
                ? "done"
                : i < TODAY
                  ? "miss"
                  : "open";
          out.push({
            d,
            i,
            t: p ? p.t : "",
            st,
            rpe: rpe != null && rpe !== "" ? +rpe : null,
            today: i === TODAY,
          });
        }
        return out;
      }
      const RV_ST = {
        done: "erledigt",
        miss: "verpasst",
        rest: "Ruhetag",
        open: "offen",
      };
      function vReview(legacy) {
        const cur = Math.max(
          0,
          Math.min(NWEEKS - 1, Math.floor(Math.min(TODAY, LAST) / 7)),
        );
        const w = rvW != null ? rvW : (rvDueW() ?? cur);
        const r = rvData(w),
          wi = weekInfo(w);
        // Nur Daten, keine Fragen: eine vergangene Woche (oder die laufende ab Samstag) gilt beim Ansehen als abgeschlossen
        if (
          TODAY >= 0 &&
          (w < cur || (w === cur && dow(TODAY) >= 5)) &&
          !(S.review[w] && S.review[w].at)
        ) {
          const fc0 = rvForecast();
          S.review[w] = {
            at: Date.now(),
            level: r.level,
            ...(fc0 && fc0.total ? { fc: Math.round(fc0.total) } : {}),
          };
          save();
        }
        let h = legacy
          ? `<div class="rv">`
          : `<div class="narrow rv"><button class="back" data-back>‹ Zurück</button>`;
        if (!legacy)
          h += `<div class="wkwrap"><div class="vh"><div class="kick">Wochenrückblick · ${fmt(dateFromIdx(w * 7))} – ${fmt(dateFromIdx(w * 7 + 6))}</div><h2>Woche ${w + 1}</h2><div class="sub">${esc(wi.wave)} · ${blockLabel(wi.block)}</div></div>
    <div class="wk-nav"><button data-act="rv-wk" data-d="-1" aria-label="Vorherige Woche" ${w === 0 ? "disabled" : ""}><span aria-hidden="true">‹</span><span class="wk-lbl" aria-hidden="true">${w > 0 ? " Woche " + w : ""}</span></button><button data-act="rv-wk" data-d="1" aria-label="Nächste Woche" ${w >= cur ? "disabled" : ""}><span class="wk-lbl" aria-hidden="true">${w < cur ? "Woche " + (w + 2) + " " : ""}</span><span aria-hidden="true">›</span></button></div></div>`;

        // 1. Ergebnis: Ring (Einheiten) + Urteil + Punkte, die Aufmerksamkeit brauchen
        const warn = r.notes.filter((n) => n.level !== "green");
        if (legacy && warn.length)
          h += `<div class="card"><h3>Achtung</h3><ul class="rv-notes mt-2">${warn.map((n) => `<li class="rv-${n.level}"><span class="vh-only">${RV_SR[n.level]}: </span>${esc(n.text)}</li>`).join("")}</ul></div>`;
        if (!legacy)
          h += `<div class="card rv-hero">${dash.ringGauge(
            r.planned ? (r.done / r.planned) * 100 : 0,
            {
              label: "Einheiten",
              value: `${r.done}<small>/${r.planned}</small>`,
              color: "var(--accent)",
              size: 104,
            },
          )}<div><span class="rv-st rv-${r.level}"><i aria-hidden="true"></i>${LVL_LABEL[r.level]}</span><p class="rv-verdict">${RV_HEAD[r.level]}</p></div>
    ${warn.length ? `<ul class="rv-notes">${warn.map((n) => `<li class="rv-${n.level}"><span class="vh-only">${RV_SR[n.level]}: </span>${esc(n.text)}</li>`).join("")}</ul>` : ""}</div>`;

        // 2. Die Tage
        const days = rvDays(w);
        if (!legacy)
          h += `<div class="card"><div class="cap">Tage</div><div class="rv-days">${days
            .map(
              (x) =>
                `<div class="rv-day rv-${x.st}${x.today ? " today" : ""}" title="${esc(x.t)}"><span>${DAYS[x.d]}</span><i aria-hidden="true"></i><b>${x.rpe != null ? x.rpe : "–"}</b><span class="vh-only">${esc(x.t || "frei")}: ${RV_ST[x.st]}${x.rpe != null ? ", RPE " + x.rpe : ""}</span></div>`,
            )
            .join(
              "",
            )}</div><div class="rv-leg"><span class="rv-done"><i></i>erledigt</span><span class="rv-miss"><i></i>verpasst</span><span class="rv-rest"><i></i>Ruhe</span><span>Zahl = RPE</span></div></div>`;

        // 3. Kennzahlen: Laufumfang (Strava/Garmin) gegen Plan, Anstrengung, Schlaf, Zusatz
        let slS = 0,
          slN = 0;
        for (const x of days) {
          const g = S.garmin.well[keyI(x.i)];
          if (g && g.sleepH != null) ((slS += +g.sleepH), slN++);
        }
        const one = (v) => (+v).toFixed(1).replace(".", ",");
        const sl = slN ? slS / slN : null;
        const acts = Object.values(S.strava.acts),
          wl = dash.weekly(acts, idxOfIso, w),
          hasRuns = acts.some((a) => a.group === "run");
        const rc = hasRuns
          ? review.runCheck(wl[w] ? wl[w].runKm : 0, {
              plan: wi.km || null,
              prev: w > 0 && wl[w - 1] ? wl[w - 1].runKm : null,
            })
          : null;
        const kpi = (label, val, hint, lvl) =>
          `<div class="kpi"><span>${lvl ? `<i class="rv-dot rv-${lvl}" aria-hidden="true"></i>` : ""}${label}</span><b>${val}</b><em>${hint}</em></div>`;
        h += `<div class="rv-kpis">${kpi(
          "Laufen",
          rc ? one(rc.km) + " km" : "–",
          !rc
            ? "Garmin oder Strava verbinden"
            : [
                rc.plan ? `Plan ${rc.plan} km` : "",
                rc.ramp != null
                  ? `${rc.ramp >= 0 ? "+" : "−"}${Math.abs(Math.round(rc.ramp * 100))} % zur Vorwoche`
                  : "",
              ]
                .filter(Boolean)
                .join(" · ") || "aus Garmin/Strava",
          rc && rc.level !== "green" ? rc.level : "",
        )}${kpi(
          "Ø Anstrengung",
          r.avgRpe != null ? one(r.avgRpe) : "–",
          `Grenze ${one(r.rpeMax)} (${esc(wi.wave)})`,
          r.avgRpe == null
            ? ""
            : r.avgRpe > r.rpeMax + 1
              ? "red"
              : r.avgRpe > r.rpeMax
                ? "yellow"
                : "",
        )}${kpi(
          "Ø Schlaf",
          sl != null ? one(sl) + " h" : "–",
          sl != null
            ? "Ziel 7–9 h"
            : S.garmin.conn
              ? "keine Garmin-Daten"
              : "Garmin verbinden",
          sl == null ? "" : sl >= 7 ? "" : sl >= 6.3 ? "yellow" : "red",
        )}${kpi("Zusatz", r.extraN ? `${r.extraN}×` : "0", r.extraN ? `${r.extraMin}′ insgesamt` : "freiwillig", "")}</div>`;
        if (rc && rc.ramp != null && rc.ramp > 0.2)
          h += `<p class="sub rv-tip">Laufumfang ist um mehr als 20 % gestiegen. Sehnen passen sich langsamer an als die Ausdauer, nächste Woche nicht weiter steigern.</p>`;

        // 4. Rennprognose: Gesamtzeit und genaue Aufschlüsselung gegen das Rennmodell
        h += forecastCard(cur);

        // 5. Nächste Woche
        h += `<div class="card"><h3>Nächste Woche</h3><ul class="rv-focus mt-2">${r.focus.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>`;

        // 6. Saison
        let cells = "";
        for (let x = 0; x < NWEEKS; x++) {
          const rv = S.review[x],
            lv = rv && rv.at ? rv.level || "green" : "";
          const lab = `Woche ${x + 1}: ${lv ? LVL_LABEL[lv] : x <= cur ? "offen" : "kommt noch"}`;
          cells +=
            x <= cur
              ? `<button class="rv-wk-c ${lv ? "rv-" + lv : "rv-none"}${x === w ? " on" : ""}" data-act="rv-go" data-w="${x}" aria-label="${lab}" aria-current="${x === w}">${x + 1}</button>`
              : `<span class="rv-wk-c rv-future" aria-label="${lab}">${x + 1}</span>`;
        }
        if (!legacy)
          h += `<div class="card"><div class="cap">Saison</div><div class="rv-season">${cells}</div></div>`;
        return h + pushCard() + `</div>`;
      }

      /* ---------- Backup ---------- */
      let bkp = null; // eingelesenes Backup, wartet auf Bestätigung: {name, data, meta, summary}
      function vBackup() {
        const cloud = sb && USER;
        let lastBk = 0;
        try {
          lastBk = +localStorage.getItem("hx_lastbackup") || 0;
        } catch {}
        let h = `<div class="narrow">${vhead("Backup", "Alle Einträge als Datei sichern, z. B. vor einem Handywechsel.", true)}`;
        h += `<div class="bk-status ${lastBk ? "ok" : "warn"}" role="status"><span class="bk-ic" aria-hidden="true">${lastBk ? "✓" : "!"}</span><span><b>${lastBk ? "Letztes Backup: " + new Date(lastBk).toLocaleDateString("de-CH", { day: "numeric", month: "short", year: "numeric" }) : "Noch kein Backup auf diesem Gerät"}</b><span class="sub">${cloud ? "Angemeldet: Einträge liegen zusätzlich in der Cloud." : "Nicht angemeldet: Daten liegen nur auf diesem Gerät."}</span></span></div>`;
        h += `<div class="card"><b>Sichern</b><p class="sub mt-1">Haken, Werte, Notizen, Check-ins, Umplanungen, Tests und Strava-Aktivitäten als <b>.json</b>. Ohne Zugangsdaten.</p>
    <div class="grid2 mt-4"><button class="btn primary" data-act="bk-export">Datei sichern</button><button class="btn" data-act="bk-share">Als Text teilen</button></div></div>`;
        if (bkp) {
          const s = bkp.summary,
            m = bkp.meta;
          h += `<div class="card"><b>Backup einspielen?</b><p class="sub mt-1">${esc(bkp.name)}${m.exportedAt ? ` · erstellt ${new Date(m.exportedAt).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })}` : ""}${m.user ? ` · von ${esc(m.user)}` : ""}</p>
      <ul class="sub mt-2"><li>${s.done} abgehakte Übungen, ${s.notes} Notizen, ${s.rpe} RPE-Werte</li><li>${s.checkins} Check-ins, ${s.changes} Umplanungen/Anpassungen</li><li>${s.strava} Strava-Aktivitäten${s.plan ? ", importierter Plan" : ""}</li></ul>
      ${m.user && m.user !== ME ? `<div class="target bad">Dieses Backup stammt von ${esc(m.user)}, du bist als ${esc(ME)} angemeldet.</div>` : ""}
      <div class="target bad">Ersetzt alle aktuellen Einträge${cloud ? " – auf diesem Gerät und in der Cloud" : " auf diesem Gerät"}. Tipp: vorher ein Backup exportieren.</div>
      <div class="grid2 mt-4"><button class="btn primary" data-act="bk-apply">Ersetzen</button><button class="btn" data-act="bk-cancel">Abbrechen</button></div></div>`;
        } else {
          h += `<div class="card"><b>Wiederherstellen</b><p class="sub mt-1">Eine gesicherte <b>.json</b> wählen. Vor dem Überschreiben siehst du, was drin ist.</p>
      <div class="btns"><label class="btn file">Datei wählen<input type="file" accept=".json,application/json,text/plain" data-file="backup"></label></div></div>`;
        }
        if (cloud && !bkp) h += historyCard();
        return h + `</div>`;
      }
      /* Cloud-Verlauf (supabase/history.sql): der Server sichert vor Änderungen automatisch den alten Stand.
   hist: null = noch nicht geladen, "err" = nicht eingerichtet/offline, sonst [{id, saved_at, entries, has_plan}] */
      let hist = null,
        histAll = false;
      async function loadHistory() {
        if (!sb || !USER) return;
        const { data, error } = await sb.rpc("my_history");
        hist = error ? "err" : data || [];
        if (view === "backup") render();
      }
      function historyCard() {
        let h = `<div class="card"><b>Früheren Stand wiederherstellen</b><p class="sub mt-1">Die Cloud sichert automatisch deinen Stand (höchstens stündlich und immer vor grossen Änderungen, 45 Tage lang). Jetzt: ${countEntries(S)} Einträge.</p>`;
        if (hist === null) return h + `<p class="sub mt-2">Lädt …</p></div>`;
        if (hist === "err")
          return (
            h +
            `<p class="sub mt-2">Nicht verfügbar. Entweder offline oder der Cloud-Verlauf ist noch nicht eingerichtet (<code>supabase/history.sql</code> im SQL Editor ausführen).</p></div>`
          );
        if (!hist.length)
          return (
            h +
            `<p class="sub mt-2">Noch keine Sicherung vorhanden. Die erste entsteht mit der nächsten Änderung.</p></div>`
          );
        const list = histAll ? hist : hist.slice(0, 8);
        h += `<div class="list mt-3">${list
          .map(
            (r) =>
              `<div class="xrow"><span>${new Date(r.saved_at).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })} · ${r.entries} Einträge${r.has_plan ? " · eigener Plan" : ""}</span><button class="btn sm" data-act="hist-load" data-id="${+r.id}">Ansehen</button></div>`,
          )
          .join("")}</div>`;
        if (hist.length > list.length)
          h += `<button class="btn ghost sm mt-2" data-act="hist-all">Alle ${hist.length} anzeigen</button>`;
        return h + `</div>`;
      }
      function exportBackup() {
        const blob = new Blob(
          [JSON.stringify(makeBackup(S, { user: ME }), null, 1)],
          { type: "application/json" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = backupFileName();
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        try {
          localStorage.setItem("hx_lastbackup", String(Date.now()));
        } catch {}
        toast("Backup heruntergeladen");
        if (view === "backup") render();
      }

      /* ---------- Coach-Chat ----------
   Plan-Kontext + Nachricht → Edge Function "coach" (Claude) → Antwort + Vorschläge.
   Vorschläge werden geprüft und erst nach Tipp auf "Übernehmen" angewendet. */

        }

          : -1;
        const svg = nums.length
          ? `<svg viewBox="0 0 342 170" width="100%" role="img" aria-label="${alab} vom ${dd(days[0])} bis ${dd(days[days.length - 1])}${nums.length ? `, zuletzt ${fm(nums[nums.length - 1])}` : ""}"><g stroke="rgba(255,255,255,.06)" stroke-width="1"><path d="M36 10H334M36 70H334M36 130H334"/></g><g font-size="11" fill="#9a9ba3" font-family="IBM Plex Sans,sans-serif"><text x="0" y="14">${Math.round(hi)}</text><text x="6" y="74">${Math.round((hi + lo) / 2)}</text><text x="12" y="134">${Math.round(lo)}</text><text x="30" y="156">${dd(days[0])}</text><text x="300" y="156">${dd(days[days.length - 1])}</text></g>${segs
              .filter((s) => s.length > 1)
              .map(
                (s) =>
                  `<path d="${path(s)}L${X(s[s.length - 1][0])} 130L${X(s[0][0])} 130Z" fill="#64a8ff" fill-opacity=".12"/>`,
              )
              .join(
                "",
              )}${segs.map((s) => `<path d="${path(s)}" fill="none" stroke="#64a8ff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}${lastPt >= 0 ? `<circle cx="${X(lastPt)}" cy="${Y(ser[lastPt])}" r="5" fill="#64a8ff"/>` : ""}</svg>`
          : `<p class="s7-note">Noch keine Garmin-Werte.</p>`;
        const verlauf = `<section class="s6-card s7-vl" aria-label="Erholung im Verlauf"><span class="s6-kick">Erholung im Verlauf</span><div class="seg" role="tablist" aria-label="Verlauf">${Object.entries(
          SER,
        )
          .map(
            ([k, v]) =>
              `<button type="button" role="tab" data-act="dash-ser" data-k="${k}" class="${k === sk ? "on" : ""}" aria-selected="${k === sk}">${v[0]}</button>`,
          )
          .join(
            "",
          )}</div><div class="vl-av"><div><span class="s6-kick">Ø 7 Tage</span><b>${last7.length ? fm(mean(last7)) : "–"}</b></div><div><span class="s6-kick">Ø seit Start</span><b>${nums.length ? fm(mean(nums)) : "–"}</b></div></div>${svg}</section>`;
        const head = s6Head(
          `Saison · Woche ${curW + 1} von ${NWEEKS}`,
          "Dashboard",
          "",
        );
        /* Was früher unter „Weitere Auswertungen“ stand, steht jetzt offen im Dashboard: Kraft und Schlaf links, Aktivitäten und Wege rechts. Heute, Woche und Erholungsverlauf gibt es oben schon. */
        const rest = (() => {
          const t = document.createElement("template");
          t.innerHTML = vDashboard(true);
          const kids = [
            ...((t.content.querySelector(".wide") || {}).children || []),
          ];
          const at = kids.findIndex((n) => n.classList.contains("dgrid"));
          if (at < 0) return { left: "", right: "" };
          const kraft =
            ([...kids[at].querySelectorAll("section")][1] || {}).outerHTML ||
            "";
          const after = kids.slice(at + 1);
          const title = (re) =>
            after.findIndex(
              (n) =>
                n.classList.contains("dash-title") && re.test(n.textContent),
            );
          const si = title(/Schlaf/),
            ai = title(/Aktivit/);
          const li = after.findIndex((n) => n.classList.contains("dash-links"));
          const cut = ai >= 0 ? ai : li;
          const html = (from, to) =>
            from < 0
              ? ""
              : after
                  .slice(from, to < 0 ? undefined : to)
                  .map((n) => n.outerHTML)
                  .join("");
          return { left: html(si, cut) + kraft, right: html(cut, -1) };
        })();
        return `<div class="s6 s6-dash s7-dash">${head}<div class="s7-cols"><div class="s7-c">${ciOpen && inPlan ? s6Checkin(TODAY) : ""}${heute}${tiles}<div class="s7-rest">${rest.left}</div></div><div class="s7-c">${verlauf}<div class="s7-rest">${rest.right}</div></div></div></div>`;
      }
      /* ---- Wochenrückblick ---- */
      const S6_SEASON_H = [
        40, 60, 80, 30, 50, 65, 85, 35, 55, 70, 90, 40, 60, 75, 100, 45, 30, 20,
      ];
      function s6Review() {
        const cur = Math.max(
          0,
          Math.min(NWEEKS - 1, Math.floor(Math.min(TODAY, LAST) / 7)),
        );
        const w = rvW != null ? rvW : (rvDueW() ?? cur);
        const r = rvData(w),
          wi = weekInfo(w);
        // Nur Daten, keine Fragen: eine vergangene Woche (oder die laufende ab Samstag) gilt beim Ansehen als abgeschlossen
        if (
          TODAY >= 0 &&
          (w < cur || (w === cur && dow(TODAY) >= 5)) &&
          !(S.review[w] && S.review[w].at)
        ) {
          const fc0 = rvForecast();
          S.review[w] = {
            at: Date.now(),
            level: r.level,
            ...(fc0 && fc0.total ? { fc: Math.round(fc0.total) } : {}),
          };
          save();
        }
        const D = s6WeekData(w),
          range = `${fmt(dateFromIdx(w * 7))} – ${fmt(dateFromIdx(w * 7 + 6))}`,
          sub = `${esc(wi.wave)} · Block ${esc(wi.block)}`,
          chev = (d) =>
            `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
        const arrows = `<div class="s6-round"><button type="button" data-act="rv-wk" data-d="-1" aria-label="Vorherige Woche" ${w === 0 ? "disabled" : ""}>${chev("M15 6l-6 6 6 6")}</button><button type="button" data-act="rv-wk" data-d="1" aria-label="Nächste Woche" ${w >= cur ? "disabled" : ""}>${chev("M9 6l6 6-6 6")}</button></div>`;
        const top = `<div class="s6-rv-top">${S6_BACK}${arrows}</div>`;
        const title = `<div class="s6-rv-title"><span class="s6-kick">Wochenrückblick · ${range}</span><h1 class="s6-h1">Woche ${w + 1}</h1><span class="s6-sub sb">${sub}</span></div>`;
        // Urteil
        const warn = r.notes.filter((n) => n.level !== "green");
        const green = r.level === "green";
        const verdict = `<section class="s6-card s6-verdict" aria-label="Urteil"><span class="s6-badge${green ? " green" : ""}">${green ? "✓" : "!"} ${LVL_LABEL[r.level]} · ${r.done}/${r.planned} erledigt</span><h2>${RV_HEAD[r.level]}</h2>${green ? "" : `<button type="button" class="s6-btn gold" data-act="rv-fix">Nachholen planen</button>`}</section>`;
        // Prognose
        const fc = rvForecast();
        const lo = 2700,
          hi = 4200;
        let big = "–",
          fcap = `Noch keine Testwerte. <button type="button" data-v="profile">Tests eintragen</button>`,
          fill = "";
        if (fc && fc.total) {
          const gap = fc.total - review.GOAL_S;
          big = mmss(fc.total);
          fcap = `${gap > 0 ? mmss(gap) + " zu langsam" : mmss(-gap) + " Puffer"} · berechnet aus Tests und Trainingswerten`;
          fill = `<u style="width:${Math.max(0, Math.min(100, ((fc.total - lo) / (hi - lo)) * 100)).toFixed(1)}%;background:${gap > 0 ? "var(--warn)" : "var(--ok)"}"></u>`;
        }
        const forecast = `<section class="s6-card s6-fc" aria-label="Prognose"><div class="row"><div><span class="s6-kick">Prognose Basel</span><span class="big">${big}</span></div><div><span class="s6-kick">Ziel</span><span class="ziel">&lt; 60:00</span></div></div><div class="bar">${fill}<b aria-hidden="true"></b></div><span class="fcap">${fcap}</span></section>`;
        // Tage
        const days = rvDays(w);
        const dayCells = days
          .map((x) => {
            const p = dayPlan(x.i),
              k = p ? p.k : "rest";
            const bot =
              x.st === "done"
                ? `<span class="b">${x.rpe != null ? x.rpe : "✓"}</span>`
                : x.st === "miss"
                  ? `<span class="b m">✕</span><span class="b d">verpasst</span>`
                  : x.st === "rest"
                    ? `<span class="b">Ruhe</span>`
                    : x.today
                      ? `<span class="b m">—</span><span class="b d">heute</span>`
                      : `<span class="b">—</span>`;
            return `<div class="${x.st}${x.today ? " today" : ""}" style="--kc:var(--${k})"><span>${DAYS[x.d]}</span><i aria-hidden="true"></i>${bot}</div>`;
          })
          .join("");
        const daysSec = `<section class="s6-card s6-rv-days" aria-label="Tage" style="display:flex;flex-direction:column"><span class="s6-kick s6-rv-d">Tage · Zahl = RPE</span><div class="s6-rvd">${dayCells}</div></section>`;
        // Saison (Desktop)
        let bars = "";
        for (let x = 0; x < NWEEKS; x++) {
          const rv = S.review[x],
            h = S6_SEASON_H[x % S6_SEASON_H.length],
            lab = `Woche ${x + 1}: ${rv && rv.at ? LVL_LABEL[rv.level || "green"] : x <= cur ? "offen" : "kommt noch"}`;
          bars +=
            x <= cur
              ? `<button type="button" class="${x === w ? "on" : ""}" style="height:${h}%" data-act="rv-go" data-w="${x}" aria-label="${lab}" aria-current="${x === w}"></button>`
              : `<span style="height:${h}%" aria-label="${lab}"></span>`;
        }
        const season = `<section class="s6-card s6-season" aria-label="Saison"><div class="hd"><span class="s6-kick">Saison</span><span>Woche ${w + 1} von ${NWEEKS}</span></div><div class="bars">${bars}</div><span class="snote">Höhe = Blockphase: moderat → hart → Spitzenreiz → Deload</span></section>`;
        // Zahlen
        const km = `${s6Km(D.kmDone)} <small>${D.km ? "/ " + s6Km(D.km) + " km" : "km"}</small>`,
          rp = D.ar === "–" ? "—" : D.ar;
        const kp = `<section class="s6-kp" aria-label="Zahlen"><div class="d4"><span>Einheiten</span><b>${D.ok}/${D.plan}</b></div><div><span>Laufen</span><b>${km}</b></div><div class="d4"><span>Kraft + Stationen</span><b>${D.ksOk}/${D.ks}</b></div><div><span>Ø RPE</span><b>${rp}</b></div><div class="m3"><span>Saison</span><b>${w + 1} <small>von ${NWEEKS} Wo</small></b></div></section>`;
        const more = `<details class="s6-more"><summary>Weitere Auswertungen</summary><div class="s6-more-b">${vReview(true)}</div></details>`;
        return `<div class="s6 s6-rv">${top}<div class="s6-rv-hd">${title}${arrows.replace('class="s6-round"', 'class="s6-round s6-rv-darrows"')}</div><div class="s6-rv-2">${verdict}${s7ProgCard()}</div><div class="s6-rv-3">${daysSec}${season}</div>${kp}</div>`;
      }
      /* ---- Plan ---- */
      const S6_BSHORT = {
        A: "Standort",
        B: "Build I",
        C: "Build II",
        D: "Peak",
        T: "Taper",
      };
      function s6Plan() {
        const P = PLAN(),
          cur = weekInfo(CURW).block,
          blocks = blockOverview(P);
        const info = blocks.map((b, j) => {
          const s = Math.max(0, b.start),
            end = j === blocks.length - 1 ? LAST : Math.min(b.end, LAST);
          let plan = 0,
            ok = 0;
          for (let i = s; i <= end; i++) {
            const p = dayPlan(i);
            if (!p || p.k === "rest") continue;
            plan++;
            const { n, done } = dayStatus(i),
              e = rc().byDay[i];
            if ((n && done === n) || (e && e.match)) ok++;
          }
          const nw = Math.floor(end / 7) - Math.floor(s / 7) + 1,
            frac = Math.max(0, Math.min(1, (TODAY - s + 1) / (end - s + 1)));
          return {
            b,
            s,
            end,
            plan,
            ok,
            nw,
            frac,
            nm: esc(per(b.name)).replace(" – ", " · "),
            cur: b.id === cur,
          };
        });
        const total = info.reduce((a, x) => a + x.plan, 0),
          left = Math.max(0, Math.ceil((RACE - midnight(NOW)) / dayMs)),
          rng = (x) => `${fmt(dateFromIdx(x.s))} – ${fmt(dateFromIdx(x.end))}`;
        const body = (x) => {
          let h = `<div class="blk-body">`;
          for (let w = Math.floor(x.s / 7); w <= Math.floor(x.end / 7); w++) {
            const wi = weekInfo(w),
              a = Math.max(x.s, w * 7),
              z = Math.min(x.end, w * 7 + 6),
              nm =
                per(wi.name) !== per(x.b.name) ? ` · ${esc(per(wi.name))}` : "";
            h += `<div class="pw-h ${w === CURW && TODAY >= 0 ? "cur" : ""}"><h3>Woche ${w + 1}</h3><span class="sub">${fmt(dateFromIdx(a))} – ${fmt(dateFromIdx(z))} · ${esc(wi.wave)}${nm}</span></div>`;
            for (let i = a; i <= z; i++) h += planDayRow(i);
          }
          return h + `</div>`;
        };
        const chev = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9ba3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
        const seg = info
          .map(
            (x) =>
              `<span style="flex:${x.nw} 1 0">${x.cur ? `<i style="width:${Math.round(x.frac * 100)}%"></i>` : ""}</span>`,
          )
          .join("");
        const mHero = `<section class="s6-card s6-ph"><span class="s6-kick">Der Weg nach Basel</span><div class="r"><div><h1 class="s6-h1">Doubles Men PRO</h1><span class="s6-sub">mit Jimoh · Sa 13.02.2027</span></div><div class="goal"><b>&lt; 60:00</b><span>Ziel</span></div></div><div class="s6-pbar" role="img" aria-label="Planverlauf: Woche ${CURW + 1} von ${NWEEKS}"><div class="seg">${seg}</div><div class="cp"><span>Woche ${CURW + 1} von ${NWEEKS}</span><span>${left} ${left === 1 ? "Tag" : "Tage"}</span></div></div></section>`;
        let rows = "";
        info.forEach((x, j) => {
          const on = planBlk === x.b.id;
          rows += `<button type="button" class="s6-blk${x.cur ? " cur" : ""}${j === info.length - 1 && !on ? " lastrow" : ""}" data-pb="${esc(x.b.id)}" aria-expanded="${on}"><span class="l">${esc(x.b.id)}</span><span class="t"><span>${x.nm}</span><span>${rng(x)} · ${x.nw} Wo · ${x.ok}/${x.plan}</span></span>${x.cur ? `<span class="now">Jetzt</span>` : chev}</button>${on ? `<div class="s6-pbody">${body(x)}</div>` : ""}`;
        });
        const srcTxt = P.importedAt
          ? `Quelle: ${esc(P.name || "Plan")}, importiert am ${new Date(P.importedAt).toLocaleDateString("de-CH")}.`
          : `Quelle: Eingebauter Plan (Stand 18.09.2026). Jeder Block: moderat → hart → Spitzenreiz → Deload.`;
        // Desktop
        const wsum = info.reduce((a, x) => a + x.nw, 0),
          posPct = (
            ((Math.max(0, CURW) + (TODAY >= 0 ? dow(TODAY) / 7 : 0)) / wsum) *
            100
          ).toFixed(1);
        const bars = info
          .map(
            (x) =>
              `<div class="${x.cur ? "cur" : ""}" style="flex:${x.nw} 1 0">${x.b.id} · ${S6_BSHORT[x.b.id] || esc(x.nm.split(" · ")[0])}</div>`,
          )
          .join("");
        const dts = [
          fmt(dateFromIdx(info[0].s)),
          `Heute · Woche ${CURW + 1}`,
          ...info.slice(1).map((x) => fmt(dateFromIdx(x.s))),
          `${fmt(RACE)} · Rennen`,
        ];
        const cards = info
          .map(
            (x) =>
              `<button type="button" class="s6-bcard${x.cur ? " cur" : ""}" data-pb="${esc(x.b.id)}" aria-expanded="${planBlk === x.b.id}"><span class="l">${esc(x.b.id)}</span><span class="n">${x.nm}</span><span class="d">${fmt(dateFromIdx(x.s))} – ${fmt(dateFromIdx(x.end))} · ${x.nw} Wochen</span><span class="p">${x.ok} / ${x.plan} ${x.cur ? "erledigt" : "Einheiten"}</span>${x.cur ? `<span class="pb"><i style="width:${x.plan ? Math.max(2, Math.round((x.ok / x.plan) * 100)) : 0}%"></i></span>` : ""}</button>`,
          )
          .join("");
        const open = info.find((x) => x.b.id === planBlk);
        const dsk = `<div class="s6-pd"><div class="s6-pdh"><div><span class="s6-kick">Der Weg nach Basel</span><h1>Doubles Men PRO mit Jimoh</h1><span class="sb">Sa 13.02.2027 · ${NWEEKS} Wochen · ${total} Einheiten</span></div><div class="rt"><div class="goal"><b>&lt; 60:00</b><span>Ziel</span></div><button type="button" class="s6-btn" data-v="import">Neues PDF importieren</button></div></div>
    <section class="s6-card s6-tl" aria-label="Zeitleiste"><div class="bars">${bars}<u aria-hidden="true" style="left:${posPct}%"></u></div><div class="dt">${dts.map((t) => `<span>${t}</span>`).join("")}</div></section>
    <section class="s6-bc">${cards}</section>${open ? `<div class="s6-pdbody">${body(open)}</div>` : ""}</div>`;
        return `<div class="s6 s6-plan">${S6_BACK}${mHero}<section class="s6-card s6-blks" aria-label="Blöcke">${rows}</section>${dsk}<p class="s6-src">${srcTxt}</p><p class="s6-src m"><button type="button" data-v="import">Neuen Plan importieren</button></p></div>`;
      }
      /* ---- Profil ---- */
      function s6Profile() {
        const own = profWho === "me";
        const tab = (id, label) =>
          `<button type="button" role="tab" data-act="prof-who" data-who-p="${id}" class="${profWho === id ? "on" : ""}" aria-selected="${profWho === id}">${esc(label)}</button>`;
        // Konto
        let acct = "";
        if (own) {
          if (sb && USER)
            acct = {
              ini: ME[0],
              name: ME,
              sub: `<span class="acct-sync">${syncLabel()}</span>`,
              btn: `<button type="button" class="s6-btn" data-act="logout">Abmelden</button>`,
            };
          else {
            const m = !CLOUD ? mockUser() : null;
            acct = m
              ? {
                  ini: m.name[0],
                  name: m.name,
                  sub: `<span>Vorschau-Login · nur dieses Gerät</span>`,
                  btn: `<button type="button" class="s6-btn" data-act="logout">Abmelden</button>`,
                }
              : {
                  ini: ME[0],
                  name: "Nicht angemeldet",
                  sub: `<span>Einträge bleiben auf diesem Gerät</span>`,
                  btn: `<button type="button" class="s6-btn" data-v="login">Anmelden</button>`,
                };
          }
        } else {
          const src = PP
            ? PP.at
              ? `Stand ${new Date(PP.at).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })}`
              : ""
            : sb && USER
              ? ppState === "busy"
                ? "Wird geladen …"
                : ppState === "err"
                  ? "Konnte nicht geladen werden."
                  : `${esc(PARTNER)} hat noch keine Werte gespeichert.`
              : "Vorschau ohne Cloud: zeigt nur ältere Einträge auf diesem Gerät.";
          acct = {
            ini: PARTNER[0],
            name: PARTNER,
            sub: `<span>Nur lesen · ${src}</span>`,
            btn: "",
          };
        }
        const acctCard = `<section class="s6-card s6-acct" aria-label="Konto"><div class="ac1"><span class="av2" aria-hidden="true">${esc(acct.ini)}</span><span class="tx"><b>${esc(acct.name)}</b>${acct.sub}</span></div>${acct.btn}</section>`;
        const W = own ? S.weights : PP ? PP.weights : {};
        const rows = weightList(Object.values(PLAN().days))
          .map(
            (e) =>
              `<div class="r"><label for="w-${esc(e.key)}">${esc(e.label)}</label>${pin(own ? `id="w-${esc(e.key)}" data-w="${esc(e.key)}"` : "", W[e.key], e.label + " kg", "—")}<span class="u">kg</span></div>`,
          )
          .join("");
        const wh = `<section class="s6-wh" aria-label="Arbeitsgewichte"><div class="hd"><span class="s6-kick mk">Arbeitsgewichte</span><span class="ttl">Standard-Arbeitsgewichte</span><span><span class="mk">Vorschlag im Training</span><span class="dk">Vorschlag im Training · jederzeit überschreibbar</span></span></div><div class="s6-card s6-wl">${rows}</div></section>`;
        const trow = `<button type="button" class="s6-trow" data-v="tests"><svg class="ti" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a9ba3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/></svg><span>Tests &amp; Benchmarks</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9ba3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`;
        return `<div class="s6 s6-prof"><div class="s6-lf">${S6_BACK}<h1 class="s6-h1">Profil &amp; Tests</h1><div class="s6-seg2" role="tablist" aria-label="Athlet">${tab("me", ME + " (ich)")}${tab("partner", PARTNER)}</div>${acctCard}${trow}</div>${wh}<div id="tests" class="s6-tests">${testsHtml(own)}</div></div>`;
      }
      /* ---- Backup ---- */
      const s6Page = (title, sub) =>
        `${S6_BACK}<div class="s6-ph2"><h1 class="s6-h1">${title}</h1>${sub ? `<p>${Array.isArray(sub) ? `<span class="s6-m">${sub[0]}</span><span class="s6-d">${sub[1]}</span>` : sub}</p>` : ""}</div>`;
      function s6Backup() {
        const cloud = sb && USER;
        let lastBk = 0;
        try {
          lastBk = +localStorage.getItem("hx_lastbackup") || 0;
        } catch {}
        const age = lastBk ? (Date.now() - lastBk) / 864e5 : 99;
        const ic = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
        const st = `<section class="s6-card s6-bst${age < 8 ? " ok" : ""}" role="status"><span class="ic">${ic}</span><span class="tx"><b>${lastBk ? "Letztes Backup: " + new Date(lastBk).toLocaleDateString("de-CH", { day: "numeric", month: "short", year: "numeric" }) : "Noch kein Backup auf diesem Gerät"}</b><span>${cloud ? "Angemeldet: Einträge liegen zusätzlich in der Cloud." : "Nicht angemeldet: Daten liegen nur auf diesem Gerät."}</span></span></section>`;

        } else
          rest = `<section class="s6-card s6-bk"><div class="t"><h2>Wiederherstellen</h2><p><span class="dz-m">Eine gesicherte .json wählen. Vor dem Überschreiben siehst du, was drin ist.</span><span class="dz-t">Eine gesicherte .json wählen oder hierher ziehen. Vor dem Überschreiben siehst du, was drin ist.</span></p></div><label class="s6-btn dz-m">Datei wählen<input type="file" accept=".json,application/json,text/plain" data-file="backup"></label><label class="dz dz-t s6-dz">Datei hier ablegen oder <b>auswählen</b><input type="file" accept=".json,application/json,text/plain" data-file="backup" style="position:absolute;width:1px;height:1px;opacity:0"></label></section>`;
        return `<div class="s6 s6-page">${s6Page("Backup", "Alle Einträge als Datei sichern, z. B. vor einem Handywechsel.")}${st}<div class="s6-two">${save}${rest}</div>${cloud && !bkp ? historyCard() : ""}</div>`;

      /* ---- Verbindungen ---- */
      function s6Strava() {

            : `<details open><summary>Eigene API-App einrichten (Client-ID, Secret)</summary><p class="sub" style="margin:8px 0 0">Einmalig eine Strava-API-App anlegen (strava.com/settings/api, Callback-Domain: <b class="brk">${esc(location.hostname || "localhost")}</b>). Beides bleibt nur auf diesem Gerät.</p><label class="lbl" for="st-id">Client-ID</label><input type="text" id="st-id" inputmode="numeric" value="${esc(cfg.clientId)}" autocomplete="off"><label class="lbl" for="st-sec">Client Secret</label><input type="password" id="st-sec" value="${esc(cfg.secret)}" autocomplete="off"></details>`;
          sBody = `<div class="hd"><span class="lg" style="background:var(--strava)">S</span><span class="nm"><b>Strava</b><span>Nicht verbunden</span></span></div>${chk(["Passende Aktivitäten als erledigt übernehmen", "Anderer Tag? Die App schlägt vor, den Plan nachzuziehen", "Gilt nur für dein Konto"])}${stMsg && !stBad ? `<p class="msg">${esc(stMsg)}</p>` : ""}<button type="button" class="s6-btn gold" data-act="st-connect" ${stBusy ? "disabled" : ""}>${stBusy ? "Verbinde …" : "Mit Strava verbinden"}</button>${api}`;

        let gmRest;
        if (!(sb && USER))
          gmRest = `<p class="msg">Garmin geht nur mit Cloud-Login (die Zugangsdaten liegen verschlüsselt auf dem Server).</p>`;
        else if (gmOn()) gmRest = garminCard(true);
        else
          gmRest = `<details class="gm" ${gmMfa || gmBusy || gmMsg ? "open" : ""}><summary class="gm-btn">Mit Garmin verbinden</summary>${garminCard(true)}</details>`;
        const csv = `<section class="s6-card s6-cn"><b>Strava ohne Verbindung: Datei importieren</b><p class="msg">Strava → Einstellungen → Mein Konto → „Account-Daten herunterladen“. Aus dem ZIP die Datei <b>activities.csv</b> wählen.</p><label class="s6-btn file">activities.csv auswählen<input type="file" accept=".csv,.json,text/csv,application/json" data-file="strava" style="position:absolute;width:1px;height:1px;opacity:0"></label></section>`;
        const acts = Object.values(S.strava.acts)
          .sort((a, b) => (a.date < b.date ? 1 : -1))
          .slice(0, 30);
        const movedTo = new Map(rc().moved.map((m) => [m.act.id, m.from]));
        let list = `<div class="cap" style="margin:8px 0 0">Aktivitäten (${Object.keys(S.strava.acts).length})</div>`;
        if (!acts.length) list += `<p class="sub">Noch keine Aktivitäten.</p>`;
        else {
          list += `<div class="list">`;
          for (const a of acts) {
            const i = idxOfIso(a.date),
              d = isoToDate(a.date),

            let st = `<span class="sub">ausserhalb des Plans</span>`;
            if (p)
              st =
                e && e.match && strava.fits(p.k, a.group)
                  ? `<span class="badge ok">passt</span> <span class="sub">${esc(p.t)}</span>`
                  : movedTo.has(a.id)
                    ? `<span class="badge mv">passt zu ${shortDay(movedTo.get(a.id))}</span>`
                    : `<span class="sub">Plan: ${esc(p.t)}</span>`;
            list += `<div class="act"><div class="d">${DAYS[(d.getDay() + 6) % 7]}<b>${d.getDate()}</b></div><div><b>${esc(a.name || strava.SPORT_LABEL[a.group])}</b> <span class="badge ${srcCls(a)}">${srcName(a)}</span><div class="sub">${esc(strava.summary(a))}</div><div class="mt-1">${st}</div></div></div>`;
